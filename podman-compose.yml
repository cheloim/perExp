services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses_user -d expenses"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  backend_dev:
    build:
      context: ./src/backend
      target: dev
    user: "1000:1000"
    secrets:
      - creditcard_backend_dev_postgres_password
      - creditcard_backend_dev_llm_api_key
      - creditcard_backend_dev_investments_llm_api_key
      - creditcard_backend_dev_messages_bot_llm_api_key
      - creditcard_backend_dev_telegram_bot_token
      - creditcard_backend_dev_google_client_id
      - creditcard_backend_dev_google_client_secret
      - creditcard_backend_dev_secret_key
      - creditcard_backend_dev_email_api_key
      - creditcard_backend_dev_whatsapp_token
      - creditcard_backend_dev_whatsapp_phone_id
      - creditcard_backend_dev_whatsapp_verify_token
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD_DEV}@db:5432/expenses
      REDIS_URL: redis://redis:6379/1
      PYTHONUNBUFFERED: "1"
      SMTP_FROM: ${SMTP_FROM:-NikoFin}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@resend.dev}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./src/backend/app:/app/app:z
      - ./src/backend/main.py:/app/main.py:z
      - ./src/backend/scripts:/app/scripts:z
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  frontend_dev:
    build:
      context: ./src/frontend
      target: dev
    secrets:
      - creditcard_frontend_dev_google_client_id
    volumes:
      - ./src/frontend/src:/app/src:Z
      - ./src/frontend/index.html:/app/index.html:Z
    ports:
      - "8082:5173"
    environment:
      VITE_API_URL: http://localhost:8001
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  celery_worker_dev:
    build:
      context: ./src/backend
      target: dev
    user: "1000:1000"
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    secrets:
      - creditcard_backend_dev_postgres_password
      - creditcard_backend_dev_llm_api_key
      - creditcard_backend_dev_investments_llm_api_key
      - creditcard_backend_dev_messages_bot_llm_api_key
      - creditcard_backend_dev_telegram_bot_token
      - creditcard_backend_dev_google_client_id
      - creditcard_backend_dev_google_client_secret
      - creditcard_backend_dev_secret_key
      - creditcard_backend_dev_email_api_key
      - creditcard_backend_dev_whatsapp_token
      - creditcard_backend_dev_whatsapp_phone_id
      - creditcard_backend_dev_whatsapp_verify_token
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD_DEV}@db:5432/expenses
      REDIS_URL: redis://redis:6379/1
      PYTHONUNBUFFERED: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nikofin.com}
      SMTP_FROM: ${SMTP_FROM:-NikoFin}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@resend.dev}
    volumes:
      - ./src/backend/app:/app/app:z
      - ./src/backend/main.py:/app/main.py:z
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  celery_beat_dev:
    build:
      context: ./src/backend
      target: dev
    user: "1000:1000"
    command: celery -A app.celery_app beat --loglevel=info
    secrets:
      - creditcard_backend_dev_postgres_password
      - creditcard_backend_dev_llm_api_key
      - creditcard_backend_dev_investments_llm_api_key
      - creditcard_backend_dev_messages_bot_llm_api_key
      - creditcard_backend_dev_telegram_bot_token
      - creditcard_backend_dev_google_client_id
      - creditcard_backend_dev_google_client_secret
      - creditcard_backend_dev_secret_key
      - creditcard_backend_dev_email_api_key
      - creditcard_backend_dev_whatsapp_token
      - creditcard_backend_dev_whatsapp_phone_id
      - creditcard_backend_dev_whatsapp_verify_token
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD_DEV}@db:5432/expenses
      REDIS_URL: redis://redis:6379/1
      PYTHONUNBUFFERED: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nikofin.com}
      SMTP_FROM: ${SMTP_FROM:-NikoFin}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@resend.dev}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./src/backend/app:/app/app:z
      - ./src/backend/main.py:/app/main.py:z
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://expenses_user:${POSTGRES_PASSWORD_DEV}@db:5432/expenses?sslmode=disable"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  node-exporter:
    image: docker.io/prom/node-exporter:latest
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:latest
    command:
      - "-nginx.scrape-uri=http://nginx:8080/stub_status"
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  blackbox-exporter:
    image: docker.io/prom/blackbox-exporter:latest
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"

  alloy:
    image: docker.io/grafana/alloy:latest
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER}
      GRAFANA_CLOUD_PROMETHEUS_PASSWORD: ${GRAFANA_CLOUD_PROMETHEUS_PASSWORD}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_LOKI_PASSWORD: ${GRAFANA_CLOUD_LOKI_PASSWORD}
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro,z
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/containers/:/var/lib/containers:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

secrets:
  creditcard_backend_dev_postgres_password:
    external: true
    env: POSTGRES_PASSWORD_DEV
  creditcard_backend_dev_llm_api_key:
    external: true
    env: LLM_API_KEY_DEV
  creditcard_backend_dev_investments_llm_api_key:
    external: true
    env: INVESTMENTS_LLM_API_KEY_DEV
  creditcard_backend_dev_messages_bot_llm_api_key:
    external: true
    env: MESSAGES_BOT_LLM_API_KEY_DEV
  creditcard_backend_dev_telegram_bot_token:
    external: true
    env: TELEGRAM_BOT_TOKEN_DEV
  creditcard_backend_dev_google_client_id:
    external: true
    env: GOOGLE_CLIENT_ID_DEV
  creditcard_backend_dev_google_client_secret:
    external: true
    env: GOOGLE_CLIENT_SECRET_DEV
  creditcard_backend_dev_secret_key:
    external: true
    env: SECRET_KEY_DEV
  creditcard_backend_dev_email_api_key:
    external: true
    env: EMAIL_API_KEY_DEV
  creditcard_backend_dev_whatsapp_token:
    external: true
    env: WHATSAPP_TOKEN_DEV
  creditcard_backend_dev_whatsapp_phone_id:
    external: true
    env: WHATSAPP_PHONE_ID_DEV
  creditcard_backend_dev_whatsapp_verify_token:
    external: true
    env: WHATSAPP_VERIFY_TOKEN_DEV
  creditcard_frontend_dev_google_client_id:
    external: true
    env: GOOGLE_CLIENT_ID_DEV

volumes:
  postgres_data:
  redis_data:
  alloy_data:
