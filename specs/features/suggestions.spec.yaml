feature: suggestions
domain: AI Category Suggestions
type: full
version: "1.0.0"
status: implemented
owner: full-stack
created: 2026-08-16
updated: 2026-08-16
github_issue: null

description: >
  Provides AI-powered category suggestions based on expense descriptions.
  When an expense is created without a category (or with low confidence),
  the system queries Gemini Flash to suggest the most appropriate category.
  Suggestions are stored and presented to the user for accept/reject.
  High-confidence suggestions can be auto-applied.

requirements:
  - "User must be authenticated"
  - "At least one category must exist in the system"
  - "Gemini Flash API key must be configured"
  - "Expense descriptions must be non-empty for suggestions"

pre_evaluation:
  questions:
    - question: "When are suggestions generated?"
      answer: "When an expense is created without a category_id or when user requests one"
    - question: "What is the confidence threshold for auto-apply?"
      answer: "Suggestions with confidence >= 0.9 are auto-applied"
    - question: "Can users train the system?"
      answer: "Accepting/rejecting suggestions improves future accuracy via history"

users:
  - role: "authenticated_user"
    description: "Any logged-in user receives and manages category suggestions"
    permissions:
      - "view_suggestions"
      - "accept_suggestion"
      - "reject_suggestion"

entities:
  - name: "CategorySuggestion"
    table: "category_suggestions"
    description: "An AI-generated category suggestion for an expense"
    fields:
      - name: "id"
        type: "integer"
        primary_key: true
        auto_increment: true
      - name: "description"
        type: "text"
        required: true
        description: "The expense description that triggered the suggestion"
      - name: "suggested_category_id"
        type: "integer"
        foreign_key: "categories.id"
        required: true
        description: "The category suggested by the AI"
      - name: "user_id"
        type: "integer"
        foreign_key: "users.id"
        required: true
      - name: "accepted"
        type: "boolean"
        default: null
        description: "null=pending, true=accepted, false=rejected"
    indexes:
      - columns: ["user_id"]
      - columns: ["user_id", "accepted"]

endpoints:
  - method: "GET"
    path: "/suggestions"
    description: "List pending category suggestions for the user"
    auth: "required"
    query_params:
      - name: "status"
        type: "string"
        enum: ["pending", "accepted", "rejected", "all"]
        required: false
        default: "pending"
    response:
      status: 200
      body:
        suggestions: "array of CategorySuggestion objects"

  - method: "POST"
    path: "/suggestions/{id}/accept"
    description: "Accept a suggestion and apply the category to the expense"
    auth: "required"
    path_params:
      - name: "id"
        type: "integer"
        required: true
    response:
      status: 200
      body:
        suggestion: "Updated CategorySuggestion object"
        expense: "Updated Expense object"
    errors:
      - status: 404
        description: "Suggestion not found"

  - method: "POST"
    path: "/suggestions/{id}/reject"
    description: "Reject a suggestion"
    auth: "required"
    path_params:
      - name: "id"
        type: "integer"
        required: true
    response:
      status: 200
      body:
        suggestion: "Updated CategorySuggestion object"
    errors:
      - status: 404
        description: "Suggestion not found"

business_rules:
  - name: "LLM-Powered Suggestions"
    description: "Category suggestions are generated by Gemini Flash based on expense description and user's existing categories"
  - name: "Auto-Apply Threshold"
    description: "Suggestions with confidence >= 0.9 are automatically applied to the expense"
  - name: "Pending Queue"
    description: "Suggestions below the confidence threshold are queued for manual user review"
  - name: "Accept Action"
    description: "Accepting a suggestion applies the category_id to the associated expense"
  - name: "Reject Action"
    description: "Rejecting a suggestion marks it as rejected; the expense remains uncategorized"
  - name: "User Context"
    description: "The LLM considers the user's existing categories and past accept/reject history for better suggestions"

frontend:
  components:
    - name: "SuggestionsPanel"
      path: "frontend/src/components/SuggestionsPanel.tsx"
      description: "Panel showing pending category suggestions with accept/reject buttons"
    - name: "SuggestionCard"
      path: "frontend/src/components/SuggestionCard.tsx"
      description: "Individual suggestion display with category name and confidence"

integrations:
  - name: "Gemini Flash"
    type: "llm"
    description: "Google Gemini Flash model for category suggestion generation"
    config:
      api_key_env: "GEMINI_API_KEY"
      model: "gemini-flash"

migrations: []

tests:
  - name: "Suggestion generated for uncategorized expense"
    type: "integration"
    description: "Creating an expense without a category triggers a suggestion"
    steps:
      - "Create expense with description 'Supermercado Coto' and no category_id"
      - "GET /suggestions"
      - "Assert a suggestion exists for this expense"
    expected: "Suggestion created with appropriate category"

  - name: "Accept suggestion applies category"
    type: "integration"
    description: "Accepting a suggestion updates the expense's category"
    steps:
      - "Get a pending suggestion"
      - "POST /suggestions/{id}/accept"
      - "GET /expenses/{expense_id} — assert category_id is set"
    expected: "Expense category updated"

  - name: "Reject suggestion does not change expense"
    type: "integration"
    description: "Rejecting a suggestion leaves the expense uncategorized"
    steps:
      - "Get a pending suggestion"
      - "POST /suggestions/{id}/reject"
      - "GET /expenses/{expense_id} — assert category_id is still null"
    expected: "Expense remains uncategorized"

  - name: "High confidence auto-applies"
    type: "integration"
    description: "Suggestions with high confidence are auto-applied"
    steps:
      - "Create expense with description that clearly maps to a category"
      - "Assert expense.category_id is set automatically"
      - "GET /suggestions — assert no pending suggestion for this expense"
    expected: "Category applied without manual review"

  - name: "Suggestions scoped to user"
    type: "integration"
    description: "Users only see their own suggestions"
    steps:
      - "User A and User B each create uncategorized expenses"
      - "Authenticate as User A"
      - "GET /suggestions — assert only User A's suggestions"
    expected: "No cross-user suggestion leakage"

documentation:
  - type: "api"
    description: "Suggestion endpoints documented in OpenAPI spec"
  - type: "integration"
    description: "Gemini Flash configuration for category suggestions"

changelog:
  - version: "1.0.0"
    date: "2026-08-16"
    changes:
      - "Initial AI category suggestions implementation"
      - "Gemini Flash integration for suggestion generation"
      - "Accept/reject workflow"
      - "Auto-apply for high-confidence suggestions"
