components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── AUTH ─────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    Token:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        email_verified:
          type: boolean
        onboarding_completed:
          type: boolean
        mfa_enabled:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time

    TelegramKeyResponse:
      type: object
      properties:
        telegram_key:
          type: string

    TelegramStatusResponse:
      type: object
      properties:
        linked:
          type: boolean
        chat_id:
          type: string
          nullable: true

    # ─── ACCOUNTS ─────────────────────────────────────────────
    AccountCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [efectivo, cuenta_corriente, caja_ahorro, mercadopago, otro]
          default: efectivo

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [efectivo, cuenta_corriente, caja_ahorro, mercadopago, otro]

    AccountResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time

    # ─── CARDS ────────────────────────────────────────────────
    CardCreate:
      type: object
      required: [card_name]
      properties:
