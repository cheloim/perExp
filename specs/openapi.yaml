openapi: 3.0.3
info:
  title: Oikonomia API
  version: 1.0.0
  description: |
    **Oikonomia** (Credit Card Analyzer) — Personal finance management platform for Argentine users.

    ## Architecture
    - **Backend**: FastAPI (Python) with PostgreSQL, Redis, and Celery
    - **Frontend**: Vite + React SPA
    - **Integrations**: Telegram Bot, WhatsApp Bot, Gemini Flash (AI), Yahoo Finance, IOL/PPI brokers

    ## Key Features
    - Expense & income tracking with encrypted fields (AES-256)
    - Credit/debit card management with billing cycle tracking
    - Hierarchical category system with auto-categorization
    - Budget management with 50/30/20 rule support
    - Investment portfolio tracking with auto price refresh
    - AI-powered spending analysis (Gemini Flash)
    - Smart CSV/PDF bank statement import
    - Family group sharing
    - Real-time SSE notifications
    - Scheduled/recurring expense automation
    - Telegram & WhatsApp bot integrations
    - Admin panel with impersonation and audit logging

    ## Security
    - JWT authentication (access + refresh tokens)
    - TOTP-based MFA
    - Field-level AES-256 encryption
    - HMAC for searchable encrypted fields
    - Rate limiting on sensitive endpoints
  contact:
    name: Oikonomia Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8001
    description: Local development
  - url: https://platform.oikonomia.ar
    description: Production

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication, registration, OAuth, password management
  - name: mfa
    description: Multi-factor authentication (TOTP)
  - name: accounts
    description: Bank accounts and digital wallets CRUD
  - name: cards
    description: Credit and debit card management
  - name: categories
    description: Hierarchical expense categories
  - name: card-closings
    description: Card billing period configurations
  - name: expenses
    description: Expense and income tracking, analytics
  - name: investments
    description: Investment portfolio management
  - name: import-jobs
    description: CSV/PDF bank statement import pipeline
  - name: dashboard
    description: Aggregated spending summaries and KPIs
  - name: analysis
    description: AI-powered spending analysis (Gemini Flash)
  - name: groups
    description: Family group management
  - name: notifications
    description: Real-time SSE notifications
  - name: scheduled-expenses
    description: Recurring scheduled expense automation
  - name: budgets
    description: Budget limits, groups, and events
  - name: suggestions
    description: AI category suggestions
  - name: recurring
    description: Auto-detected recurring expense patterns
  - name: admin
    description: Admin panel, user management, audit logs
  - name: whatsapp
    description: WhatsApp Business API webhook

paths:
  # ─────────────────────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      summary: Register new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Duplicate email or validation error

  /auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited

  /auth/login/mfa:
    post:
      tags: [auth, mfa]
      summary: Complete MFA login with TOTP code
      operationId: loginMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, code]
              properties:
                token:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: MFA verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /auth/oauth:
    post:
      tags: [auth]
      summary: Login/register via OAuth provider
      operationId: oauthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider:
                  type: string
                  enum: [google, apple]
                token:
                  type: string
      responses:
        '200':
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request password reset email
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password with token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token

  /auth/password:
    put:
      tags: [auth]
      summary: Change password (authenticated)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password changed

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user profile
      operationId: getProfile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags: [auth]
      summary: Delete current user account
      operationId: deleteAccount
      responses:
        '204':
          description: Account deleted

  /auth/me/onboarding:
    put:
      tags: [auth]
      summary: Mark onboarding as completed
      operationId: completeOnboarding
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verify email with token
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Resend verification email
      operationId: resendVerification
      responses:
        '200':
          description: Verification email sent

  /auth/me/telegram-key:
    get:
      tags: [auth]
      summary: Get Telegram linking key
      operationId: getTelegramKey
      responses:
        '200':
          description: Telegram key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramKeyResponse'

  /auth/me/telegram-key/regenerate:
    post:
      tags: [auth]
      summary: Regenerate Telegram linking key
      operationId: regenerateTelegramKey
      responses:
        '200':
          description: New Telegram key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramKeyResponse'

  /auth/me/telegram-status:
    get:
      tags: [auth]
      summary: Check Telegram linking status
      operationId: getTelegramStatus
      responses:
        '200':
          description: Telegram status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStatusResponse'

  # ─────────────────────────────────────────────────────────────
  # MFA
  # ─────────────────────────────────────────────────────────────
  /mfa/setup:
    post:
      tags: [mfa]
      summary: Generate TOTP secret and QR code
      operationId: mfaSetup
      responses:
        '200':
          description: MFA setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qr_uri:
                    type: string

  /mfa/enable:
    post:
      tags: [mfa]
      summary: Enable MFA with TOTP verification
      operationId: mfaEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: MFA enabled

  /mfa/disable:
    post:
      tags: [mfa]
      summary: Disable MFA
      operationId: mfaDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: MFA disabled

  # ─────────────────────────────────────────────────────────────
  # ACCOUNTS
  # ─────────────────────────────────────────────────────────────
  /accounts:
    get:
      tags: [accounts]
      summary: List accounts for user and group members
      operationId: listAccounts
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
    post:
      tags: [accounts]
      summary: Create a new account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'

  /accounts/{account_id}:
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [accounts]
      summary: Update an account
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
    delete:
      tags: [accounts]
      summary: Delete an account
      operationId: deleteAccount1
      responses:
        '204':
          description: Account deleted

  # ─────────────────────────────────────────────────────────────
  # CARDS
  # ─────────────────────────────────────────────────────────────
  /cards:
    get:
      tags: [cards]
      summary: List cards for user and group members
      operationId: listCards
      responses:
        '200':
          description: Card list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponse'
    post:
      tags: [cards]
      summary: Create a new card
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '409':
          description: Duplicate card detected

  /cards/sync-holders:
    post:
      tags: [cards]
      summary: Auto-assign holder from user full_name
      operationId: syncCardHolders
      responses:
        '200':
          description: Holders synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                  total_cards:
                    type: integer

  /cards/{card_id}:
    parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [cards]
      summary: Update a card
      operationId: updateCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpdate'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
    delete:
      tags: [cards]
      summary: Delete a card
      operationId: deleteCard
      responses:
        '204':
          description: Card deleted
        '400':
          description: Card has associated expenses

  # ─────────────────────────────────────────────────────────────
  # CATEGORIES
  # ─────────────────────────────────────────────────────────────
  /categories:
    get:
      tags: [categories]
      summary: List categories for current user
      operationId: listCategories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [categories]
      summary: Create a new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'

  /categories/apply-base-hierarchy:
    post:
      tags: [categories]
      summary: Seed base category hierarchy
      operationId: applyBaseHierarchy
      responses:
        '200':
          description: Hierarchy seeded

  /categories/seed-defaults:
    post:
      tags: [categories]
      summary: Seed default categories
      operationId: seedDefaults
      responses:
        '200':
          description: Defaults seeded

  /categories/suggest:
    post:
      tags: [categories]
      summary: Get LLM-based category suggestion
      operationId: suggestCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, amount]
              properties:
                description:
                  type: string
                amount:
                  type: number
      responses:
        '200':
          description: Suggestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuggestResponse'

  /categories/{cat_id}:
    parameters:
      - name: cat_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [categories]
      summary: Update a category
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
    delete:
      tags: [categories]
      summary: Delete a category
      operationId: deleteCategory
      responses:
        '200':
          description: Category deleted

  # ─────────────────────────────────────────────────────────────
  # CARD CLOSINGS
  # ─────────────────────────────────────────────────────────────
  /card-closings:
    get:
      tags: [card-closings]
      summary: List card closing configurations
      operationId: listCardClosings
      responses:
        '200':
          description: Card closing list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardClosingResponse'
    post:
      tags: [card-closings]
      summary: Create card closing configuration
      operationId: createCardClosing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardClosingCreate'
      responses:
        '201':
          description: Card closing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardClosingResponse'
        '409':
          description: Closing already exists for this card

  /card-closings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [card-closings]
      summary: Update card closing configuration
      operationId: updateCardClosing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardClosingUpdate'
      responses:
        '200':
          description: Card closing updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardClosingResponse'
    delete:
      tags: [card-closings]
      summary: Delete card closing configuration
      operationId: deleteCardClosing
      responses:
        '204':
          description: Card closing deleted

  # ─────────────────────────────────────────────────────────────
  # EXPENSES
  # ─────────────────────────────────────────────────────────────
  /expenses:
    get:
      tags: [expenses]
      summary: List expenses with filtering and pagination
      operationId: listExpenses
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: month
          in: query
          schema:
            type: string
          description: 'YYYY-MM format'
        - name: category_id
          in: query
          schema:
            type: integer
        - name: category_ids
          in: query
          schema:
            type: string
          description: Comma-separated IDs
        - name: uncategorized
          in: query
          schema:
            type: boolean
        - name: bank
          in: query
          schema:
            type: string
        - name: person
          in: query
          schema:
            type: string
        - name: card
          in: query
          schema:
            type: string
        - name: card_type
          in: query
          schema:
            type: string
        - name: installment
          in: query
          schema:
            type: boolean
        - name: account_id
          in: query
          schema:
            type: integer
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        '200':
          description: Expense list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
    post:
      tags: [expenses]
      summary: Create a new expense
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'

  /expenses/uncategorized-count:
    get:
      tags: [expenses]
      summary: Count expenses without category
      operationId: uncategorizedCount
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /expenses/distinct-values:
    get:
      tags: [expenses]
      summary: Get distinct values for filtering UI
      operationId: distinctValues
      responses:
        '200':
          description: Distinct values

  /expenses/card-options:
    get:
      tags: [expenses]
      summary: Get card options for expense form
      operationId: cardOptions
      responses:
        '200':
          description: Card options

  /expenses/check-duplicate:
    get:
      tags: [expenses]
      summary: Check if expense already exists
      operationId: checkDuplicate
      responses:
        '200':
          description: Duplicate check result

  /expenses/bulk-delete:
    post:
      tags: [expenses]
      summary: Delete multiple expenses by ID list
      operationId: bulkDeleteExpenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /expenses/bulk-category:
    post:
      tags: [expenses]
      summary: Assign category to multiple expenses
      operationId: bulkCategoryExpenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, category_id]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                category_id:
                  type: integer
      responses:
        '200':
          description: Bulk category result
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer

  /expenses/recategorize:
    post:
      tags: [expenses]
      summary: Re-run auto-categorization on uncategorized expenses
      operationId: recategorizeExpenses
      responses:
        '200':
          description: Recategorization complete

  /expenses/detect-installments:
    post:
      tags: [expenses]
      summary: Detect installment patterns
      operationId: detectInstallments
      responses:
        '200':
          description: Detection complete

  /expenses/stats:
    get:
      tags: [expenses]
      summary: Expense statistics summary
      operationId: expenseStats
      responses:
        '200':
          description: Stats

  /expenses/by-category:
    get:
      tags: [expenses]
      summary: Breakdown by category
      operationId: expensesByCategory
      responses:
        '200':
          description: Category breakdown

  /expenses/by-person:
    get:
      tags: [expenses]
      summary: Breakdown by card holder
      operationId: expensesByPerson
      responses:
        '200':
          description: Person breakdown

  /expenses/trend:
    get:
      tags: [expenses]
      summary: Monthly spending trend
      operationId: expenseTrend
      responses:
        '200':
          description: Trend data

  /expenses/{exp_id}:
    parameters:
      - name: exp_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [expenses]
      summary: Update an expense
      operationId: updateExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
      responses:
        '200':
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
    delete:
      tags: [expenses]
      summary: Delete an expense
      operationId: deleteExpense
      responses:
        '204':
          description: Expense deleted

  # ─────────────────────────────────────────────────────────────
  # INVESTMENTS
  # ─────────────────────────────────────────────────────────────
  /investments:
    get:
      tags: [investments]
      summary: List all investments
      operationId: listInvestments
      responses:
        '200':
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentListResponse'
    post:
      tags: [investments]
      summary: Add a new investment
      operationId: createInvestment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentCreate'
      responses:
        '201':
          description: Investment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentResponse'

  /investments/refresh:
    get:
      tags: [investments]
      summary: Trigger manual price refresh
      operationId: refreshPrices
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                  errors:
                    type: integer

  /investments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [investments]
      summary: Update an investment
      operationId: updateInvestment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentUpdate'
      responses:
        '200':
          description: Investment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentResponse'
    delete:
      tags: [investments]
