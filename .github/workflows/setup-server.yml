name: Setup Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm host setup"
        required: true
        default: "no"

permissions:
  contents: read

env:
  NETWORK_NAME: oikonomia

jobs:
  setup-server:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'yes'

    steps:
      - name: Bootstrap server (podman, firewalld, directories)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            set -e

            echo "=== Installing podman and podman-compose ==="
            if ! command -v podman &> /dev/null; then
                echo "Installing podman..."
                sudo dnf install -y podman podman-docker
                sudo systemctl enable --now podman.socket
            else
                echo "podman already installed, skipping"
            fi

            if ! command -v podman-compose &> /dev/null; then
                echo "Installing podman-compose..."
                sudo dnf install -y python3-pip
                pip3 install --user podman-compose
            else
                echo "podman-compose already installed, skipping"
            fi

            echo "=== Configuring firewall ==="
            SSH_PORT="${{ vars.SSH_PORT || '43422' }}"
            if ! command -v firewall-cmd &> /dev/null; then
                echo "Installing firewalld..."
                sudo dnf install -y firewalld
                # Use firewall-offline-cmd to write rules BEFORE starting the daemon
                # (firewall-cmd --permanent requires a running daemon, offline-cmd does not)
                sudo firewall-offline-cmd --zone=public --add-port=${SSH_PORT}/tcp
                sudo firewall-offline-cmd --zone=public --add-port=80/tcp
                sudo firewall-offline-cmd --zone=public --add-port=443/tcp
                echo "Ports ${SSH_PORT}, 80, 443 written to firewall config"
                # Now start — rules are already in the zone file
                sudo systemctl enable --now firewalld
                echo "Firewall started. Ports: $(firewall-cmd --list-ports)"
            else
                # firewalld already installed — ensure ports are open
                if ! firewall-cmd --list-ports | grep -q "80/tcp"; then
                    echo "Opening port 80..."
                    sudo firewall-cmd --permanent --add-port=80/tcp
                fi
                if ! firewall-cmd --list-ports | grep -q "443/tcp"; then
                    echo "Opening port 443..."
                    sudo firewall-cmd --permanent --add-port=443/tcp
                fi
                sudo firewall-cmd --reload
                echo "Firewall ports: $(firewall-cmd --list-ports)"
            fi

            echo "=== Ensuring directories exist ==="
            sudo mkdir -p /opt/creditcardanalyzer /opt/creditcardanalyzer/backups
            sudo mkdir -p /opt/creditcardanalyzer/nginx/maintenance
            sudo mkdir -p /opt/creditcardanalyzer/certbot/{conf,work,logs}
            sudo mkdir -p /opt/creditcardanalyzer/alloy
            sudo mkdir -p /opt/creditcardanalyzer/blackbox
            sudo chown -R $USER:$USER /opt/creditcardanalyzer

            echo "=== Ensuring shared network exists ==="
            export PATH="$HOME/.local/bin:$PATH"
            podman network create "$NETWORK_NAME" 2>/dev/null || true
            echo "Network $NETWORK_NAME ready"

            echo "=== Cleaning up legacy containers ==="
            for OLD in $(podman ps -a --format '{{.Names}}' | grep '^creditcardanalyzer_' 2>/dev/null); do
              echo "Removing legacy container: $OLD"
              podman rm -f "$OLD" 2>/dev/null || true
            done

            echo "=== Setting up certbot renewal timer ==="
            sudo tee /etc/systemd/system/certbot-renew.service > /dev/null << 'UNIT'
            [Unit]
            Description=Certbot SSL Certificate Renewal
            After=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/podman run --rm \
              -v /opt/creditcardanalyzer/certbot/conf:/etc/letsencrypt:z \
              -v /opt/creditcardanalyzer/certbot/work:/var/lib/letsencrypt:z \
              -v /opt/creditcardanalyzer/certbot/logs:/var/log/letsencrypt:z \
              docker.io/certbot/certbot renew --quiet
            UNIT

            sudo tee /etc/systemd/system/certbot-renew.timer > /dev/null << 'UNIT'
            [Unit]
            Description=Run certbot renewal twice daily

            [Timer]
            OnCalendar=daily
            RandomizedDelaySec=3600
            Persistent=true

            [Install]
            WantedBy=timers.target
            UNIT

            sudo systemctl daemon-reload
            sudo systemctl enable --now certbot-renew.timer
            echo "Certbot renewal timer installed"

            echo ""
            echo "=== Server setup complete ==="
            echo "Next steps:"
            echo "  1. Verify DNS points to this server"
            echo "  2. Run the Deploy workflow to build and deploy"