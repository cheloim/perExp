name: Setup Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm host setup"
        required: true
        default: "no"

permissions:
  contents: read

env:
  NETWORK_NAME: oikonomia

jobs:
  setup-server:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'yes'

    steps:
      - name: Bootstrap server (podman, firewalld, directories)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            set -e

            echo "=== Installing podman and podman-compose ==="
            if ! command -v podman &> /dev/null; then
                echo "Installing podman..."
                sudo dnf install -y podman podman-docker
                sudo systemctl enable --now podman.socket
            else
                echo "podman already installed, skipping"
            fi

            if ! command -v podman-compose &> /dev/null; then
                echo "Installing podman-compose..."
                sudo dnf install -y python3-pip
                pip3 install --user podman-compose
            else
                echo "podman-compose already installed, skipping"
            fi

            # Enable CPU controller for rootless podman (cgroup v2)
            # Required by podman-compose to create pods
            echo "=== Configuring cgroup delegation for rootless podman ==="
            USER_UID=$(id -u)
            if [ "$USER_UID" -ge 1000 ]; then
                sudo mkdir -p /etc/systemd/system/user@${USER_UID}.service.d
                echo "[Service]" | sudo tee /etc/systemd/system/user@${USER_UID}.service.d/delegate.conf > /dev/null
                echo "Delegate=cpu cpuset io memory pids" | sudo tee -a /etc/systemd/system/user@${USER_UID}.service.d/delegate.conf > /dev/null
                sudo systemctl daemon-reload
                echo "CPU controller delegation enabled for uid $USER_UID"
            fi

            # Check if reboot is needed (cgroup delegation or sysctl changes)
            NEED_REBOOT=false
            if [ ! -f /opt/creditcardanalyzer/.setup-done ]; then
                NEED_REBOOT=true
            fi

            if [ "$NEED_REBOOT" = true ]; then
                echo "=== Rebooting to apply cgroup + sysctl changes ==="
                echo "Server will reboot. Run setup-server again after it comes back."
                sudo touch /opt/creditcardanalyzer/.setup-done
                sudo reboot
            fi

            # Allow rootless podman to bind privileged ports (80, 443)
            echo "=== Configuring unprivileged ports ==="
            if ! grep -q "ip_unprivileged_port_start=80" /etc/sysctl.conf 2>/dev/null; then
                echo "net.ipv4.ip_unprivileged_port_start=80" | sudo tee -a /etc/sysctl.conf > /dev/null
                sudo sysctl -p
                echo "Unprivileged port start set to 80"
            else
                echo "Already configured, skipping"
            fi

            echo "=== Configuring firewall ==="
            SSH_PORT="${{ vars.SSH_PORT || '43422' }}"
            if ! command -v firewall-cmd &> /dev/null; then
                echo "Installing firewalld..."
                sudo dnf install -y firewalld
                # Use firewall-offline-cmd to write rules BEFORE starting the daemon
                # (firewall-cmd --permanent requires a running daemon, offline-cmd does not)
                sudo firewall-offline-cmd --zone=public --add-port=${SSH_PORT}/tcp
                sudo firewall-offline-cmd --zone=public --add-port=80/tcp
                sudo firewall-offline-cmd --zone=public --add-port=443/tcp
                echo "Ports ${SSH_PORT}, 80, 443 written to firewall config"
                # Now start — rules are already in the zone file
                sudo systemctl enable --now firewalld
                echo "Firewall started. Ports: $(firewall-cmd --list-ports)"
            else
                # firewalld already installed — ensure ports are open
                if ! firewall-cmd --list-ports | grep -q "80/tcp"; then
                    echo "Opening port 80..."
                    sudo firewall-cmd --permanent --add-port=80/tcp
                fi
                if ! firewall-cmd --list-ports | grep -q "443/tcp"; then
                    echo "Opening port 443..."
                    sudo firewall-cmd --permanent --add-port=443/tcp
                fi
                sudo firewall-cmd --reload
                echo "Firewall ports: $(firewall-cmd --list-ports)"
            fi

            echo "=== Ensuring directories exist ==="
            sudo mkdir -p /opt/creditcardanalyzer /opt/creditcardanalyzer/backups
            sudo mkdir -p /opt/creditcardanalyzer/nginx/maintenance
            sudo mkdir -p /opt/creditcardanalyzer/certbot/{conf,work,logs}
            sudo mkdir -p /opt/creditcardanalyzer/alloy
            sudo mkdir -p /opt/creditcardanalyzer/blackbox
            sudo chown -R $USER:$USER /opt/creditcardanalyzer

            echo "=== Ensuring shared network exists ==="
            export PATH="$HOME/.local/bin:$PATH"
            NETWORK_NAME="oikonomia"
            podman network create "$NETWORK_NAME" 2>/dev/null || true
            echo "Network $NETWORK_NAME ready"

            echo "=== Cleaning up legacy containers ==="
            for OLD in $(podman ps -a --format '{{.Names}}' | grep '^creditcardanalyzer_' 2>/dev/null); do
              echo "Removing legacy container: $OLD"
              podman rm -f "$OLD" 2>/dev/null || true
            done

            echo "=== Generating self-signed fallback certificates ==="
            DOMAIN="${{ vars.DOMAIN_NAME }}"
            PLATFORM="${{ vars.PLATFORM_DOMAIN }}"
            CERT_DIR="/opt/creditcardanalyzer/certbot/conf/live/$DOMAIN"
            if [ ! -f "$CERT_DIR/fullchain.pem" ]; then
                sudo mkdir -p "$CERT_DIR"
                sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                    -keyout "$CERT_DIR/privkey.pem" \
                    -out "$CERT_DIR/fullchain.pem" \
                    -subj "/CN=$DOMAIN" 2>/dev/null
                echo "Self-signed cert created for $DOMAIN"
            else
                echo "Certificate for $DOMAIN already exists, skipping"
            fi
            # Create relative symlink for platform domain (certbot stores all domains under one dir)
            if [ ! -e "/opt/creditcardanalyzer/certbot/conf/live/$PLATFORM" ]; then
                cd /opt/creditcardanalyzer/certbot/conf/live
                sudo ln -s "$DOMAIN" "$PLATFORM"
                echo "Symlink created: $PLATFORM -> $DOMAIN"
            fi
            sudo chown -R $USER:$USER /opt/creditcardanalyzer/certbot/conf

            echo "=== Setting up certbot renewal timer ==="
            sudo tee /etc/systemd/system/certbot-renew.service > /dev/null << 'UNIT'
            [Unit]
            Description=Certbot SSL Certificate Renewal
            After=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/podman run --rm \
              -v /opt/creditcardanalyzer/certbot/conf:/etc/letsencrypt:z \
              -v /opt/creditcardanalyzer/certbot/work:/var/lib/letsencrypt:z \
              -v /opt/creditcardanalyzer/certbot/logs:/var/log/letsencrypt:z \
              docker.io/certbot/certbot renew --quiet
            UNIT

            sudo tee /etc/systemd/system/certbot-renew.timer > /dev/null << 'UNIT'
            [Unit]
            Description=Run certbot renewal twice daily

            [Timer]
            OnCalendar=daily
            RandomizedDelaySec=3600
            Persistent=true

            [Install]
            WantedBy=timers.target
            UNIT

            sudo systemctl daemon-reload
            sudo systemctl enable --now certbot-renew.timer
            echo "Certbot renewal timer installed"

            echo ""
            echo "=== Server setup complete ==="
            echo ""
            echo "=== Verification ==="
            ERRORS=0

            echo -n "  podman: "
            podman --version 2>/dev/null && echo "OK" || { echo "MISSING"; ERRORS=$((ERRORS+1)); }

            echo -n "  podman-compose: "
            export PATH="$HOME/.local/bin:$PATH"
            podman-compose --version 2>/dev/null && echo "OK" || { echo "MISSING"; ERRORS=$((ERRORS+1)); }

            echo -n "  firewall ports: "
            sudo firewall-cmd --list-ports 2>/dev/null || { echo "MISSING"; ERRORS=$((ERRORS+1)); }

            echo -n "  podman network: "
            podman network ls | grep -q oikonomia && echo "oikonomia OK" || { echo "MISSING"; ERRORS=$((ERRORS+1)); }

            echo -n "  directories: "
            test -d /opt/creditcardanalyzer && test -d /opt/creditcardanalyzer/certbot/conf && echo "OK" || { echo "MISSING"; ERRORS=$((ERRORS+1)); }

            echo -n "  certbot timer: "
            systemctl is-enabled certbot-renew.timer 2>/dev/null && echo "OK" || { echo "MISSING"; ERRORS=$((ERRORS+1)); }

            echo -n "  podman socket: "
            systemctl is-active podman.socket 2>/dev/null && echo "OK" || { echo "MISSING"; ERRORS=$((ERRORS+1)); }

            echo ""
            if [ "$ERRORS" -gt 0 ]; then
              echo "::error::$ERRORS verification check(s) failed"
              exit 1
            fi
            echo "All checks passed"
            echo ""
            echo "Next steps:"
            echo "  1. Open port $SSH_PORT in Oracle Cloud Security List (VCN → Security Lists → Add Ingress Rule)"
            echo "  2. Verify DNS points to this server"
            echo "  3. Run the Deploy workflow to build and deploy"