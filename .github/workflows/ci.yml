name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.16.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: |
          node_modules/.bin/prettier --write src/
          git diff --exit-code src/ || (echo "::error::Run 'npx prettier --write src/' locally" && exit 1)

      - name: TypeScript
        run: npm run typecheck
        continue-on-error: true

  backend:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install ruff mypy

      - name: Ruff Lint
        run: ruff check app/

      - name: Ruff Format
        run: |
          ruff format app/
          git diff --exit-code app/ || (echo "::error::Run 'ruff format app/' locally" && exit 1)

      - name: MyPy
        run: mypy app/
        continue-on-error: true

  specs:
    name: Spec Validation & Codegen
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.16.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generate API client from OpenAPI spec
        run: npx orval

      - name: Format generated code
        run: npx prettier --write src/api/client-generated.ts src/types/generated/

      - name: Check generated types are up to date
        run: |
          git diff --exit-code src/types/generated/ || {
            echo "::error::Generated types are out of date. Run 'npx orval && npx prettier --write src/' locally."
            exit 1
          }

      - name: Typecheck with generated types
        run: npm run typecheck

  roadmap:
    name: Roadmap Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Roadmap
        run: |
          pip install pyyaml
          python scripts/generate_roadmap.py

      - name: Check Roadmap is up to date
        run: |
          git diff --exit-code docs/Roadmap.md || {
            echo "::error::docs/Roadmap.md is out of date. Run 'python scripts/generate_roadmap.py' locally."
            exit 1
          }
