name: Deploy to Linode

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "docs/specs/**"
      - "config/scripts/generate_roadmap.py"
      - ".sdd/**"
      - ".github/**"
      - "LICENSE"
      - ".gitignore"
      - "assets/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - migrate-only

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/perexp/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/perexp/frontend
  LANDING_IMAGE: ghcr.io/${{ github.repository_owner }}/perexp/landing

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      landing: ${{ steps.changes.outputs.landing }}
      platform: ${{ steps.changes.outputs.platform }}
      backend: ${{ steps.changes.outputs.backend }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      nginx: ${{ steps.changes.outputs.nginx }}
      bots: ${{ steps.changes.outputs.bots }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            landing:
              - 'src/landing/**'
              - 'docker/docker-compose.web-landing.yml'
            platform:
              - 'src/frontend/**'
              - 'src/backend/**'
              - 'docker/docker-compose.platform.yml'
            backend:
              - 'src/backend/**'
              - 'docker/docker-compose.platform.yml'
            monitoring:
              - 'docker/docker-compose.monitoring.yml'
              - 'config/alloy/**'
              - 'config/blackbox/**'
            nginx:
              - 'docker/nginx/**'
              - 'docker/docker-compose.nginx.yml'
              - 'config/nginx/**'
            bots:
              - 'docker/docker-compose.bots.yml'
            infra:
              - 'docker/docker-compose.infra.yml'

  test:
    if: github.event_name == 'push' || inputs.action == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd src/backend
          pip install -r requirements.txt
          pip install pytest

      - name: Run encryption tests
        env:
          SECRET_KEY: "test-secret-key-for-ci-that-is-at-least-32-chars"
        run: |
          cd src/backend
          python -m pytest tests/test_encryption.py -v

  build-backend:
    if: |
      always() && !cancelled() && needs.test.result == 'success' &&
      (inputs.action == 'full' || needs.detect-changes.outputs.platform == 'true')
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    if: |
      always() && !cancelled() && needs.test.result == 'success' &&
      (inputs.action == 'full' || needs.detect-changes.outputs.platform == 'true')
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend
          push: true
          build-args: |
            VITE_APP_ENV=production
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-landing:
    if: |
      always() && !cancelled() && needs.test.result == 'success' &&
      (inputs.action == 'full' || needs.detect-changes.outputs.landing == 'true')
    runs-on: ubuntu-latest
    needs: [test, detect-changes]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check if landing source exists
        id: check-landing
        run: |
          if [ -d "./src/landing" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Skipping landing build — ./src/landing not found"
          fi

      - name: Set up Docker Buildx
        if: steps.check-landing.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.check-landing.outputs.exists == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Landing
        if: steps.check-landing.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./src/landing
          push: true
          tags: |
            ${{ env.LANDING_IMAGE }}:${{ github.sha }}
            ${{ env.LANDING_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  setup-server:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-landing]
    if: |
      always() && !cancelled() &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success' || needs.build-landing.result == 'success' || inputs.action == 'full')

    steps:
      - name: Bootstrap server (install, DNS, stop old containers, firewall)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            set -e

            echo "=== Installing podman and podman-compose ==="
            if ! command -v podman &> /dev/null; then
                echo "Installing podman..."
                sudo dnf install -y podman podman-docker
                sudo systemctl enable --now podman.socket
            else
                echo "podman already installed, skipping"
            fi

            if ! command -v podman-compose &> /dev/null; then
                echo "Installing podman-compose..."
                sudo dnf install -y python3-pip
                pip3 install --user podman-compose
            else
                echo "podman-compose already installed, skipping"
            fi

            sudo mkdir -p /opt/creditcardanalyzer /opt/creditcardanalyzer/backups
            sudo chown -R $USER:$USER /opt/creditcardanalyzer

            echo "=== Verifying DNS resolution ==="
            RESOLVED_IP=$(python3 -c "import socket; print(socket.gethostbyname('${{ vars.DOMAIN_NAME }}'))" 2>/dev/null)
            SERVER_IP=$(curl -s --connect-timeout 5 https://api.ipify.org || curl -s --connect-timeout 5 https://ifconfig.me)

            echo "Domain: ${{ vars.DOMAIN_NAME }}"
            echo "Platform: ${{ vars.PLATFORM_DOMAIN }}"
            echo "Resolved IP: $RESOLVED_IP"
            echo "Server IP: $SERVER_IP"

            if [ "$RESOLVED_IP" != "$SERVER_IP" ]; then
              echo "ERROR: DNS not pointing to this server ($RESOLVED_IP != $SERVER_IP)"
              exit 1
            fi
            echo "DNS OK: ${{ vars.DOMAIN_NAME }} -> $SERVER_IP"

            echo "=== Ensuring directories exist ==="
            sudo mkdir -p /opt/creditcardanalyzer /opt/creditcardanalyzer/backups
            sudo mkdir -p /opt/creditcardanalyzer/nginx/maintenance
            sudo mkdir -p /opt/creditcardanalyzer/certbot/conf
            sudo mkdir -p /opt/creditcardanalyzer/alloy
            sudo mkdir -p /opt/creditcardanalyzer/blackbox
            sudo chown -R $USER:$USER /opt/creditcardanalyzer

            echo "=== Ensuring shared network exists ==="
            export PATH="$HOME/.local/bin:$PATH"
            NETWORK_NAME="${NETWORK_NAME:-oikonomia}"
            podman network create "$NETWORK_NAME" 2>/dev/null || true
            echo "Network $NETWORK_NAME ready"

            echo "Directories ready"

            echo "=== Opening firewall ports ==="
            if ! firewall-cmd --list-ports | grep -q "80/tcp"; then
                echo "Opening port 80..."
                sudo firewall-cmd --permanent --add-port=80/tcp
            else
                echo "Port 80 already open, skipping"
            fi

            if ! firewall-cmd --list-ports | grep -q "443/tcp"; then
                echo "Opening port 443..."
                sudo firewall-cmd --permanent --add-port=443/tcp
            else
                echo "Port 443 already open, skipping"
            fi
            sudo firewall-cmd --reload
            echo "Firewall ports: $(firewall-cmd --list-ports)"

      - name: Setup SSL certificates, permissions, and renewal timer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            set -e

            echo "=== Setting up SSL certificates ==="
            mkdir -p /opt/creditcardanalyzer/certbot/{conf,work,logs}

            # Clean up old domain certbot data if domain changed
            for old_dir in /opt/creditcardanalyzer/certbot/conf/live/*/; do
              old_domain=$(basename "$old_dir")
              if [ "$old_domain" != "${{ vars.DOMAIN_NAME }}" ] && [ "$old_domain" != "${{ vars.PLATFORM_DOMAIN }}" ] && [ -n "$old_domain" ]; then
                echo "Removing old cert for domain: $old_domain"
                rm -rf "/opt/creditcardanalyzer/certbot/conf/live/$old_domain"
                rm -rf "/opt/creditcardanalyzer/certbot/conf/archive/$old_domain"
                rm -f "/opt/creditcardanalyzer/certbot/conf/renewal/${old_domain}.conf"
              fi
            done

            CERT_FILE="/opt/creditcardanalyzer/certbot/conf/live/${{ vars.DOMAIN_NAME }}/fullchain.pem"

            if [ -f "$CERT_FILE" ]; then
                EXPIRY=$(openssl x509 -in "$CERT_FILE" -noout -enddate | cut -d= -f2)
                EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
                NOW_EPOCH=$(date +%s)
                DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))

                if [ "$DAYS_LEFT" -lt 14 ]; then
                    echo "Certificate expires in $DAYS_LEFT days, forcing renewal..."
                    rm -f "$CERT_FILE"
                else
                    echo "SSL certificate OK ($DAYS_LEFT days remaining), skipping"
                fi
            fi

            if [ ! -f "$CERT_FILE" ]; then
                echo "Requesting SSL certificate..."
                podman run --rm \
                  -v /opt/creditcardanalyzer/certbot/conf:/etc/letsencrypt:Z \
                  -v /opt/creditcardanalyzer/certbot/work:/var/lib/letsencrypt:Z \
                  -v /opt/creditcardanalyzer/certbot/logs:/var/log/letsencrypt:Z \
                  -p 80:80 \
                  docker.io/certbot/certbot certonly --standalone --expand \
                  -d ${{ vars.DOMAIN_NAME }} \
                  -d www.${{ vars.DOMAIN_NAME }} \
                  -d ${{ vars.PLATFORM_DOMAIN }} \
                  --email mmendoza0989@gmail.com \
                  --agree-tos --non-interactive
                echo "SSL certificate obtained"
            fi

            echo "=== Fixing cert permissions ==="
            chmod 755 /opt/creditcardanalyzer/certbot/conf/archive 2>/dev/null || true
            chmod 755 /opt/creditcardanalyzer/certbot/conf/archive/${{ vars.DOMAIN_NAME }} 2>/dev/null || true
            chmod 644 /opt/creditcardanalyzer/certbot/conf/archive/${{ vars.DOMAIN_NAME }}/*.pem 2>/dev/null || true
            echo "Cert permissions fixed"

            echo "=== Setting up certbot renewal timer ==="
            cat > /etc/systemd/system/certbot-renew.service << 'UNIT'
            [Unit]
            Description=Certbot SSL Certificate Renewal
            After=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/podman run --rm \
              -v /opt/creditcardanalyzer/certbot/conf:/etc/letsencrypt:z \
              -v /opt/creditcardanalyzer/certbot/work:/var/lib/letsencrypt:z \
              -v /opt/creditcardanalyzer/certbot/logs:/var/log/letsencrypt:z \
              docker.io/certbot/certbot renew --quiet
            UNIT

            cat > /etc/systemd/system/certbot-renew.timer << 'UNIT'
            [Unit]
            Description=Run certbot renewal twice daily

            [Timer]
            OnCalendar=daily
            RandomizedDelaySec=3600
            Persistent=true

            [Install]
            WantedBy=timers.target
            UNIT

            systemctl daemon-reload
            systemctl enable --now certbot-renew.timer
            echo "Certbot renewal timer installed"

  write-config:
    runs-on: ubuntu-latest
    needs: setup-server
    if: always() && needs.setup-server.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write config files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}"
            FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}"
            LANDING_IMAGE="${{ env.LANDING_IMAGE }}"
            IMAGE_TAG="${{ github.sha }}"
            DOMAIN_NAME="${{ vars.DOMAIN_NAME }}"
            PLATFORM_DOMAIN="${{ vars.PLATFORM_DOMAIN }}"

            # Write .env
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" > /opt/creditcardanalyzer/.env
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> /opt/creditcardanalyzer/.env
            echo "LANDING_IMAGE=${LANDING_IMAGE}" >> /opt/creditcardanalyzer/.env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> /opt/creditcardanalyzer/.env
            echo "DOMAIN_NAME=${DOMAIN_NAME}" >> /opt/creditcardanalyzer/.env
            echo "PLATFORM_DOMAIN=${PLATFORM_DOMAIN}" >> /opt/creditcardanalyzer/.env
            echo "NETWORK_NAME=oikonomia" >> /opt/creditcardanalyzer/.env

            # App secrets (individual, no base64)
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> /opt/creditcardanalyzer/.env
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "INVESTMENTS_LLM_API_KEY=${{ secrets.INVESTMENTS_LLM_API_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "MESSAGES_BOT_LLM_API_KEY=${{ secrets.MESSAGES_BOT_LLM_API_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> /opt/creditcardanalyzer/.env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> /opt/creditcardanalyzer/.env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> /opt/creditcardanalyzer/.env
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> /opt/creditcardanalyzer/.env
            echo "EMAIL_API_KEY=${{ secrets.EMAIL_API_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "SMTP_FROM=${{ vars.SMTP_FROM }}" >> /opt/creditcardanalyzer/.env
            echo "SMTP_FROM_ADDRESS=${{ vars.SMTP_FROM_ADDRESS }}" >> /opt/creditcardanalyzer/.env

            # Grafana Cloud
            echo "GRAFANA_CLOUD_PROMETHEUS_URL=${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}" >> /opt/creditcardanalyzer/.env
            echo "GRAFANA_CLOUD_PROMETHEUS_USER=${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USER }}" >> /opt/creditcardanalyzer/.env
            echo "GRAFANA_CLOUD_PROMETHEUS_PASSWORD=${{ secrets.GRAFANA_CLOUD_PROMETHEUS_PASSWORD }}" >> /opt/creditcardanalyzer/.env
            echo "GRAFANA_CLOUD_LOKI_URL=${{ secrets.GRAFANA_CLOUD_LOKI_URL }}" >> /opt/creditcardanalyzer/.env
            echo "GRAFANA_CLOUD_LOKI_USER=${{ secrets.GRAFANA_CLOUD_LOKI_USER }}" >> /opt/creditcardanalyzer/.env
            echo "GRAFANA_CLOUD_LOKI_PASSWORD=${{ secrets.GRAFANA_CLOUD_LOKI_PASSWORD }}" >> /opt/creditcardanalyzer/.env

            chmod 600 /opt/creditcardanalyzer/.env
            echo "Config files written"

      - name: Copy compose and config files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          source: "docker/docker-compose.infra.yml,docker/docker-compose.nginx.yml,docker/docker-compose.platform.yml,docker/docker-compose.bots.yml,docker/docker-compose.monitoring.yml,docker/docker-compose.web-landing.yml,docker/nginx/nginx.conf,docker/nginx/maintenance/,config/alloy/config.alloy,config/blackbox/blackbox.yml"
          target: /opt/creditcardanalyzer
          strip_components: 1

      - name: Substitute domain variables in nginx.conf
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            DOMAIN_NAME="${{ vars.DOMAIN_NAME }}"
            PLATFORM_DOMAIN="${{ vars.PLATFORM_DOMAIN }}"
            sed -i "s/\${DOMAIN_NAME}/${DOMAIN_NAME}/g" /opt/creditcardanalyzer/nginx/nginx.conf
            sed -i "s/\${PLATFORM_DOMAIN}/${PLATFORM_DOMAIN}/g" /opt/creditcardanalyzer/nginx/nginx.conf
            echo "nginx.conf variables substituted"

      - name: Validate required env vars
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            REQUIRED="POSTGRES_PASSWORD LLM_API_KEY SECRET_KEY TELEGRAM_BOT_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET EMAIL_API_KEY ADMIN_EMAIL"
            MISSING=""
            for var in $REQUIRED; do
              if ! grep -q "^${var}=" .env; then
                MISSING="$MISSING $var"
              fi
            done

            if [ -n "$MISSING" ]; then
              echo "ERROR: Missing required env vars:$MISSING"
              exit 1
            fi
            echo "All required env vars present"

  validate-config:
    runs-on: ubuntu-latest
    needs: write-config
    if: always() && needs.write-config.result == 'success'

    steps:
      - name: Validate docker-compose syntax
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            echo "Validating compose-platform.yml..."
            podman-compose -f docker-compose.platform.yml config --quiet
            echo "compose-platform.yml OK"
            echo "Validating compose-infra.yml..."
            podman-compose -f docker-compose.infra.yml config --quiet
            echo "compose-infra.yml OK"
            echo "Validating compose-nginx.yml..."
            podman-compose -f docker-compose.nginx.yml config --quiet
            echo "compose-nginx.yml OK"
            echo "Validating compose-bots.yml..."
            podman-compose -f docker-compose.bots.yml config --quiet
            echo "compose-bots.yml OK"
            echo "Validating compose-monitoring.yml..."
            podman-compose -f docker-compose.monitoring.yml config --quiet
            echo "compose-monitoring.yml OK"
            echo "Validating compose-web-landing.yml..."
            podman-compose -f docker-compose.web-landing.yml config --quiet
            echo "compose-web-landing.yml OK"

      - name: Validate nginx config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            echo "Validating nginx.conf..."
            podman run --rm \
              -v /opt/creditcardanalyzer/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              docker.io/library/nginx:alpine nginx -t
            echo "nginx.conf OK"

  pull-images:
    runs-on: ubuntu-latest
    needs: write-config
    if: always() && needs.write-config.result == 'success'

    steps:
      - name: Pull and verify images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin || echo "WARN: GHCR login failed (may be public repo)"

            echo "Pulling platform images..."
            podman-compose -f docker-compose.platform.yml pull

            echo "Pulling infra images..."
            podman-compose -f docker-compose.infra.yml pull

            echo "Pulling nginx image..."
            podman-compose -f docker-compose.nginx.yml pull

            # Verify platform images exist
            echo "Verifying images..."
            podman image inspect ${BACKEND_IMAGE}:${IMAGE_TAG} > /dev/null 2>&1 || { echo "ERROR: Backend image not found"; exit 1; }
            podman image inspect ${FRONTEND_IMAGE}:${IMAGE_TAG} > /dev/null 2>&1 || { echo "ERROR: Frontend image not found"; exit 1; }
            echo "Images verified"

  backup-db:
    runs-on: ubuntu-latest
    needs: [pull-images, validate-config]
    if: always() && (needs.pull-images.result == 'success' && needs.validate-config.result == 'success')

    steps:
      - name: Backup database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            # Check if DB container is running (compose-agnostic)
            DB_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_db_' | head -1)
            if [ -z "$DB_CONTAINER" ]; then
              echo "WARNING: Database container not running, skipping backup (first deploy?)"
              exit 0
            fi

            BACKUP_DIR="/opt/creditcardanalyzer/backups"
            mkdir -p $BACKUP_DIR

            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="$BACKUP_DIR/db_${TIMESTAMP}.sql"

            echo "Backing up database..."
            podman exec "$DB_CONTAINER" \
              pg_dump -U expenses_user expenses > $BACKUP_FILE 2>/dev/null

            # Compress
            gzip $BACKUP_FILE

            # Verify backup is not empty
            if [ ! -s "${BACKUP_FILE}.gz" ]; then
              echo "ERROR: Database backup is empty"
              exit 1
            fi

            # Clean up backups older than 12 days
            find $BACKUP_DIR -name "db_*.sql.gz" -mtime +12 -delete

            BACKUP_SIZE=$(du -h ${BACKUP_FILE}.gz | cut -f1)
            echo "Backup saved: ${BACKUP_FILE}.gz ($BACKUP_SIZE)"

            # List current backups
            echo "Current backups:"
            ls -lh $BACKUP_DIR/db_*.sql.gz 2>/dev/null | tail -5

  migrate:
    runs-on: ubuntu-latest
    needs: [deploy-infra, detect-changes]
    if: |
      always() && needs.deploy-infra.result == 'success' &&
      (needs.detect-changes.outputs.backend == 'true' || inputs.action == 'full')

    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            echo "=== Step 0: Verify SECRET_KEY ==="
            KEY_CHECK=$(podman-compose -f docker-compose.platform.yml run --rm backend python -c "
            from app.services.encryption import verify_key_works
            if verify_key_works():
                print('KEY_VALID')
            else:
                print('KEY_INVALID')
            " 2>&1)

            if echo "$KEY_CHECK" | grep -q "KEY_INVALID"; then
              echo "::error::SECRET_KEY cannot encrypt/decrypt! Aborting deployment."
              exit 1
            fi
            echo "SECRET_KEY verified successfully"

            echo "=== Step 1: Database structure migration ==="
            for script in migrate_add_reset_token migrate_remove_haberes migrate_encrypt_settings migrate_add_monthly_reports migrate_db_structure migrate_add_card_account_link migrate_add_budgets migrate_add_category_suggestions migrate_add_whatsapp migrate_add_google_refresh_token migrate_add_merchant_preferences migrate_security_columns migrate_add_expense_created_at migrate_add_tags migrate_tag_groups backfill_tags_from_cards_accounts migrate_fix_tag_groups cleanup_legacy_cards_accounts; do
              OUTPUT=$(podman-compose -f docker-compose.platform.yml run --rm backend python -m scripts.$script 2>&1)
              EXIT_CODE=$?
              echo "$OUTPUT"
              if [ $EXIT_CODE -ne 0 ]; then
                if echo "$OUTPUT" | grep -qiE "already|exists|duplicate|no changes"; then
                  echo "::warning::Migration $script already applied, continuing"
                else
                  echo "::error::Migration $script failed! Rolling back database..."
                  LATEST=$(ls -t /opt/creditcardanalyzer/backups/db_*.sql.gz | head -1)
                  if [ -n "$LATEST" ]; then
                    echo "Restoring from: $LATEST"
                    DB_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_db_' | head -1)
                    gunzip -c "$LATEST" | podman exec -i "$DB_CONTAINER" psql -U expenses_user expenses
                    echo "Database restored from backup"
                  else
                    echo "::error::No backup found!"
                  fi
                  exit 1
                fi
              fi
            done

            echo "=== Step 2: Dry-run encryption migration ==="
            DRY_RUN=$(podman-compose -f docker-compose.platform.yml run --rm backend python scripts/dry_run_migration.py 2>&1)
            echo "$DRY_RUN"

            if echo "$DRY_RUN" | grep -q "Status: FAIL"; then
              echo "::error::Dry-run failed! Aborting deployment."
              exit 1
            fi

            echo "=== Step 3: Run encryption migration ==="
            if ! podman-compose -f docker-compose.platform.yml run --rm backend python scripts/migrate_encrypt_fields.py; then
              echo "::error::Encryption migration failed!"
              exit 1
            fi

            echo "=== Step 4: Verify encryption ==="
            VERIFY=$(podman-compose -f docker-compose.platform.yml run --rm backend python scripts/verify_encryption.py 2>&1)
            echo "$VERIFY"

            if echo "$VERIFY" | grep -q "Status: FAIL"; then
              echo "::error::Verification failed! Rolling back database..."
              LATEST=$(ls -t /opt/creditcardanalyzer/backups/db_*.sql.gz | head -1)
              if [ -n "$LATEST" ]; then
                echo "Restoring from: $LATEST"
                DB_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_db_' | head -1)
                gunzip -c "$LATEST" | podman exec -i "$DB_CONTAINER" psql -U expenses_user expenses
                echo "Database restored from backup"
              else
                echo "::error::No backup found!"
              fi
              exit 1
            fi

            echo "=== Migration complete and verified ==="

  # ── Disaggregated deploy jobs ─────────────────────────────

  deploy-infra:
    runs-on: ubuntu-latest
    needs: [backup-db, detect-changes]
    if: always() && !cancelled()

    steps:
      - name: Ensure infra is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "Ensuring shared network exists..."
            NETWORK_NAME="${NETWORK_NAME:-oikonomia}"
            podman network create "$NETWORK_NAME" 2>/dev/null || true

            # Check if db is running (compose-agnostic)
            if ! podman ps --format '{{.Names}}' | grep -qE '_db_'; then
              echo "Starting infra (first deploy)..."
              podman-compose -f docker-compose.infra.yml up -d
            else
              echo "Restarting infra..."
              # Stop ONLY infra services (compose handles container names)
              podman-compose -f docker-compose.infra.yml stop db redis 2>/dev/null || true
              podman-compose -f docker-compose.infra.yml up -d
            fi

            echo "Waiting for infra health..."
            # Get container names dynamically (works regardless of project name)
            DB_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_db_' | head -1)
            REDIS_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_redis_' | head -1)

            if [ -z "$DB_CONTAINER" ] || [ -z "$REDIS_CONTAINER" ]; then
              echo "::error::Could not find db or redis containers"
              podman ps --format "table {{.Names}}\t{{.Status}}"
              exit 1
            fi

            echo "Found containers: db=$DB_CONTAINER, redis=$REDIS_CONTAINER"

            for i in $(seq 1 20); do
              DB_OK=$(podman inspect --format='{{.State.Health.Status}}' "$DB_CONTAINER" 2>/dev/null || echo "missing")
              REDIS_OK=$(podman inspect --format='{{.State.Health.Status}}' "$REDIS_CONTAINER" 2>/dev/null || echo "missing")
              if [ "$DB_OK" = "healthy" ] && [ "$REDIS_OK" = "healthy" ]; then
                echo "Infra healthy after ${i} attempt(s)"
                break
              fi
              echo "Attempt $i/20: db=$DB_OK, redis=$REDIS_OK, waiting 3s..."
              sleep 3
            done

            DB_FINAL=$(podman inspect --format='{{.State.Health.Status}}' "$DB_CONTAINER" 2>/dev/null || echo "missing")
            REDIS_FINAL=$(podman inspect --format='{{.State.Health.Status}}' "$REDIS_CONTAINER" 2>/dev/null || echo "missing")
            if [ "$DB_FINAL" != "healthy" ] || [ "$REDIS_FINAL" != "healthy" ]; then
              echo "::error::Infra health check failed: db=$DB_FINAL, redis=$REDIS_FINAL"
              exit 1
            fi

            echo "Infra status:"
            podman ps --format "table {{.Names}}\t{{.Status}}" | grep -E "db|redis"

  deploy-platform:
    runs-on: ubuntu-latest
    needs: [migrate, detect-changes]
    if: always() && !cancelled() && (needs.detect-changes.outputs.platform == 'true' || inputs.action == 'full')

    steps:
      - name: Save platform rollback snapshot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            CURRENT_TAG=$(podman inspect --format='{{.Config.Image}}' creditcardanalyzer_backend_1 2>/dev/null | cut -d: -f2 || echo "")
            if [ -n "$CURRENT_TAG" ]; then
              echo "$CURRENT_TAG" > /opt/creditcardanalyzer/.rollback_platform_tag
              cp .env .env.rollback.platform
              echo "Platform rollback snapshot saved (tag: $CURRENT_TAG)"
            else
              echo "No previous platform deployment found, skipping rollback snapshot"
            fi

      - name: Restart platform services
        id: restart
        uses: appleboy/ssh-action@v1
        timeout-minutes: 5
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          command_timeout: 4m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "Restarting platform services..."

            # Stop ONLY platform services (compose handles container names)
            echo "Stopping platform services..."
            podman-compose -f docker-compose.platform.yml stop backend platform-frontend celery_worker celery_beat 2>/dev/null || true

            # Clean up legacy service name (frontend → platform-frontend)
            LEGACY_FRONTEND="${COMPOSE_PROJECT_NAME:-creditcardanalyzer}_frontend_1"
            podman rm -f "$LEGACY_FRONTEND" 2>/dev/null || true

            # Start platform services
            echo "Starting platform services..."
            podman-compose -f docker-compose.platform.yml up -d
            echo "Platform services started"

            echo "Waiting for backend health..."
            DEPLOY_OK=false
            for i in $(seq 1 20); do
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost:8000/docs 2>/dev/null)
              if [ "$STATUS" = "200" ]; then
                echo "Backend healthy after ${i} attempt(s)"
                DEPLOY_OK=true
                break
              fi
              echo "Attempt $i/20: got $STATUS, retrying in 3s..."
              sleep 3
            done

            if [ "$DEPLOY_OK" = "false" ]; then
              echo "::error::Backend health check failed after restart"
              exit 1
            fi

      - name: Rollback on failure
        if: always() && steps.restart.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"

            echo "=== Platform deploy failed, initiating rollback ==="
            # Get backend container name dynamically
            BACKEND_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_backend_' | head -1)
            podman logs "$BACKEND_CONTAINER" --tail 40 2>&1 || true

            PREV_TAG=$(cat /opt/creditcardanalyzer/.rollback_platform_tag 2>/dev/null)
            if [ -z "$PREV_TAG" ]; then
              echo "No rollback tag found, cannot rollback"
              exit 1
            fi

            echo "Rolling back platform to tag: $PREV_TAG"
            set -a; source .env.rollback.platform; set +a
            IMAGE_TAG="$PREV_TAG"
            export IMAGE_TAG

            # Stop ONLY platform services
            podman-compose -f docker-compose.platform.yml stop backend platform-frontend celery_worker celery_beat 2>/dev/null || true

            podman-compose -f docker-compose.platform.yml up -d

            echo "Waiting for rollback health..."
            for i in $(seq 1 15); do
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost:8000/docs 2>/dev/null)
              if [ "$STATUS" = "200" ]; then
                echo "Rollback successful, backend healthy after ${i} attempt(s)"
                exit 0
              fi
              sleep 3
            done
            echo "::error::Rollback also failed!"
            exit 1

  deploy-bots:
    runs-on: ubuntu-latest
    needs: [migrate, detect-changes]
    if: always() && !cancelled() && (needs.detect-changes.outputs.bots == 'true' || needs.detect-changes.outputs.platform == 'true' || inputs.action == 'full')

    steps:
      - name: Restart bot services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          command_timeout: 2m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "Restarting bot services..."
            # Stop ONLY bot service (compose handles container names)
            podman-compose -f docker-compose.bots.yml stop telegram_bot 2>/dev/null || true
            # Clean up legacy bot container
            LEGACY_BOT="${COMPOSE_PROJECT_NAME:-creditcardanalyzer}_telegram_bot_1"
            podman rm -f "$LEGACY_BOT" 2>/dev/null || true
            # Start bot containers
            podman-compose -f docker-compose.bots.yml up -d

            # Wait for bot container to be running
            sleep 5
            BOT_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_telegram_bot_' | head -1)
            if [ -n "$BOT_CONTAINER" ]; then
              BOT_STATUS=$(podman inspect --format='{{.State.Status}}' "$BOT_CONTAINER" 2>/dev/null || echo "missing")
              if [ "$BOT_STATUS" = "running" ]; then
                echo "Bot container running"
              else
                echo "::warning::Bot container status: $BOT_STATUS"
              fi
            else
              echo "::warning::Bot container not found"
            fi
            echo "Bots restarted"

  deploy-nginx:
    runs-on: ubuntu-latest
    needs: [migrate, detect-changes]
    if: always() && !cancelled() && (needs.detect-changes.outputs.nginx == 'true' || inputs.action == 'full')

    steps:
      - name: Restart nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          command_timeout: 2m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "Restarting nginx..."
            # Stop ONLY nginx service (compose handles container names)
            podman-compose -f docker-compose.nginx.yml stop nginx 2>/dev/null || true
            # Start nginx
            podman-compose -f docker-compose.nginx.yml up -d

            # Wait for nginx to be ready
            for i in $(seq 1 10); do
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://127.0.0.1/ 2>/dev/null)
              if [ "$STATUS" = "301" ] || [ "$STATUS" = "200" ]; then
                echo "Nginx healthy after ${i} attempt(s) (status: $STATUS)"
                break
              fi
              echo "Attempt $i/10: got $STATUS, retrying in 2s..."
              sleep 2
            done
            echo "Nginx restarted"

  deploy-landing:
    runs-on: ubuntu-latest
    needs: [migrate, detect-changes]
    if: always() && !cancelled() && (needs.detect-changes.outputs.landing == 'true' || inputs.action == 'full')

    steps:
      - name: Restart landing
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          command_timeout: 2m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            # Guard: skip if landing image not available
            if ! podman image inspect ${LANDING_IMAGE}:${IMAGE_TAG} > /dev/null 2>&1; then
              echo "Landing image not available, skipping (src/landing/ may not exist yet)"
              exit 0
            fi

            echo "Restarting landing..."
            # Stop ONLY landing service (compose handles container names)
            podman-compose -f docker-compose.web-landing.yml stop landing 2>/dev/null || true
            # Start landing
            podman-compose -f docker-compose.web-landing.yml up -d
            echo "Landing restarted"

  deploy-monitoring:
    runs-on: ubuntu-latest
    needs: [migrate, detect-changes]
    if: always() && !cancelled() && (needs.detect-changes.outputs.monitoring == 'true' || inputs.action == 'full')

    steps:
      - name: Restart monitoring
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          command_timeout: 3m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "Restarting monitoring..."
            # Stop ALL monitoring services (compose handles container names)
            podman-compose -f docker-compose.monitoring.yml stop 2>/dev/null || true
            # Start monitoring
            podman-compose -f docker-compose.monitoring.yml up -d
            echo "Monitoring restarted"

  # ── Health check (global) ──────────────────────────────────

  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-platform, deploy-nginx, deploy-bots, deploy-landing, deploy-monitoring]
    if: always() && !cancelled()

    steps:
      - name: Global health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            echo "Waiting for all services to stabilize..."
            sleep 10

            echo ""
            echo "=== Container Status ==="
            podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""

            # Check landing site (non-fatal if not deployed)
            LANDING_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://${{ vars.DOMAIN_NAME }}/ 2>/dev/null)
            echo "Landing (${{ vars.DOMAIN_NAME }}): $LANDING_STATUS"

            # Check platform (critical)
            PLATFORM_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://${{ vars.PLATFORM_DOMAIN }}/api/docs 2>/dev/null)
            echo "Platform (${{ vars.PLATFORM_DOMAIN }}): $PLATFORM_STATUS"

            if [ "$PLATFORM_STATUS" != "200" ]; then
              echo "::warning::Platform health check returned $PLATFORM_STATUS (banner should be visible)"
            fi

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: health-check
    if: success()

    steps:
      - name: Cleanup old images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            echo "Cleaning up old images..."
            # Remove dangling images only, keep tagged versions for rollback
            podman image prune -f 2>/dev/null || true
            # Remove old backup images older than 7 days
            find /opt/creditcardanalyzer/backups -name "db_*.sql.gz" -mtime +7 -delete 2>/dev/null || true
            echo "Cleanup complete"
