name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "docs/specs/**"
      - "config/scripts/generate_roadmap.py"
      - ".sdd/**"
      - ".github/**"
      - "LICENSE"
      - ".gitignore"
      - "assets/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - migrate-only

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/perexp/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/perexp/frontend

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      landing: ${{ steps.changes.outputs.landing }}
      platform: ${{ steps.changes.outputs.platform }}
      backend: ${{ steps.changes.outputs.backend }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      nginx: ${{ steps.changes.outputs.nginx }}
      bots: ${{ steps.changes.outputs.bots }}
      infra: ${{ steps.changes.outputs.infra }}
      ops: ${{ steps.changes.outputs.ops }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            landing:
              - 'src/landing/**'
              - 'docker/docker-compose.web-landing.yml'
            platform:
              - 'src/frontend/**'
              - 'src/backend/**'
              - 'docker/docker-compose.platform.yml'
            backend:
              - 'src/backend/**'
              - 'docker/docker-compose.platform.yml'
            monitoring:
              - 'docker/docker-compose.monitoring.yml'
              - 'docker/alloy/**'
              - 'config/blackbox/**'
            nginx:
              - 'docker/nginx/**'
              - 'docker/docker-compose.nginx.yml'
            bots:
              - 'docker/docker-compose.bots.yml'
            infra:
              - 'docker/docker-compose.infra.yml'
            # Cambios que hay que empujar al server pero que no construyen
            # imágenes. Tiene que cubrir TODO lo que se copia (el scp trae
            # docker/ completo y config/blackbox): si falta un directorio, el
            # cambio se deploya en verde pero no llega nada al server.
            ops:
              - 'docker/**'
              - 'config/blackbox/**'
              - 'scripts/housekeeping.sh'
              - 'scripts/backup-db.sh'

  detect-arch:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.set-platform.outputs.platform }}
      runner: ${{ steps.set-platform.outputs.runner }}
    steps:
      - name: Set platform from server architecture
        id: set-platform
        run: |
          ARCH="${{ vars.SERVER_ARCH }}"
          if [ -z "$ARCH" ]; then
            ARCH="amd64"
            echo "::warning::SERVER_ARCH variable not set. Set it to 'arm64' or 'amd64' in GitHub repository variables. Defaulting to amd64."
          fi
          if [ "$ARCH" = "arm64" ] || [ "$ARCH" = "aarch64" ]; then
            PLATFORM="linux/arm64"
            RUNNER="ubuntu-24.04-arm"
          else
            PLATFORM="linux/amd64"
            RUNNER="ubuntu-latest"
          fi
          echo "Server architecture: $ARCH -> Build platform: $PLATFORM (runner: $RUNNER)"
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "runner=$RUNNER" >> $GITHUB_OUTPUT

  test:
    if: github.event_name == 'push' || inputs.action == 'full'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expenses_test
          POSTGRES_USER: expenses_user
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd src/backend
          pip install -r requirements.txt
          pip install pytest

      - name: Run all tests
        env:
          SECRET_KEY: "test-secret-key-for-ci-that-is-at-least-32-chars"
          TEST_DATABASE_URL: postgresql://expenses_user:test_password_ci@localhost:5432/expenses_test
        run: |
          cd src/backend
          python -m pytest tests/ -v --tb=short

  build-backend:
    if: |
      always() && !cancelled() && needs.test.result == 'success' &&
      (inputs.action == 'full' || needs.detect-changes.outputs.platform == 'true')
    runs-on: ${{ needs.detect-arch.outputs.runner }}
    needs: [test, detect-changes, detect-arch]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          push: true
          platforms: ${{ needs.detect-arch.outputs.platform }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    if: |
      always() && !cancelled() && needs.test.result == 'success' &&
      (inputs.action == 'full' || needs.detect-changes.outputs.platform == 'true')
    runs-on: ${{ needs.detect-arch.outputs.runner }}
    needs: [test, detect-changes, detect-arch]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend
          push: true
          platforms: ${{ needs.detect-arch.outputs.platform }}
          build-args: |
            VITE_APP_ENV=production
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_TELEGRAM_OIDC_CLIENT_ID=${{ secrets.TELEGRAM_OIDC_CLIENT_ID }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Nota: no hay build de landing. `src/landing` no existe y el servicio
  # `landing` corre la MISMA imagen que el frontend (el SPA ya renderiza el
  # sitio institucional cuando el hostname es el apex). Un build propio además
  # pisaba IMAGE_TAG con un sha que nunca se construyó para backend/frontend.
  write-config:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, detect-changes]
    # El `ops` cubre TODO lo que se copia al server y no construye imagen:
    # sin esto, un cambio de nginx o de los compose no llegaba nunca (el
    # `if` original exigía que hubiera un build).
    if: |
      always() && !cancelled() &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success' || needs.detect-changes.outputs.ops == 'true' || inputs.action == 'full')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build .env file securely
        id: env-file
        run: |
          cat > /tmp/env-file << 'ENVEOF'
          BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG=${{ github.sha }}
          DOMAIN_NAME=${{ vars.DOMAIN_NAME }}
          PLATFORM_DOMAIN=${{ vars.PLATFORM_DOMAIN }}
          NETWORK_NAME=oikonomia
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          INVESTMENTS_LLM_API_KEY=${{ secrets.INVESTMENTS_LLM_API_KEY }}
          MESSAGES_BOT_LLM_API_KEY=${{ secrets.MESSAGES_BOT_LLM_API_KEY }}
          LLM_PROVIDER=${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_MODEL_NAME=${{ vars.LLM_MODEL_NAME || 'gpt-6-luna' }}
          LLM_AUDIO_MODEL=${{ vars.LLM_AUDIO_MODEL || 'gpt-4o-mini-transcribe' }}
          LLM_MONTHLY_BUDGET_USD=${{ vars.LLM_MONTHLY_BUDGET_USD || '10' }}
          LLM_CREDIT_AMOUNT_USD=${{ vars.LLM_CREDIT_AMOUNT_USD || '10' }}
          LLM_CREDIT_EXPIRES_AT=${{ vars.LLM_CREDIT_EXPIRES_AT }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OIDC_CLIENT_ID=${{ secrets.TELEGRAM_OIDC_CLIENT_ID }}
          TELEGRAM_OIDC_CLIENT_SECRET=${{ secrets.TELEGRAM_OIDC_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          WHATSAPP_APP_SECRET=${{ secrets.WHATSAPP_APP_SECRET }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          EMAIL_API_KEY=${{ secrets.EMAIL_API_KEY }}
          SMTP_FROM=${{ vars.SMTP_FROM }}
          SMTP_FROM_ADDRESS=${{ vars.SMTP_FROM_ADDRESS }}
          # Password del admin de Grafana. Sin él, Grafana queda con password
          # vacía y su API de sync no autentica: validate-config lo exige.
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          # Chat de Telegram donde llegan las alertas de Grafana.
          TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GRAFANA_CLOUD_PROMETHEUS_URL=${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USER=${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USER }}
          GRAFANA_CLOUD_PROMETHEUS_PASSWORD=${{ secrets.GRAFANA_CLOUD_PROMETHEUS_PASSWORD }}
          GRAFANA_CLOUD_LOKI_URL=${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USER=${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
          GRAFANA_CLOUD_LOKI_PASSWORD=${{ secrets.GRAFANA_CLOUD_LOKI_PASSWORD }}
          ENVEOF
          # Remove leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' /tmp/env-file
          # Base64 encode for safe transfer
          echo "env_b64=$(base64 -w0 /tmp/env-file)" >> $GITHUB_OUTPUT

      - name: Deploy .env to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            set -e
            # Si no hubo builds de la APP, el IMAGE_TAG nuevo nunca se construyó:
            # conservar el que está corriendo para no mover los contenedores a un
            # tag inexistente. Un cambio de ops no debe tocar la aplicación.
            # (No se mira build-landing: la landing corre la imagen del frontend.)
            OLD_TAG=$(grep '^IMAGE_TAG=' /opt/creditcardanalyzer/.env 2>/dev/null | cut -d= -f2 || true)
            echo "${{ steps.env-file.outputs.env_b64 }}" | base64 -d > /opt/creditcardanalyzer/.env
            if [ "${{ needs.build-backend.result }}" != "success" ] && [ "${{ needs.build-frontend.result }}" != "success" ]; then
              if [ -n "$OLD_TAG" ]; then
                echo "Run sin builds de la app — se conserva IMAGE_TAG=$OLD_TAG"
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$OLD_TAG/" /opt/creditcardanalyzer/.env
              fi
            fi
            chmod 600 /opt/creditcardanalyzer/.env
            echo "Config file written securely (base64 transfer)"

      - name: Copy compose and config files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          source: "docker/docker-compose.infra.yml,docker/docker-compose.nginx.yml,docker/docker-compose.platform.yml,docker/docker-compose.bots.yml,docker/docker-compose.monitoring.yml,docker/docker-compose.web-landing.yml,docker/nginx/nginx.conf,docker/nginx/maintenance/,docker/alloy/config.alloy,config/blackbox/blackbox.yml,docker/prometheus/,docker/grafana/,docker/loki/,docker/journal-export.service,docker/ops/"
          target: /opt/creditcardanalyzer
          strip_components: 1

      - name: Copy ops scripts via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          source: "scripts/housekeeping.sh,scripts/backup-db.sh"
          target: /opt/creditcardanalyzer
          strip_components: 0

      - name: Substitute domain variables in nginx.conf
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            DOMAIN_NAME="${{ vars.DOMAIN_NAME }}"
            PLATFORM_DOMAIN="${{ vars.PLATFORM_DOMAIN }}"
            sed -i "s/\${DOMAIN_NAME}/${DOMAIN_NAME}/g" /opt/creditcardanalyzer/nginx/nginx.conf
            sed -i "s/\${PLATFORM_DOMAIN}/${PLATFORM_DOMAIN}/g" /opt/creditcardanalyzer/nginx/nginx.conf
            # Discover the podman network gateway (aardvark-dns) at deploy time.
            # Never hardcode it: recreating the network can change the gateway IP.
            DNS_RESOLVER=$(podman network inspect oikonomia 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['subnets'][0]['gateway'])" 2>/dev/null || echo "")
            if [ -z "$DNS_RESOLVER" ]; then
              echo "::error::Could not discover oikonomia network gateway for nginx resolver"
              exit 1
            fi
            sed -i "s/\${DNS_RESOLVER}/${DNS_RESOLVER}/g" /opt/creditcardanalyzer/nginx/nginx.conf
            echo "nginx.conf variables substituted (DNS resolver: $DNS_RESOLVER)"

      - name: Validate required env vars
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            cd /opt/creditcardanalyzer
            REQUIRED="POSTGRES_PASSWORD LLM_API_KEY SECRET_KEY TELEGRAM_BOT_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET EMAIL_API_KEY ADMIN_EMAIL INVESTMENTS_LLM_API_KEY MESSAGES_BOT_LLM_API_KEY GRAFANA_ADMIN_PASSWORD GRAFANA_CLOUD_PROMETHEUS_URL GRAFANA_CLOUD_PROMETHEUS_USER GRAFANA_CLOUD_PROMETHEUS_PASSWORD GRAFANA_CLOUD_LOKI_URL GRAFANA_CLOUD_LOKI_USER GRAFANA_CLOUD_LOKI_PASSWORD"
            MISSING=""
            for var in $REQUIRED; do
              VALUE=$(grep "^${var}=" .env | cut -d= -f2-)
              if [ -z "$VALUE" ]; then
                MISSING="$MISSING $var"
              fi
            done

            if [ -n "$MISSING" ]; then
              echo "ERROR: Missing or empty required env vars:$MISSING"
              exit 1
            fi
            echo "All required env vars present and non-empty"

  validate-config:
    runs-on: ubuntu-latest
    needs: write-config
    if: always() && needs.write-config.result == 'success'

    steps:
      - name: Validate docker-compose syntax
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            echo "Validating compose-platform.yml..."
            podman-compose -p oikonomia-platform -f docker-compose.platform.yml config --quiet
            echo "compose-platform.yml OK"
            echo "Validating compose-infra.yml..."
            podman-compose -p oikonomia-infra -f docker-compose.infra.yml config --quiet
            echo "compose-infra.yml OK"
            echo "Validating compose-nginx.yml..."
            podman-compose -p oikonomia-nginx -f docker-compose.nginx.yml config --quiet
            echo "compose-nginx.yml OK"
            echo "Validating compose-bots.yml..."
            podman-compose -p oikonomia-bots -f docker-compose.bots.yml config --quiet
            echo "compose-bots.yml OK"
            echo "Validating compose-monitoring.yml..."
            podman-compose -p oikonomia-monitoring -f docker-compose.monitoring.yml config --quiet
            echo "compose-monitoring.yml OK"
            echo "Validating compose-web-landing.yml..."
            podman-compose -p oikonomia-landing -f docker-compose.web-landing.yml config --quiet
            echo "compose-web-landing.yml OK"

      - name: Validate nginx config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            echo "Validating nginx.conf..."
            podman run --rm \
              -v /opt/creditcardanalyzer/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              docker.io/library/nginx:alpine nginx -t
            echo "nginx.conf OK"

  pull-images:
    runs-on: ubuntu-latest
    needs: [write-config, detect-changes]
    if: always() && needs.write-config.result == 'success'

    steps:
      - name: Pull and verify images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            set -e
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            # ── Preflight de disco ──
            # El pull de imágenes es lo primero que ocupa disco. Si se hace con
            # el disco casi lleno, falla con un error de podman que no dice
            # "disco lleno" y no queda nada registrado: ése fue el incidente del
            # 2026-10-23. Primero se limpia, después se descarga.
            MIN_FREE_MB=2048
            HOUSEKEEPING_FREE_MB=5120
            AVAIL_MB=$(df -m --output=avail / | tail -1 | tr -d ' ')
            echo "Disco libre antes del pull: ${AVAIL_MB}MB"
            df -h /

            if [ "$AVAIL_MB" -lt "$HOUSEKEEPING_FREE_MB" ]; then
              echo "::warning::Quedan ${AVAIL_MB}MB (<${HOUSEKEEPING_FREE_MB}MB) — corriendo housekeeping antes del pull"
              bash scripts/housekeeping.sh || echo "::warning::housekeeping falló, se continúa"
              AVAIL_MB=$(df -m --output=avail / | tail -1 | tr -d ' ')
              echo "Disco libre tras housekeeping: ${AVAIL_MB}MB"
            fi

            if [ "$AVAIL_MB" -lt "$MIN_FREE_MB" ]; then
              echo "::error::Quedan ${AVAIL_MB}MB libres (<${MIN_FREE_MB}MB): no se puede hacer pull de imágenes"
              echo "=== podman system df ==="
              podman system df -v || true
              echo "=== imágenes de la app ==="
              podman images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | head -30 || true
              exit 1
            fi

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin || echo "WARN: GHCR login failed (may be public repo)"

            echo "Pulling platform images..."
            podman-compose -p oikonomia-platform -f docker-compose.platform.yml pull

            echo "Pulling infra images..."
            podman-compose -p oikonomia-infra -f docker-compose.infra.yml pull

            echo "Pulling nginx image..."
            podman-compose -p oikonomia-nginx -f docker-compose.nginx.yml pull

            # Verify platform images exist
            echo "Verifying images..."
            if [ "${{ needs.detect-changes.outputs.platform }}" = "true" ] || [ "${{ inputs.action }}" = "full" ]; then
              podman image inspect ${BACKEND_IMAGE}:${IMAGE_TAG} > /dev/null 2>&1 || { echo "ERROR: Backend image not found"; exit 1; }
              podman image inspect ${FRONTEND_IMAGE}:${IMAGE_TAG} > /dev/null 2>&1 || { echo "ERROR: Frontend image not found"; exit 1; }
              echo "Images verified"
            else
              echo "Run sin build de plataforma: se conserva el tag corriendo, no hay imágenes nuevas que verificar"
            fi

  backup-db:
    runs-on: ubuntu-latest
    needs: [pull-images, validate-config, detect-changes]
    # Sólo si el cambio puede tocar datos: platform (código que escribe) o infra
    # (schema, volúmenes). Un cambio de landing o de nginx no puede corromper la
    # base, y cada dump es I/O y disco en cada deploy.
    if: |
      always() && !cancelled() &&
      needs.pull-images.result == 'success' && needs.validate-config.result == 'success' &&
      (needs.detect-changes.outputs.platform == 'true' || needs.detect-changes.outputs.infra == 'true' || inputs.action == 'full')

    steps:
      - name: Backup database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            set -euo pipefail
            cd /opt/creditcardanalyzer
            # La implementación (formato custom + verificación con pg_restore)
            # vive en scripts/backup-db.sh: es la misma que corre el backup
            # diario desde housekeeping.
            bash scripts/backup-db.sh

  # ── Disaggregated deploy jobs ─────────────────────────────

  deploy-infra:
    runs-on: ubuntu-latest
    needs: [backup-db, detect-changes]
    if: |
      always() && !cancelled() &&
      (needs.backup-db.result == 'success' || needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.ops == 'true' || needs.detect-changes.outputs.nginx == 'true' || needs.detect-changes.outputs.monitoring == 'true' || inputs.action == 'full')

    steps:
      - name: Ensure infra is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "Ensuring shared network exists..."
            NETWORK_NAME="${NETWORK_NAME:-oikonomia}"
            podman network create "$NETWORK_NAME" 2>/dev/null || true

            # Ensure external volumes exist (required by compose infra)
            echo "Ensuring external volumes exist..."
            podman volume create creditcardanalyzer_postgres_data 2>/dev/null || true
            podman volume create creditcardanalyzer_redis_data 2>/dev/null || true

            # Stop ALL containers with old project prefix (legacy cleanup)
            echo "Cleaning up legacy containers..."
            for OLD in $(podman ps -a --format '{{.Names}}' | grep '^creditcardanalyzer_' 2>/dev/null); do
              echo "  Removing legacy: $OLD"
              podman stop "$OLD" 2>/dev/null || true
              podman rm -f "$OLD" 2>/dev/null || true
            done

            # Clean up legacy containers from the pre-compose naming.
            # But DO NOT touch infra containers (db, redis) — they have persistent data.
            #
            # OJO: acá NO se detienen los contenedores de la plataforma ni los
            # bots. Cada job (deploy-platform, deploy-bots) detiene los suyos
            # justo antes de recrearlos. Hacerlo acá era una bomba: si el job
            # que recrea queda skipeado — por un backup fallido, por ejemplo —
            # nadie vuelve a levantar la app y producción se queda caída.
            echo "Cleaning up legacy containers..."
            for OLD in $(podman ps -a --format '{{.Names}}' | grep '^creditcardanalyzer_' 2>/dev/null || true); do
              echo "  Removing legacy: $OLD"
              podman stop "$OLD" 2>/dev/null || true
              podman rm -f "$OLD" 2>/dev/null || true
            done
            # NOTE: nginx, monitoring exporters, and alloy are NEVER killed during cleanup.
            # Nginx stays up to serve the maintenance page during platform restarts.
            # Monitoring stays up to keep observability during deploys.

            # Verify cleanup — no legacy containers should remain
            # (grep -c devuelve 1 cuando no hay coincidencias: con `|| echo 0`
            # la variable quedaba "0\n0" y la comparación fallaba)
            REMAINING=$(podman ps -a --format '{{.Names}}' | grep -c '^creditcardanalyzer_' 2>/dev/null || true)
            REMAINING=${REMAINING:-0}
            if [ "$REMAINING" -gt 0 ]; then
              echo "::warning::$REMAINING legacy containers still remain after cleanup:"
              podman ps -a --format '{{.Names}}' | grep '^creditcardanalyzer_'
            fi

            # Check if db is running (compose-agnostic)
            if ! podman ps --format '{{.Names}}' | grep -qE '_db_'; then
              echo "Starting infra (first deploy)..."
              podman-compose -p oikonomia-infra -f docker-compose.infra.yml up -d --force-recreate
            elif [ "${{ needs.detect-changes.outputs.infra }}" = "true" ] || [ "${{ inputs.action }}" = "full" ]; then
              echo "Infra compose changed, restarting..."
              # Force recreate to ensure volume changes take effect
              podman-compose -p oikonomia-infra -f docker-compose.infra.yml stop db redis 2>/dev/null || true
              podman-compose -p oikonomia-infra -f docker-compose.infra.yml up -d --force-recreate
            else
              echo "Infra unchanged, verifying health only..."
            fi

            echo "Waiting for infra health..."
            # Get container names dynamically (works regardless of project name)
            DB_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_db_' | head -1)
            REDIS_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_redis_' | head -1)

            if [ -z "$DB_CONTAINER" ] || [ -z "$REDIS_CONTAINER" ]; then
              echo "::error::Could not find db or redis containers"
              podman ps --format "table {{.Names}}\t{{.Status}}"
              exit 1
            fi

            echo "Found containers: db=$DB_CONTAINER, redis=$REDIS_CONTAINER"

            for i in $(seq 1 20); do
              DB_OK=$(podman inspect --format='{{.State.Health.Status}}' "$DB_CONTAINER" 2>/dev/null || echo "missing")
              REDIS_OK=$(podman inspect --format='{{.State.Health.Status}}' "$REDIS_CONTAINER" 2>/dev/null || echo "missing")
              if [ "$DB_OK" = "healthy" ] && [ "$REDIS_OK" = "healthy" ]; then
                echo "Infra healthy after ${i} attempt(s)"
                break
              fi
              echo "Attempt $i/20: db=$DB_OK, redis=$REDIS_OK, waiting 3s..."
              sleep 3
            done

            DB_FINAL=$(podman inspect --format='{{.State.Health.Status}}' "$DB_CONTAINER" 2>/dev/null || echo "missing")
            REDIS_FINAL=$(podman inspect --format='{{.State.Health.Status}}' "$REDIS_CONTAINER" 2>/dev/null || echo "missing")
            if [ "$DB_FINAL" != "healthy" ] || [ "$REDIS_FINAL" != "healthy" ]; then
              echo "::error::Infra health check failed: db=$DB_FINAL, redis=$REDIS_FINAL"
              exit 1
            fi

            echo "Infra status:"
            podman ps --format "table {{.Names}}\t{{.Status}}" | grep -E "db|redis"

  deploy-platform:
    runs-on: ubuntu-latest
    needs: [deploy-infra, backup-db, detect-changes]
    # Nunca sin su checkpoint: si el backup no corrió porque algo upstream
    # falló, no se recrea la app ni se toca la base.
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.platform == 'true' || inputs.action == 'full') &&
      needs.backup-db.result == 'success'

    steps:
      - name: Save platform rollback snapshot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            cd /opt/creditcardanalyzer
            # Get backend container name dynamically (agnostic to project name)
            BACKEND_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_backend_' | head -1)
            CURRENT_TAG=""
            if [ -n "$BACKEND_CONTAINER" ]; then
              CURRENT_TAG=$(podman inspect --format='{{.Config.Image}}' "$BACKEND_CONTAINER" 2>/dev/null | cut -d: -f2 || echo "")
            fi
            if [ -n "$CURRENT_TAG" ]; then
              echo "$CURRENT_TAG" > /opt/creditcardanalyzer/.rollback_platform_tag
              cp .env .env.rollback.platform
              echo "Platform rollback snapshot saved (tag: $CURRENT_TAG)"
            else
              echo "No previous platform deployment found, skipping rollback snapshot"
            fi

      - name: Restart platform services
        id: restart
        uses: appleboy/ssh-action@v1
        timeout-minutes: 12
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          command_timeout: 10m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "Restarting platform services..."

            # Stop ONLY platform services (compose handles container names)
            echo "Stopping platform services..."
            podman-compose -p oikonomia-platform -f docker-compose.platform.yml stop backend platform-frontend celery_worker celery_beat 2>/dev/null || true

            # Pull new images and force recreate to ensure new image tag is used
            echo "Pulling new platform images..."
            podman-compose -p oikonomia-platform -f docker-compose.platform.yml pull
            echo "Starting platform services..."
            podman-compose -p oikonomia-platform -f docker-compose.platform.yml up -d --force-recreate
            echo "Platform services started"

            echo "Waiting for backend health..."
            DEPLOY_OK=false
            for i in $(seq 1 30); do
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null)
              if [ "$STATUS" = "200" ]; then
                echo "Backend healthy after ${i} attempt(s)"
                DEPLOY_OK=true
                break
              fi
              echo "Attempt $i/30: got $STATUS, retrying in 3s..."
              sleep 3
            done

            if [ "$DEPLOY_OK" = "false" ]; then
              echo "::error::Backend health check failed after restart"
              exit 1
            fi

            # Wait for platform-frontend to be healthy
            echo "Waiting for platform-frontend health..."
            FE_HEALTHY=false
            for i in $(seq 1 30); do
              FE_STATUS=$(podman inspect oikonomia-platform_platform-frontend_1 --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
              if [ "$FE_STATUS" = "healthy" ]; then
                echo "Frontend healthy after ${i} attempt(s)"
                FE_HEALTHY=true
                break
              fi
              echo "Attempt $i/30: frontend=$FE_STATUS, retrying in 3s..."
              sleep 3
            done
            # Sin este veredicto, un frontend que nunca estuvo sano no fallaba el
            # paso y por lo tanto no disparaba el rollback.
            if [ "$FE_HEALTHY" != "true" ]; then
              echo "::error::Platform frontend never became healthy"
              exit 1
            fi

      - name: Rollback on failure
        if: always() && steps.restart.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"

            echo "=== Platform deploy failed, initiating rollback ==="
            # Get backend container name dynamically
            BACKEND_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_backend_' | head -1)
            podman logs "$BACKEND_CONTAINER" --tail 40 2>&1 || true

            PREV_TAG=$(cat /opt/creditcardanalyzer/.rollback_platform_tag 2>/dev/null)
            if [ -z "$PREV_TAG" ]; then
              echo "No rollback tag found, cannot rollback"
              exit 1
            fi

            echo "Rolling back platform to tag: $PREV_TAG"
            set -a; source .env.rollback.platform; set +a
            IMAGE_TAG="$PREV_TAG"
            export IMAGE_TAG

            # Stop ONLY platform services
            podman-compose -p oikonomia-platform -f docker-compose.platform.yml stop backend platform-frontend celery_worker celery_beat 2>/dev/null || true

            podman-compose -p oikonomia-platform -f docker-compose.platform.yml up -d

            echo "Waiting for rollback health..."
            for i in $(seq 1 15); do
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost:8000/docs 2>/dev/null)
              if [ "$STATUS" = "200" ]; then
                echo "Rollback successful, backend healthy after ${i} attempt(s)"
                exit 0
              fi
              sleep 3
            done
            echo "::error::Rollback also failed!"
            exit 1

  deploy-bots:
    runs-on: ubuntu-latest
    needs: [deploy-infra, detect-changes]
    if: always() && !cancelled() && (needs.detect-changes.outputs.bots == 'true' || needs.detect-changes.outputs.platform == 'true' || inputs.action == 'full')

    steps:
      - name: Restart bot services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          command_timeout: 2m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "Restarting bot services..."
            # Stop ONLY bot service (compose handles container names)
            podman-compose -p oikonomia-bots -f docker-compose.bots.yml stop telegram_bot 2>/dev/null || true
            # Start bot containers
            podman-compose -p oikonomia-bots -f docker-compose.bots.yml up -d

            # Wait for bot container to be running
            sleep 5
            BOT_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_telegram_bot_' | head -1)
            if [ -n "$BOT_CONTAINER" ]; then
              BOT_STATUS=$(podman inspect --format='{{.State.Status}}' "$BOT_CONTAINER" 2>/dev/null || echo "missing")
              if [ "$BOT_STATUS" = "running" ]; then
                echo "Bot container running"
              else
                echo "::warning::Bot container status: $BOT_STATUS"
              fi
            else
              echo "::warning::Bot container not found"
            fi
            echo "Bots restarted"

  setup-certs:
    runs-on: ubuntu-latest
    needs: [deploy-platform, detect-changes]
    if: always() && !cancelled() && (needs.detect-changes.outputs.platform == 'true' || inputs.action == 'full')

    steps:
      - name: Check DNS and setup SSL certificates
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            set -e

            # ── DNS gate: only attempt certs if DNS points here ──
            DOMAIN="${{ vars.DOMAIN_NAME }}"
            PLATFORM="${{ vars.PLATFORM_DOMAIN }}"
            RESOLVED_IP=$(python3 -c "import socket; print(socket.gethostbyname('$DOMAIN'))" 2>/dev/null || echo "FAILED")
            SERVER_IP=$(curl -s --connect-timeout 5 https://api.ipify.org || curl -s --connect-timeout 5 https://ifconfig.me)

            echo "Domain: $DOMAIN -> $RESOLVED_IP"
            echo "Server: $SERVER_IP"

            if [ "$RESOLVED_IP" != "$SERVER_IP" ]; then
              echo "::warning::DNS not pointing to this server ($RESOLVED_IP != $SERVER_IP) — skipping SSL setup"
              echo "Run the Deploy workflow again after DNS propagates to obtain certificates."
              exit 0
            fi
            echo "DNS OK — proceeding with SSL setup"

            # ── Check if cert already exists and is valid ──
            CERT_FILE="/opt/creditcardanalyzer/certbot/conf/live/$DOMAIN/fullchain.pem"
            mkdir -p /opt/creditcardanalyzer/certbot/{conf,work,logs}

            # Clean up old domain certbot data if domain changed
            for old_dir in /opt/creditcardanalyzer/certbot/conf/live/*/; do
              old_domain=$(basename "$old_dir")
              if [ "$old_domain" != "$DOMAIN" ] && [ "$old_domain" != "$PLATFORM" ] && [ "$old_domain" != "grafana.$DOMAIN" ] && [ -n "$old_domain" ] && [ "$old_domain" != "README" ]; then
                echo "Removing old cert for domain: $old_domain"
                rm -rf "/opt/creditcardanalyzer/certbot/conf/live/$old_domain"
                rm -rf "/opt/creditcardanalyzer/certbot/conf/archive/$old_domain"
                rm -f "/opt/creditcardanalyzer/certbot/conf/renewal/${old_domain}.conf"
              fi
            done

            # Always ensure grafana symlink exists
            if [ ! -e "/opt/creditcardanalyzer/certbot/conf/live/grafana.$DOMAIN" ] && [ -d "/opt/creditcardanalyzer/certbot/conf/live/$DOMAIN" ]; then
              cd /opt/creditcardanalyzer/certbot/conf/live
              ln -s "$DOMAIN" "grafana.$DOMAIN"
              echo "Symlink created: grafana.$DOMAIN -> $DOMAIN"
            fi

            NEED_CERTBOT=false
            if [ -f "$CERT_FILE" ]; then
                ISSUER=$(openssl x509 -in "$CERT_FILE" -noout -issuer 2>/dev/null)
                EXPIRY=$(openssl x509 -in "$CERT_FILE" -noout -enddate | cut -d= -f2)
                EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
                NOW_EPOCH=$(date +%s)
                DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))

                # Check if cert is self-signed (issuer contains our domain)
                if echo "$ISSUER" | grep -q "CN=$DOMAIN"; then
                    echo "Self-signed cert detected, will replace with Let's Encrypt..."
                    NEED_CERTBOT=true
                elif [ "$DAYS_LEFT" -lt 14 ]; then
                    echo "Certificate expires in $DAYS_LEFT days, will renew..."
                    NEED_CERTBOT=true
                else
                    echo "SSL certificate OK ($DAYS_LEFT days remaining), skipping"
                    exit 0
                fi
            else
                NEED_CERTBOT=true
            fi

            if [ "$NEED_CERTBOT" = "true" ]; then
              # Stop nginx to free port 80 for certbot standalone
              cd /opt/creditcardanalyzer
              export PATH="$HOME/.local/bin:$PATH"
              set -a; source .env; set +a
              podman-compose -p oikonomia-nginx -f docker-compose.nginx.yml stop nginx 2>/dev/null || true
              sleep 2

              # Remove self-signed certs if they exist
              rm -rf "/opt/creditcardanalyzer/certbot/conf/live/$DOMAIN"
              rm -rf "/opt/creditcardanalyzer/certbot/conf/archive/$DOMAIN"
              rm -f "/opt/creditcardanalyzer/certbot/conf/renewal/$DOMAIN.conf"
              rm -rf "/opt/creditcardanalyzer/certbot/conf/live/$PLATFORM"
              rm -rf "/opt/creditcardanalyzer/certbot/conf/archive/$PLATFORM"
              rm -f "/opt/creditcardanalyzer/certbot/conf/renewal/$PLATFORM.conf"
              rm -rf "/opt/creditcardanalyzer/certbot/conf/live/grafana.$DOMAIN"
              rm -rf "/opt/creditcardanalyzer/certbot/conf/archive/grafana.$DOMAIN"
              rm -f "/opt/creditcardanalyzer/certbot/conf/renewal/grafana.$DOMAIN.conf"

              # Request certificate
              echo "Requesting SSL certificate..."
              sudo podman run --rm \
                -v /opt/creditcardanalyzer/certbot/conf:/etc/letsencrypt:Z \
                -v /opt/creditcardanalyzer/certbot/work:/var/lib/letsencrypt:Z \
                -v /opt/creditcardanalyzer/certbot/logs:/var/log/letsencrypt:Z \
                -p 80:80 \
                docker.io/certbot/certbot certonly --standalone --expand \
                -d $DOMAIN \
                -d www.$DOMAIN \
                -d $PLATFORM \
                -d grafana.$DOMAIN \
                --email mmendoza0989@gmail.com \
                --agree-tos --non-interactive
              echo "SSL certificate obtained"

              # Fix ownership
              sudo chown -R $USER:$USER /opt/creditcardanalyzer/certbot/conf

              # Create relative symlink for platform domain (certbot stores all under first domain)
              cd /opt/creditcardanalyzer/certbot/conf/live
              if [ ! -e "$PLATFORM" ] && [ -d "$DOMAIN" ]; then
                ln -s "$DOMAIN" "$PLATFORM"
                echo "Symlink created: $PLATFORM -> $DOMAIN"
              fi

              # Create relative symlink for grafana subdomain
              GRAFANA_DOMAIN="grafana.$DOMAIN"
              if [ ! -e "$GRAFANA_DOMAIN" ] && [ -d "$DOMAIN" ]; then
                ln -s "$DOMAIN" "$GRAFANA_DOMAIN"
                echo "Symlink created: $GRAFANA_DOMAIN -> $DOMAIN"
              fi

              # Fix permissions
              chmod 755 /opt/creditcardanalyzer/certbot/conf/archive 2>/dev/null || true
              chmod 755 /opt/creditcardanalyzer/certbot/conf/archive/$DOMAIN 2>/dev/null || true
              chmod 644 /opt/creditcardanalyzer/certbot/conf/archive/$DOMAIN/*.pem 2>/dev/null || true

              # Restart nginx
              cd /opt/creditcardanalyzer
              podman-compose -p oikonomia-nginx -f docker-compose.nginx.yml up -d
              echo "SSL setup complete"
            fi

  deploy-nginx:
    runs-on: ubuntu-latest
    needs: [deploy-infra, setup-certs, detect-changes]
    # Only run when nginx config changed. Nginx re-resolves upstream IPs automatically
    # via the resolver directive, so platform changes don't need nginx restarts.
    if: always() && !cancelled() && (needs.detect-changes.outputs.nginx == 'true' || inputs.action == 'full')

    steps:
      - name: Update nginx config (rolling restart)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          command_timeout: 2m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            NGINX_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_nginx_' | head -1)

            if [ -z "$NGINX_CONTAINER" ]; then
              echo "No hay nginx corriendo — levantando (primer deploy)"
              podman-compose -p oikonomia-nginx -f docker-compose.nginx.yml up -d
              NGINX_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_nginx_' | head -1)
            else
              # El deploy reemplaza nginx.conf por scp, o sea que el host queda
              # con un inodo NUEVO. Un contenedor montado sobre el archivo viejo
              # no ve el cambio: reload recarga la config vieja y el 502 queda
              # para siempre. Si los inodos no coinciden, recrear UNA vez para
              # tomar el mount nuevo; después de eso esto es siempre falso y
              # sólo se recarga en caliente (sin ventana de caída para los
              # vhosts de landing, plataforma y grafana).
              HOST_INODE=$(stat -c %i /opt/creditcardanalyzer/nginx/nginx.conf)
              CTR_INODE=$(podman exec "$NGINX_CONTAINER" stat -c %i /etc/nginx/conf.d/nginx.conf 2>/dev/null || echo "missing")
              if [ "$HOST_INODE" != "$CTR_INODE" ]; then
                echo "El contenedor monta el inodo viejo ($CTR_INODE) y el host tiene el $HOST_INODE — recreando una vez"
                podman-compose -p oikonomia-nginx -f docker-compose.nginx.yml up -d --force-recreate nginx
                NGINX_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_nginx_' | head -1)
              fi
            fi

            echo "Validando la config de nginx..."
            if ! podman exec "$NGINX_CONTAINER" nginx -t >/tmp/nginx-test.out 2>&1; then
              echo "::error::La config de nginx no valida:"
              cat /tmp/nginx-test.out
              exit 1
            fi
            echo "Config OK — recargando nginx"
            podman exec "$NGINX_CONTAINER" nginx -s reload

            # Mirar la config CARGADA por el proceso, no la del disco: si el
            # reload leyó un inodo viejo, esto lo ve y falla acá en vez de
            # devolverle 502 a quien entre a los dashboards.
            if podman exec "$NGINX_CONTAINER" nginx -T 2>/dev/null | grep -q "host.containers.internal:3000"; then
              echo "::error::nginx sigue con la config vieja cargada (upstream por host.containers.internal)"
              exit 1
            fi

            # Verify nginx is responding (any HTTP response = healthy)
            NGINX_OK=false
            for i in $(seq 1 15); do
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://127.0.0.1/ 2>/dev/null)
              if [ "$STATUS" != "000" ]; then
                echo "Nginx responding after ${i} attempt(s) (status: $STATUS)"
                NGINX_OK=true
                break
              fi
              echo "Attempt $i/15: no response, retrying in 3s..."
              sleep 3
            done

            if [ "$NGINX_OK" = "false" ]; then
              echo "::error::Nginx health check failed"
              podman logs $(podman ps --format '{{.Names}}' | grep -E '_nginx_' | head -1) --tail 20 2>&1 || true
              exit 1
            fi
            echo "Nginx updated"

  deploy-landing:
    runs-on: ubuntu-latest
    # Después de la plataforma y sólo si quedó sana: si el deploy falla y hay
    # rollback, la landing se queda con el bundle que se sabe que anda.
    # `skipped` también vale: un cambio que toca sólo la landing igual tiene que
    # llegar, y en ese caso deploy-platform no corre.
    # NO depende del backup: la landing no toca datos, y atarla al checkpoint la
    # dejaba caída junto con la plataforma cuando el backup fallaba.
    needs: [deploy-platform, detect-changes]
    if: |
      always() && !cancelled() &&
      (needs.detect-changes.outputs.landing == 'true' || needs.detect-changes.outputs.platform == 'true' || inputs.action == 'full') &&
      (needs.deploy-platform.result == 'success' || needs.deploy-platform.result == 'skipped')

    steps:
      - name: Restart landing
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          command_timeout: 2m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            # Guard: skip if the image is not available
            if ! podman image inspect ${FRONTEND_IMAGE}:${IMAGE_TAG} > /dev/null 2>&1; then
              echo "Frontend image not available, skipping"
              exit 0
            fi

            echo "Restarting landing..."
            # Stop ONLY landing service (compose handles container names)
            podman-compose -p oikonomia-landing -f docker-compose.web-landing.yml stop landing 2>/dev/null || true
            # Start landing
            podman-compose -p oikonomia-landing -f docker-compose.web-landing.yml up -d
            echo "Landing restarted"

  deploy-monitoring:
    runs-on: ubuntu-latest
    needs: [deploy-infra, detect-changes]
    # `migrate-only` no corre migraciones (eso es migrations.yml) y no debería
    # reiniciar nada: era una trampa que se veía como "correr migraciones" y
    # terminaba reiniciando journald y alloy.
    if: always() && !cancelled() && inputs.action != 'migrate-only'

    steps:
      - name: Ensure monitoring stack is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          # El setup de monitoring toca journald, logrotate y el stack entero:
          # 4m se quedaba corto y el paso moría a mitad de camino.
          command_timeout: 15m
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a

            echo "=== Monitoring deploy ==="

            # ── 1. Cleanup: kill orphan duplicate journalctl processes ──
            # NOTE: use "[j]ournalctl" trick so pgrep does NOT match this
            # deploy shell itself (its cmdline contains the script text).
            # Plus $$/PPID guard as a second layer. Without this, xargs kill
            # sends TERM to our own shell → exit 143.
            echo "Killing duplicate journalctl processes..."
            for PID in $(pgrep -f "[j]ournalctl -f -o json" 2>/dev/null || true); do
              if [ "$PID" != "$$" ] && [ "$PID" != "$PPID" ]; then
                kill "$PID" 2>/dev/null || true
              fi
            done
            # Kill the legacy export-logs.sh exporter if still running.
            # It was superseded by journal-export.service and duplicates
            # every entry (same __CURSOR appended twice). Same self-match
            # guard via "[e]xport-logs".
            for PID in $(pgrep -f "[e]xport-logs\.sh" 2>/dev/null || true); do
              if [ "$PID" != "$$" ] && [ "$PID" != "$PPID" ]; then
                kill "$PID" 2>/dev/null || true
              fi
            done
            sleep 2

            # ── 2. journal.log rotation ──
            # Antes esto copiaba a /etc/logrotate.d SIN sudo y tapaba el error
            # con `|| true`: la rotación nunca existió y journal.log creció sin
            # techo hasta llenar el disco. Ahora instala con sudo y falla ruidoso.
            echo "Setting up journal.log rotation..."
            mkdir -p /opt/creditcardanalyzer/logs
            if [ ! -f /opt/creditcardanalyzer/ops/logrotate-oikonomia ]; then
              echo "::error::Falta ops/logrotate-oikonomia en el server"
              exit 1
            fi
            sudo cp /opt/creditcardanalyzer/ops/logrotate-oikonomia /etc/logrotate.d/oikonomia
            if ! sudo logrotate -d /etc/logrotate.d/oikonomia >/tmp/logrotate-check.out 2>&1; then
              echo "::error::La config de logrotate no valida:"
              cat /tmp/logrotate-check.out
              exit 1
            fi
            echo "logrotate config OK"

            # journald: tope de 1GB / 15 días. El default (10% del disco, hasta
            # 4GB) se come el disco justo cuando más hace falta.
            sudo mkdir -p /etc/systemd/journald.conf.d
            sudo cp /opt/creditcardanalyzer/ops/journald-oikonomia.conf /etc/systemd/journald.conf.d/oikonomia.conf
            sudo systemctl restart systemd-journald

            # Sólo se fuerza la rotación si ya se pasó del tope: si el
            # logrotate.timer del sistema funciona, esto nunca corre.
            # OJO con archivos enormes: copytruncate COPIA el archivo antes de
            # truncarlo, y con 8GB se pasa del timeout del paso sin aportar
            # nada (el contenido ya está ingerido). Arriba de 1GB se trunca,
            # que es instantáneo y deja el inode igual para el exporter.
            JOURNAL_SIZE=$(stat -c%s /opt/creditcardanalyzer/logs/journal.log 2>/dev/null || echo "0")
            if [ "$JOURNAL_SIZE" -gt 1073741824 ]; then
              echo "journal.log ocupa $((JOURNAL_SIZE / 1048576))MB — truncando en vez de rotar"
              : > /opt/creditcardanalyzer/logs/journal.log
            elif [ "$JOURNAL_SIZE" -gt 209715200 ]; then
              echo "journal.log is $((JOURNAL_SIZE / 1048576))MB, rotating..."
              sudo logrotate -f /etc/logrotate.d/oikonomia
            fi

            # ── 2b. Alertas: inyectar el contact point de Telegram ──
            # Los secretos no entran en git: se reemplazan los placeholders
            # desde .env. Sin chat id las alertas se siguen evaluando y quedan
            # visibles en Grafana, pero no notifican, y el pipeline lo dice.
            echo "Setting up alerting..."
            CONTACT_POINTS=/opt/creditcardanalyzer/grafana/provisioning/alerting/contact-points.yml
            if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_ADMIN_CHAT_ID}" ]; then
              if [ ! -f "$CONTACT_POINTS" ]; then
                echo "::error::Falta $CONTACT_POINTS en el server"
                exit 1
              fi
              sed -i "s|__TELEGRAM_BOT_TOKEN__|${TELEGRAM_BOT_TOKEN}|; s|__TELEGRAM_ADMIN_CHAT_ID__|${TELEGRAM_ADMIN_CHAT_ID}|" "$CONTACT_POINTS"
              # El archivo queda con el bot token: misma protección que .env.
              chmod 600 "$CONTACT_POINTS"
              echo "Contact point de Telegram configurado"

              # Probar el canal. Una alerta que no notifica se descubre recién en
              # el incidente, que es cuando no hace falta. Se manda una sola vez
              # por chat id, no en cada deploy.
              TESTED_CHAT=$(cat /opt/creditcardanalyzer/.telegram_chat_tested 2>/dev/null || true)
              if [ "$TESTED_CHAT" != "${TELEGRAM_ADMIN_CHAT_ID}" ]; then
                TG_HTTP=$(curl -sS -o /tmp/tg-test.out -w "%{http_code}" \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
                  --data-urlencode "text=[oikonomia] Canal de alertas configurado" || echo "000")
                if [ "$TG_HTTP" = "200" ]; then
                  echo "${TELEGRAM_ADMIN_CHAT_ID}" > /opt/creditcardanalyzer/.telegram_chat_tested
                  echo "Notificación de prueba enviada a Telegram"
                else
                  echo "::warning::Telegram no aceptó el mensaje (HTTP $TG_HTTP): las alertas podrían no llegar"
                  head -c 300 /tmp/tg-test.out 2>/dev/null || true
                fi
              fi
            else
              echo "::warning::Falta TELEGRAM_ADMIN_CHAT_ID en .env: las alertas se evalúan pero no notifican"
              rm -f /opt/creditcardanalyzer/grafana/provisioning/alerting/contact-points.yml
              rm -f /opt/creditcardanalyzer/grafana/provisioning/alerting/policies.yml
            fi

            # Textfile collector: métricas de staleness que escriben las alertas
            # de limpieza y backup.
            sudo mkdir -p /var/lib/node_exporter/textfile
            sudo chown "$USER:$USER" /var/lib/node_exporter/textfile

            # ── 3. Start monitoring stack ──
            echo "Starting monitoring stack..."
            podman volume create oikonomia_prometheus_data 2>/dev/null || true
            podman volume create oikonomia_grafana_data 2>/dev/null || true
            podman volume create oikonomia_loki_data 2>/dev/null || true
            podman volume create oikonomia-monitoring_alloy_data 2>/dev/null || true
            # --force-recreate: cambió la red del stack y podman-compose no
            # recrea un contenedor sólo porque cambió a qué red está enganchado.
            # Sin esto los contenedores se quedan en la red vieja y no se
            # resuelven entre sí (502 en el datasource proxy).
            podman-compose -p oikonomia-monitoring -f docker-compose.monitoring.yml up -d --force-recreate

            # ── 4. Prometheus: enable lifecycle API ──
            PROMETHEUS_ARGS=$(podman inspect oikonomia-monitoring_prometheus_1 --format '{{.Config.Cmd}}' 2>/dev/null || echo "")
            if echo "$PROMETHEUS_ARGS" | grep -q "enable-lifecycle"; then
              echo "Prometheus lifecycle API enabled, reloading config..."
              curl -s -X POST http://localhost:9090/-/reload 2>&1 || echo "Reload failed"
            else
              echo "Prometheus needs restart to enable lifecycle API..."
              podman-compose -p oikonomia-monitoring -f docker-compose.monitoring.yml up -d --force-recreate prometheus
              sleep 5
            fi

            # ── 5. Journal-export service + housekeeping timer ──
            echo "Setting up journal-export service..."
            mkdir -p ~/.config/systemd/user
            cp /opt/creditcardanalyzer/journal-export.service ~/.config/systemd/user/ 2>/dev/null || true
            systemctl --user daemon-reload 2>/dev/null || true
            systemctl --user enable journal-export.service 2>/dev/null || true
            systemctl --user restart journal-export.service 2>/dev/null || true

            # Housekeeping diario (imágenes, logs, backups). Corre en el server
            # y no en CI: la limpieza tiene que ocurrir aunque los deploys fallen.
            echo "Setting up housekeeping timer..."
            # Los timers de usuario sólo disparan con la sesión abierta salvo que
            # linger esté habilitado. Toda la historia del disco pasa por este
            # timer: se verifica en cada deploy.
            sudo loginctl enable-linger "$USER"
            cp /opt/creditcardanalyzer/ops/oikonomia-housekeeping.service ~/.config/systemd/user/
            cp /opt/creditcardanalyzer/ops/oikonomia-housekeeping.timer ~/.config/systemd/user/
            systemctl --user daemon-reload
            systemctl --user enable --now oikonomia-housekeeping.timer
            systemctl --user list-timers oikonomia-housekeeping.timer --no-pager || true

            # ── 6. Alloy: reset position + restart with correct config ──
            echo "Resetting Alloy position file..."
            podman stop oikonomia-monitoring_alloy_1 2>/dev/null || true
            sleep 2
            podman start oikonomia-monitoring_alloy_1 2>/dev/null || true
            sleep 3
            podman exec oikonomia-monitoring_alloy_1 rm -f /var/lib/alloy/data/loki.source.file.journal_export/positions.yml 2>/dev/null || true
            podman restart oikonomia-monitoring_alloy_1 2>/dev/null || true

            # ── 7. Connect nginx-exporter to oikonomia network ──
            NGINX_EXPORTER=$(podman ps --format '{{.Names}}' | grep -E '_nginx-exporter_' | head -1)
            if [ -n "$NGINX_EXPORTER" ]; then
              podman network connect oikonomia "$NGINX_EXPORTER" 2>/dev/null || true
            fi

            # ── 8. Verify all containers running ──
            echo "Verifying monitoring containers..."
            EXPECTED="prometheus grafana loki postgres-exporter redis-exporter node-exporter nginx-exporter blackbox-exporter alloy podman-exporter"
            MISSING=""
            for SVC in $EXPECTED; do
              CONTAINER="oikonomia-monitoring_${SVC}_1"
              STATUS=$(podman inspect "$CONTAINER" --format '{{.State.Status}}' 2>/dev/null || echo "missing")
              if [ "$STATUS" != "running" ]; then
                MISSING="$MISSING $SVC"
                echo "::warning::$SVC is not running (status: $STATUS)"
              fi
            done

            if [ -n "$MISSING" ]; then
              echo "::error::Missing monitoring containers:$MISSING"
              echo "Attempting to start missing containers..."
              podman-compose -p oikonomia-monitoring -f docker-compose.monitoring.yml up -d
              sleep 5
            fi

            # ── 9. Verify Loki accepts data ──
            echo "Verifying Loki ingest..."
            sleep 10
            curl -s -X POST http://localhost:3100/loki/api/v1/push -H "Content-Type: application/json" \
              -d "{\"streams\":[{\"stream\":{\"job\":\"deploy-test\"},\"values\":[[\"$(date +%s)000000000\",\"deploy verification\"]]}]}" > /dev/null 2>&1

            # ── 9b. Verify nginx can resolve every upstream ──
            # Un servicio en dos redes deja de tener alias en la red externa y
            # nginx devuelve 502 sin más explicación. Éste es el chequeo que lo
            # agarra en el deploy y no en el incidente.
            echo "Verifying nginx can resolve its upstreams..."
            NGINX_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_nginx_' | head -1 || true)
            if [ -n "$NGINX_CONTAINER" ]; then
              for UPSTREAM in grafana landing; do
                if podman exec "$NGINX_CONTAINER" getent hosts "$UPSTREAM" >/dev/null 2>&1; then
                  echo "  $UPSTREAM resuelve OK"
                else
                  echo "::error::nginx no resuelve '$UPSTREAM': el alias no está en la red compartida"
                  podman exec "$NGINX_CONTAINER" cat /etc/resolv.conf || true
                  exit 1
                fi
              done
            fi

            # ── 9c. Grafana admin password: sincronizar con el secret ──
            # Grafana sólo aplica GF_SECURITY_ADMIN_PASSWORD la primera vez que
            # se inicializa el volumen. El de producción quedó con el default que
            # estaba en el repo (`oikonomia2026`) y todos los deploys siguientes
            # lo ignoraron: una Grafana pública con password conocida. Acá se
            # lleva al valor del secret.
            echo "Syncing Grafana admin password with the secret..."
            grafana_auth() {
              curl -s -o /dev/null --max-time 5 -w '%{http_code}' -u "admin:$1" http://localhost:3000/api/org
            }
            WANT="${GRAFANA_ADMIN_PASSWORD}"
            GOT=$(grafana_auth "$WANT")
            if [ "$GOT" = "200" ]; then
              echo "Grafana admin ya usa el secret"
            else
              echo "  admin + secret -> HTTP $GOT"
              for OLD in oikonomia2026; do
                echo "  admin + password vieja -> HTTP $(grafana_auth "$OLD")"
                if [ "$(grafana_auth "$OLD")" = "200" ]; then
                  echo "Grafana quedó con la password vieja — sincronizando con el secret"
                  PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"oldPassword": sys.argv[1], "newPassword": sys.argv[2]}))' "$OLD" "$WANT")
                  CHG=$(curl -s -o /tmp/gf-pwd.out -w '%{http_code}' -X PUT \
                    -H "Content-Type: application/json" -u "admin:$OLD" \
                    -d "$PAYLOAD" http://localhost:3000/api/user/password)
                  echo "Cambio de password: HTTP $CHG"
                  if [ "$CHG" != "200" ]; then
                    cat /tmp/gf-pwd.out 2>/dev/null || true
                    echo ""
                    exit 1
                  fi
                  GOT=$(grafana_auth "$WANT")
                  break
                fi
              done

              if [ "$GOT" != "200" ]; then
                # Ninguna password conocida: el volumen puede traer una que se
                # cambió a mano. El secret manda — se resetea desde la CLI.
                # Se hace adentro del contenedor contra el mismo SQLite, así que
                # no depende de tener la password anterior.
                GRAFANA_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_grafana_' | head -1 || true)
                if [ -n "$GRAFANA_CONTAINER" ]; then
                  echo "Reseteando el admin de Grafana al secret desde la CLI..."
                  if podman exec "$GRAFANA_CONTAINER" grafana cli admin reset-admin-password "$WANT" >/tmp/gf-reset.out 2>&1; then
                    cat /tmp/gf-reset.out
                  else
                    cat /tmp/gf-reset.out 2>/dev/null || true
                    echo ""
                    echo "::error::No se pudo resetear el admin de Grafana"
                    exit 1
                  fi
                  GOT=$(grafana_auth "$WANT")
                fi
              fi

              if [ "$GOT" != "200" ]; then
                echo "::error::No se pudo converger el admin de Grafana (HTTP $GOT)"
                exit 1
              fi
              echo "Admin de Grafana converge al secret"
            fi

            # ── 9d. Verify Grafana can reach both datasources ──
            # Catches detached-network failures (e.g. a container recreated
            # outside compose so its DNS name no longer resolves).
            # Con reintento: recién recreados, Prometheus y Loki pueden tardar
            # en estar listos y un solo intento daba un falso negativo.
            echo "Verifying Grafana datasource connectivity..."
            GRAFANA_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_grafana_' | head -1 || true)
            ds_check() {
              local uid="$1" path="$2" out="/tmp/ds-$3.out"
              curl -s -o "$out" --max-time 10 -w '%{http_code}' \
                -u "admin:${GRAFANA_ADMIN_PASSWORD}" \
                "http://localhost:3000/api/datasources/proxy/uid/$uid$path"
            }
            ds_ok() {
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('ok' if d.get('status')=='success' else 'fail')" "$1" 2>/dev/null || echo "fail"
            }

            PROM_OK="fail"
            LOKI_OK="fail"
            PROM_HTTP="000"
            LOKI_HTTP="000"
            for ATTEMPT in $(seq 1 12); do
              PROM_HTTP=$(ds_check PBFA97CFB590B2093 "/api/v1/query?query=up" prom)
              LOKI_HTTP=$(ds_check P8E80F9AEF21F6940 "/loki/api/v1/labels" loki)
              PROM_OK=$(ds_ok /tmp/ds-prom.out)
              LOKI_OK=$(ds_ok /tmp/ds-loki.out)
              if [ "$PROM_OK" = "ok" ] && [ "$LOKI_OK" = "ok" ]; then
                echo "Datasources OK al intento $ATTEMPT"
                break
              fi
              echo "  intento $ATTEMPT/12: prometheus=$PROM_OK (HTTP $PROM_HTTP) loki=$LOKI_OK (HTTP $LOKI_HTTP)"
              sleep 5
            done

            if [ "$PROM_OK" != "ok" ]; then
              echo "::error::Grafana cannot reach Prometheus (HTTP $PROM_HTTP)"
              head -c 300 /tmp/ds-prom.out 2>/dev/null || true
              echo ""
              echo "=== Diagnóstico ==="
              echo "Prometheus readiness: $(curl -s -o /dev/null --max-time 5 -w '%{http_code}' http://localhost:9090/-/ready)"
              if [ -n "$GRAFANA_CONTAINER" ]; then
                echo "DNS 'prometheus' desde grafana:"
                podman exec "$GRAFANA_CONTAINER" getent hosts prometheus || echo "  NO RESUELVE"
                echo "Redes de grafana:"
                podman inspect "$GRAFANA_CONTAINER" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
              fi
              podman ps --format '{{.Names}}|{{.Status}}' | grep -E 'prometheus|grafana' || true
              exit 1
            fi
            if [ "$LOKI_OK" != "ok" ]; then
              echo "::error::Grafana cannot reach Loki (HTTP $LOKI_HTTP)"
              head -c 300 /tmp/ds-loki.out 2>/dev/null || true
              echo ""
              exit 1
            fi
            echo "Grafana reaches Prometheus (HTTP $PROM_HTTP) and Loki (HTTP $LOKI_HTTP)"

            # ── 10. Verify Prometheus targets ──
            echo "Verifying Prometheus targets..."
            DOWN_TARGETS=$(curl -s http://localhost:9090/api/v1/targets | python3 -c "
            import sys,json
            d=json.load(sys.stdin)
            down = [t['labels'].get('job','?') + ' -> ' + t['labels'].get('instance','?') for t in d.get('data',{}).get('activeTargets',[]) if t.get('health') != 'up']
            print(','.join(down))
            " 2>/dev/null || echo "")
            if [ -n "$DOWN_TARGETS" ]; then
              echo "::warning::Prometheus targets still down: $DOWN_TARGETS"
            else
              echo "All Prometheus targets UP"
            fi

            echo "Monitoring stack verified"

  # ── Health check (global) ──────────────────────────────────

  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-platform, deploy-nginx, deploy-bots, deploy-landing, deploy-monitoring]
    if: always() && !cancelled()

    steps:
      - name: Global health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            echo "Waiting for services to stabilize..."

            # Check platform via localhost (always works regardless of DNS)
            PLATFORM_STATUS="000"
            for i in $(seq 1 15); do
              PLATFORM_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost:8000/docs 2>/dev/null)
              if [ "$PLATFORM_STATUS" = "200" ]; then
                echo "Platform backend healthy after ${i} attempt(s): $PLATFORM_STATUS"
                break
              fi
              echo "Attempt $i/15: waiting for platform... retrying in 3s"
              sleep 3
            done

            # Also check via domain (non-fatal if DNS not propagated)
            DOMAIN_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://${{ vars.PLATFORM_DOMAIN }}/api/docs 2>/dev/null || echo "000")
            if [ "$DOMAIN_STATUS" = "200" ]; then
              echo "Domain ${{ vars.PLATFORM_DOMAIN }} responding: $DOMAIN_STATUS"
            else
              echo "::warning::Domain ${{ vars.PLATFORM_DOMAIN }} not responding yet (status: $DOMAIN_STATUS) — DNS may not be propagated"
            fi

            echo ""
            echo "=== Container Status ==="
            podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""

            ERRORS=0

            # Verify no legacy containers remain
            LEGACY_COUNT=$(podman ps -a --format '{{.Names}}' | grep -c '^creditcardanalyzer_' 2>/dev/null || true)
            LEGACY_COUNT=${LEGACY_COUNT:-0}
            if [ "$LEGACY_COUNT" -gt 0 ]; then
              echo "::error::$LEGACY_COUNT legacy containers still running:"
              podman ps -a --format '{{.Names}}' | grep '^creditcardanalyzer_'
              ERRORS=$((ERRORS + 1))
            fi

            # Check landing site (critical: tiene que sobrevivir a los deploys de la plataforma)
            LANDING_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://${{ vars.DOMAIN_NAME }}/ 2>/dev/null || echo "000")
            echo "Landing (${{ vars.DOMAIN_NAME }}): $LANDING_STATUS"
            if [ "$LANDING_STATUS" != "200" ]; then
              echo "::error::Landing site devolvió $LANDING_STATUS"
              ERRORS=$((ERRORS + 1))
            fi

            LANDING_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_landing_' | head -1)
            if [ -n "$LANDING_CONTAINER" ]; then
              LANDING_HEALTH=$(podman inspect --format='{{.State.Health.Status}}' "$LANDING_CONTAINER" 2>/dev/null || echo "no-healthcheck")
              echo "Landing container: $LANDING_HEALTH"
              if [ "$LANDING_HEALTH" = "unhealthy" ]; then
                echo "::error::Landing container unhealthy"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            # Check Grafana vhost end-to-end (nginx → grafana:3000). Un 502 acá
            # es una caída de los dashboards, no un warning: el chequeo viejo
            # aceptaba cualquier cosa distinta de 000 y un 502 pasó limpio.
            GRAFANA_STATUS="000"
            for i in $(seq 1 15); do
              GRAFANA_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --resolve grafana.${{ vars.DOMAIN_NAME }}:443:127.0.0.1 "https://grafana.${{ vars.DOMAIN_NAME }}/api/health" 2>/dev/null || echo "000")
              if [ "$GRAFANA_STATUS" = "200" ]; then
                echo "Grafana vhost OK tras ${i} intento(s)"
                break
              fi
              echo "Intento $i/15: grafana devolvió $GRAFANA_STATUS, reintentando en 3s..."
              sleep 3
            done
            echo "Grafana (grafana.${{ vars.DOMAIN_NAME }}): $GRAFANA_STATUS"
            if [ "$GRAFANA_STATUS" != "200" ]; then
              echo "::error::Grafana vhost devolvió $GRAFANA_STATUS — nginx no llega a grafana:3000"
              ERRORS=$((ERRORS + 1))
            fi

            # Check platform (critical) — via localhost (DNS-independent)
            LOCAL_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" http://localhost:8000/docs 2>/dev/null)
            echo "Platform (localhost:8000): $LOCAL_STATUS"
            if [ "$LOCAL_STATUS" != "200" ]; then
              echo "::error::Platform health check returned $LOCAL_STATUS"
              ERRORS=$((ERRORS + 1))
            fi

            # Check database
            DB_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_db_' | head -1 || true)
            if [ -z "$DB_CONTAINER" ]; then
              # Antes esto se salteaba en silencio, así que un run podía quedar
              # verde con la base caída — justo antes de que la limpieza la
              # borre por "no estar en uso".
              echo "::error::No hay contenedor de base corriendo"
              ERRORS=$((ERRORS + 1))
            else
              DB_STATUS=$(podman inspect --format='{{.State.Health.Status}}' "$DB_CONTAINER" 2>/dev/null || echo "missing")
              echo "Database: $DB_STATUS"
              if [ "$DB_STATUS" != "healthy" ]; then
                echo "::error::Database health: $DB_STATUS"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            # Check Redis
            REDIS_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_redis_' | head -1)
            if [ -n "$REDIS_CONTAINER" ]; then
              REDIS_STATUS=$(podman inspect --format='{{.State.Health.Status}}' "$REDIS_CONTAINER" 2>/dev/null || echo "missing")
              echo "Redis: $REDIS_STATUS"
              if [ "$REDIS_STATUS" != "healthy" ]; then
                echo "::error::Redis health: $REDIS_STATUS"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            # Check bot container
            BOT_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_telegram_bot_' | head -1)
            if [ -n "$BOT_CONTAINER" ]; then
              BOT_STATUS=$(podman inspect --format='{{.State.Status}}' "$BOT_CONTAINER" 2>/dev/null || echo "missing")
              echo "Telegram Bot: $BOT_STATUS"
              if [ "$BOT_STATUS" != "running" ]; then
                echo "::warning::Telegram bot status: $BOT_STATUS"
              fi
            fi

            # Check platform-frontend
            FRONTEND_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_platform-frontend_' | head -1)
            if [ -n "$FRONTEND_CONTAINER" ]; then
              FRONTEND_STATUS=$(podman inspect --format='{{.State.Health.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo "no-healthcheck")
              echo "Platform Frontend: $FRONTEND_STATUS"
              if [ "$FRONTEND_STATUS" = "unhealthy" ]; then
                echo "::error::Platform frontend unhealthy"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            # Check nginx
            NGINX_CONTAINER=$(podman ps --format '{{.Names}}' | grep -E '_nginx_' | head -1)
            if [ -n "$NGINX_CONTAINER" ]; then
              NGINX_STATUS=$(podman inspect --format='{{.State.Health.Status}}' "$NGINX_CONTAINER" 2>/dev/null || echo "no-healthcheck")
              echo "Nginx: $NGINX_STATUS"
              if [ "$NGINX_STATUS" = "unhealthy" ]; then
                echo "::error::Nginx unhealthy"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            if [ "$ERRORS" -gt 0 ]; then
              echo "::error::$ERRORS critical health check(s) failed"
              exit 1
            fi

            echo ""
            echo "=== All critical health checks passed ==="

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: health-check
    # Siempre, también cuando el deploy falló: es cuando más se acumula. Antes
    # era `if: success()`, así que una cadena de deploys fallidos nunca limpiaba.
    if: always() && !cancelled()

    steps:
      - name: Housekeeping (imágenes, logs y backups)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a; source .env; set +a
            echo "=== Housekeeping ==="
            bash scripts/housekeeping.sh
