name: Deploy to Linode

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "docs/specs/**"
      - "config/scripts/generate_roadmap.py"
      - ".sdd/**"
      - ".github/**"
      - "LICENSE"
      - ".gitignore"
      - "assets/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - migrate-only

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/perexp/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/perexp/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd src/backend
          pip install -r requirements.txt
          pip install pytest

      - name: Run encryption tests
        env:
          SECRET_KEY: "test-secret-key-for-ci-that-is-at-least-32-chars"
        run: |
          cd src/backend
          python -m pytest tests/test_encryption.py -v

  build-and-push:
    if: github.event_name == 'push' || inputs.action == 'full'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./src/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./src/frontend
          push: true
          build-args: |
            VITE_APP_ENV=production
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  setup-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && !cancelled() && (github.event_name == 'push' || inputs.action == 'full')

    steps:
      - name: Install podman and podman-compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            if ! command -v podman &> /dev/null; then
                echo "Installing podman..."
                sudo dnf install -y podman podman-docker
                sudo systemctl enable --now podman.socket
            else
                echo "podman already installed, skipping"
            fi

            if ! command -v podman-compose &> /dev/null; then
                echo "Installing podman-compose..."
                sudo dnf install -y python3-pip
                pip3 install --user podman-compose
            else
                echo "podman-compose already installed, skipping"
            fi

            sudo mkdir -p /opt/creditcardanalyzer /opt/creditcardanalyzer/backups
            sudo chown -R $USER:$USER /opt/creditcardanalyzer

      - name: Verify DNS resolution
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            RESOLVED_IP=$(python3 -c "import socket; print(socket.gethostbyname('${{ vars.DOMAIN_NAME }}'))" 2>/dev/null)
            SERVER_IP=$(curl -s --connect-timeout 5 https://api.ipify.org || curl -s --connect-timeout 5 https://ifconfig.me)

            echo "Domain: ${{ vars.DOMAIN_NAME }}"
            echo "Platform: ${{ vars.PLATFORM_DOMAIN }}"
            echo "Resolved IP: $RESOLVED_IP"
            echo "Server IP: $SERVER_IP"

            if [ "$RESOLVED_IP" != "$SERVER_IP" ]; then
              echo "ERROR: DNS not pointing to this server ($RESOLVED_IP != $SERVER_IP)"
              exit 1
            fi
            echo "DNS OK: ${{ vars.DOMAIN_NAME }} -> $SERVER_IP"

      - name: Stop old containers to free port 80
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer 2>/dev/null || true
            export PATH="$HOME/.local/bin:$PATH"
            # Stop old nginx to free port 80 for certbot
            podman-compose down --remove-orphans 2>/dev/null || true
            # Kill any orphaned containers on port 80/443
            podman kill $(podman ps -q --filter "publish=80") 2>/dev/null || true
            podman kill $(podman ps -q --filter "publish=443") 2>/dev/null || true
            echo "Old containers stopped, port 80 is free"

      - name: Setup SSL certificates
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            mkdir -p /opt/creditcardanalyzer/certbot/{conf,work,logs}

            # Clean up old domain certbot data if domain changed
            for old_dir in /opt/creditcardanalyzer/certbot/conf/live/*/; do
              old_domain=$(basename "$old_dir")
              if [ "$old_domain" != "${{ vars.DOMAIN_NAME }}" ] && [ "$old_domain" != "${{ vars.PLATFORM_DOMAIN }}" ] && [ -n "$old_domain" ]; then
                echo "Removing old cert for domain: $old_domain"
                rm -rf "/opt/creditcardanalyzer/certbot/conf/live/$old_domain"
                rm -rf "/opt/creditcardanalyzer/certbot/conf/archive/$old_domain"
                rm -f "/opt/creditcardanalyzer/certbot/conf/renewal/${old_domain}.conf"
              fi
            done

            CERT_FILE="/opt/creditcardanalyzer/certbot/conf/live/${{ vars.DOMAIN_NAME }}/fullchain.pem"

            if [ -f "$CERT_FILE" ]; then
                # Check if cert covers grafana subdomain (new SAN)
                if ! openssl x509 -in "$CERT_FILE" -noout -text | grep -q "grafana.${{ vars.DOMAIN_NAME }}"; then
                    echo "Cert does not cover grafana subdomain, forcing re-issue..."
                    rm -f "$CERT_FILE"
                else
                    # Check if cert expires within 14 days
                    EXPIRY=$(openssl x509 -in "$CERT_FILE" -noout -enddate | cut -d= -f2)
                    EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
                    NOW_EPOCH=$(date +%s)
                    DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))

                    if [ "$DAYS_LEFT" -lt 14 ]; then
                        echo "Certificate expires in $DAYS_LEFT days, forcing renewal..."
                        rm -f "$CERT_FILE"
                    else
                        echo "SSL certificate OK ($DAYS_LEFT days remaining), skipping"
                        exit 0
                    fi
                fi
            fi

            echo "Requesting SSL certificate..."
            podman run --rm \
              -v /opt/creditcardanalyzer/certbot/conf:/etc/letsencrypt:Z \
              -v /opt/creditcardanalyzer/certbot/work:/var/lib/letsencrypt:Z \
              -v /opt/creditcardanalyzer/certbot/logs:/var/log/letsencrypt:Z \
              -p 80:80 \
              docker.io/certbot/certbot certonly --standalone --expand \
              -d ${{ vars.DOMAIN_NAME }} \
              -d www.${{ vars.DOMAIN_NAME }} \
              -d ${{ vars.PLATFORM_DOMAIN }} \
              -d grafana.${{ vars.DOMAIN_NAME }} \
              --email mmendoza0989@gmail.com \
              --agree-tos --non-interactive
            echo "SSL certificate obtained"

      - name: Fix cert permissions
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            chmod 755 /opt/creditcardanalyzer/certbot/conf/archive 2>/dev/null || true
            chmod 755 /opt/creditcardanalyzer/certbot/conf/archive/${{ vars.DOMAIN_NAME }} 2>/dev/null || true
            chmod 644 /opt/creditcardanalyzer/certbot/conf/archive/${{ vars.DOMAIN_NAME }}/*.pem 2>/dev/null || true
            echo "Cert permissions fixed"

      - name: Setup certbot renewal timer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            if [ -f /etc/systemd/system/certbot-renew.timer ]; then
                echo "Certbot renewal timer already exists, skipping"
            else
                echo "Creating certbot renewal timer..."
                cat > /etc/systemd/system/certbot-renew.service << 'UNIT'
            [Unit]
            Description=Certbot SSL Certificate Renewal
            After=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/podman run --rm \
              -v /opt/creditcardanalyzer/certbot/conf:/etc/letsencrypt:z \
              -v /opt/creditcardanalyzer/certbot/work:/var/lib/letsencrypt:z \
              -v /opt/creditcardanalyzer/certbot/logs:/var/log/letsencrypt:z \
              docker.io/certbot/certbot renew --quiet
            UNIT

                cat > /etc/systemd/system/certbot-renew.timer << 'UNIT'
            [Unit]
            Description=Run certbot renewal twice daily

            [Timer]
            OnCalendar=daily
            RandomizedDelaySec=3600
            Persistent=true

            [Install]
            WantedBy=timers.target
            UNIT

                systemctl daemon-reload
                systemctl enable --now certbot-renew.timer
                echo "Certbot renewal timer installed"
            fi

      - name: Open firewall ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            if firewall-cmd --list-ports | grep -q "80/tcp"; then
                echo "Port 80 already open, skipping"
            else
                echo "Opening port 80..."
                sudo firewall-cmd --permanent --add-port=80/tcp
            fi

            if firewall-cmd --list-ports | grep -q "443/tcp"; then
                echo "Port 443 already open, skipping"
            else
                echo "Opening port 443..."
                sudo firewall-cmd --permanent --add-port=443/tcp
            fi

            sudo firewall-cmd --reload
            echo "Firewall ports: $(firewall-cmd --list-ports)"

  write-config:
    runs-on: ubuntu-latest
    needs: setup-server
    if: always() && !cancelled() && (github.event_name == 'push' || inputs.action == 'full')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write config files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}"
            FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}"
            IMAGE_TAG="${{ github.sha }}"

            # Write nginx.conf
            mkdir -p /opt/creditcardanalyzer/nginx
            cat > /opt/creditcardanalyzer/nginx/nginx.conf << 'NGINXEOF'
            # Internal: stub_status for nginx-exporter (not exposed externally)
            server {
                listen 8080;
                server_name localhost;
                location /stub_status {
                    stub_status;
                    allow 10.0.0.0/8;
                    allow 172.16.0.0/12;
                    allow 192.168.0.0/16;
                    allow 127.0.0.1;
                    deny all;
                }
            }

            # HTTP → HTTPS redirect
            server {
                listen 80 default_server;
                server_name _;
                return 301 https://${{ vars.DOMAIN_NAME }}$request_uri;
            }

            # www → apex redirect
            server {
                listen 443 ssl;
                server_name www.${{ vars.DOMAIN_NAME }};
                ssl_certificate /etc/letsencrypt/live/${{ vars.DOMAIN_NAME }}/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/${{ vars.DOMAIN_NAME }}/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                return 301 https://${{ vars.DOMAIN_NAME }}$request_uri;
            }

            # Landing site: oikonomia.ar
            server {
                listen 443 ssl default_server;
                server_name $host;

                ssl_certificate /etc/letsencrypt/live/${{ vars.DOMAIN_NAME }}/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/${{ vars.DOMAIN_NAME }}/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers HIGH:!aNULL:!MD5;
                ssl_prefer_server_ciphers on;
                ssl_session_cache shared:SSL:10m;
                ssl_session_timeout 10m;

                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header X-Content-Type-Options nosniff;
                add_header X-Frame-Options DENY;

                gzip on;
                gzip_types text/plain text/css application/json application/javascript text/xml;

                location / {
                    proxy_pass http://frontend:80;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_buffering off;
                    proxy_cache off;
                    proxy_read_timeout 86400;
                }
            }

            # App: platform.oikonomia.ar
            server {
                listen 443 ssl;
                server_name ${{ vars.PLATFORM_DOMAIN }};

                ssl_certificate /etc/letsencrypt/live/${{ vars.DOMAIN_NAME }}/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/${{ vars.DOMAIN_NAME }}/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers HIGH:!aNULL:!MD5;
                ssl_prefer_server_ciphers on;
                ssl_session_cache shared:SSL:10m;
                ssl_session_timeout 10m;

                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header X-Content-Type-Options nosniff;
                add_header X-Frame-Options DENY;
                add_header X-Robots-Tag "noindex, nofollow" always;

                gzip on;
                gzip_types text/plain text/css application/json application/javascript text/xml;

                location = /robots.txt {
                    return 200 "User-agent: *\nDisallow: /";
                    add_header Content-Type text/plain;
                }

                location = /sitemap.xml {
                    return 404;
                }

                location / {
                    proxy_pass http://frontend:80;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_buffering off;
                    proxy_cache off;
                    proxy_read_timeout 86400;
                }

                location = /api/metrics {
                    deny all;
                    return 404;
                }
            }

            # Grafana: grafana.oikonomia.ar
            server {
                listen 443 ssl;
                server_name grafana.${{ vars.DOMAIN_NAME }};

                ssl_certificate /etc/letsencrypt/live/${{ vars.DOMAIN_NAME }}/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/${{ vars.DOMAIN_NAME }}/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers HIGH:!aNULL:!MD5;

                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header X-Content-Type-Options nosniff;
                add_header X-Frame-Options DENY;
                add_header X-Robots-Tag "noindex, nofollow" always;

                location / {
                    resolver 10.89.0.1 valid=30s ipv6=off;
                    set $grafana_upstream grafana;
                    proxy_pass http://$grafana_upstream:3000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 120s;
                    proxy_send_timeout 30s;
                }
            }
            NGINXEOF

            # Write prometheus config
            mkdir -p /opt/creditcardanalyzer/prometheus
            cat > /opt/creditcardanalyzer/prometheus/prometheus.yml << 'PROMEOF'
            global:
              scrape_interval: 15s
              evaluation_interval: 15s

            scrape_configs:
              - job_name: "oikonomia-backend"
                metrics_path: "/metrics"
                static_configs:
                  - targets:
                      - "backend:8000"

              - job_name: "postgres"
                static_configs:
                  - targets:
                      - "postgres-exporter:9187"

              - job_name: "redis"
                static_configs:
                  - targets:
                      - "redis-exporter:9121"

              - job_name: "node"
                static_configs:
                  - targets:
                      - "node-exporter:9100"

              - job_name: "nginx"
                static_configs:
                  - targets:
                      - "nginx-exporter:9113"
            PROMEOF

            # Write grafana provisioning
            mkdir -p /opt/creditcardanalyzer/grafana/provisioning/datasources
            mkdir -p /opt/creditcardanalyzer/grafana/provisioning/dashboards
            mkdir -p /opt/creditcardanalyzer/grafana/dashboards
            cat > /opt/creditcardanalyzer/grafana/provisioning/datasources/datasource.yml << 'GFDSEOF'
            apiVersion: 1

            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus:9090
                isDefault: true
                editable: false
            GFDSEOF
            cat > /opt/creditcardanalyzer/grafana/provisioning/dashboards/dashboard.yml << 'GFDBEOF'
            apiVersion: 1

            providers:
              - name: "Oikonomia"
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: false
                options:
                  path: /var/lib/grafana/dashboards
                  foldersFromFilesStructure: false
            GFDBEOF

            # Write grafana dashboard JSON
            echo '' | base64 -d > /opt/creditcardanalyzer/grafana/dashboards/application.json
            echo '' | base64 -d > /opt/creditcardanalyzer/grafana/dashboards/system.json
            echo '' | base64 -d > /opt/creditcardanalyzer/grafana/dashboards/database.json
            echo '' | base64 -d > /opt/creditcardanalyzer/grafana/dashboards/infrastructure.json
            rm -f /opt/creditcardanalyzer/grafana/dashboards/fastapi.json
            echo "Dashboards written"


            # Write docker-compose.yml
            cat > /opt/creditcardanalyzer/docker-compose.yml << 'EOF'
            services:
              db:
                image: docker.io/library/postgres:16-alpine
                ports:
                  - "5432:5432"
                environment:
                  POSTGRES_DB: expenses
                  POSTGRES_USER: expenses_user
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U expenses_user -d expenses"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                deploy:
                  resources:
                    limits:
                      memory: 512M
                      cpus: "1.0"

              redis:
                image: docker.io/library/redis:7-alpine
                volumes:
                  - redis_data:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              backend:
                image: ${BACKEND_IMAGE}:${IMAGE_TAG}
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
                  interval: 5s
                  timeout: 3s
                  retries: 10
                  start_period: 15s
                environment:
                  DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD}@db:5432/expenses
                  REDIS_URL: redis://redis:6379/0
                  PYTHONUNBUFFERED: "1"
                  APP_ENV: production
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                  LLM_API_KEY: ${LLM_API_KEY}
                  INVESTMENTS_LLM_API_KEY: ${INVESTMENTS_LLM_API_KEY}
                  MESSAGES_BOT_LLM_API_KEY: ${MESSAGES_BOT_LLM_API_KEY}
                  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
                  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
                  SECRET_KEY: ${SECRET_KEY}
                  EMAIL_API_KEY: ${EMAIL_API_KEY}
                  SMTP_FROM: ${{ vars.SMTP_FROM }}
                  SMTP_FROM_ADDRESS: ${{ vars.SMTP_FROM_ADDRESS }}
                  FRONTEND_URL: https://${{ vars.PLATFORM_DOMAIN }}
                  CORS_ORIGINS: https://${{ vars.DOMAIN_NAME }},https://www.${{ vars.DOMAIN_NAME }},https://${{ vars.PLATFORM_DOMAIN }}
                  TZ: America/Argentina/Buenos_Aires
                deploy:
                  resources:
                    limits:
                      memory: 512M
                      cpus: "1.0"
                restart: unless-stopped

              celery_worker:
                image: ${BACKEND_IMAGE}:${IMAGE_TAG}
                command: celery -A app.celery_app worker --loglevel=info --concurrency=2
                depends_on:
                  - db
                  - redis
                environment:
                  DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD}@db:5432/expenses
                  REDIS_URL: redis://redis:6379/0
                  PYTHONUNBUFFERED: "1"
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                  LLM_API_KEY: ${LLM_API_KEY}
                  INVESTMENTS_LLM_API_KEY: ${INVESTMENTS_LLM_API_KEY}
                  MESSAGES_BOT_LLM_API_KEY: ${MESSAGES_BOT_LLM_API_KEY}
                  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
                  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
                  SECRET_KEY: ${SECRET_KEY}
                  EMAIL_API_KEY: ${EMAIL_API_KEY}
                  SMTP_FROM: ${{ vars.SMTP_FROM }}
                  SMTP_FROM_ADDRESS: ${{ vars.SMTP_FROM_ADDRESS }}
                  ADMIN_EMAIL: ${ADMIN_EMAIL}
                  TZ: America/Argentina/Buenos_Aires
                deploy:
                  resources:
                    limits:
                      memory: 1G
                      cpus: "1.0"
                restart: unless-stopped

              celery_beat:
                image: ${BACKEND_IMAGE}:${IMAGE_TAG}
                command: celery -A app.celery_app beat --loglevel=info
                depends_on:
                  - db
                  - redis
                environment:
                  DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD}@db:5432/expenses
                  REDIS_URL: redis://redis:6379/0
                  PYTHONUNBUFFERED: "1"
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                  LLM_API_KEY: ${LLM_API_KEY}
                  INVESTMENTS_LLM_API_KEY: ${INVESTMENTS_LLM_API_KEY}
                  MESSAGES_BOT_LLM_API_KEY: ${MESSAGES_BOT_LLM_API_KEY}
                  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
                  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
                  SECRET_KEY: ${SECRET_KEY}
                  EMAIL_API_KEY: ${EMAIL_API_KEY}
                  SMTP_FROM: ${{ vars.SMTP_FROM }}
                  SMTP_FROM_ADDRESS: ${{ vars.SMTP_FROM_ADDRESS }}
                  ADMIN_EMAIL: ${ADMIN_EMAIL}
                  TZ: America/Argentina/Buenos_Aires
                deploy:
                  resources:
                    limits:
                      memory: 256M
                      cpus: "0.5"
                restart: unless-stopped

              frontend:
                image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
                depends_on:
                  backend:
                    condition: service_healthy
                deploy:
                  resources:
                    limits:
                      memory: 256M
                      cpus: "0.5"
                restart: unless-stopped

              nginx:
                image: docker.io/library/nginx:alpine
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
                  - ./certbot/conf:/etc/letsencrypt:ro,Z
                depends_on:
                  - frontend
                healthcheck:
                  test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/ || exit 1"]
                  interval: 30s
                  timeout: 5s
                  start_period: 10s
                  retries: 3
                deploy:
                  resources:
                    limits:
                      memory: 128M
                      cpus: "0.5"
                restart: unless-stopped

              prometheus:
                image: docker.io/prom/prometheus:latest
                command:
                  - "--config.file=/etc/prometheus/prometheus.yml"
                  - "--storage.tsdb.retention.time=15d"
                volumes:
                  - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                  - prometheus_data:/prometheus
                deploy:
                  resources:
                    limits:
                      memory: 512M
                      cpus: "1.0"
                restart: unless-stopped

              grafana:
                image: docker.io/grafana/grafana:13.2.1
                environment:
                  GF_SECURITY_ADMIN_USER: admin
                  GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
                  GF_AUTH_ANONYMOUS_ENABLED: "false"
                  GF_SERVER_ROOT_URL: https://grafana.${{ vars.DOMAIN_NAME }}
                  GF_PLUGINS_DISABLE: grafana-pyroscope-app,grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-advisor-app,mssql,mysql
                volumes:
                  - ./grafana/provisioning:/etc/grafana/provisioning:ro
                  - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
                  - grafana_data:/var/lib/grafana
                depends_on:
                  - prometheus
                deploy:
                  resources:
                    limits:
                      memory: 512M
                      cpus: "0.5"
                restart: unless-stopped

              postgres-exporter:
                image: docker.io/prometheuscommunity/postgres-exporter:latest
                environment:
                  DATA_SOURCE_NAME: "postgresql://expenses_user:${POSTGRES_PASSWORD}@db:5432/expenses?sslmode=disable"
                depends_on:
                  - db
                deploy:
                  resources:
                    limits:
                      memory: 64M
                      cpus: "0.25"
                restart: unless-stopped

              redis-exporter:
                image: docker.io/oliver006/redis_exporter:latest
                environment:
                  REDIS_ADDR: "redis://redis:6379"
                depends_on:
                  - redis
                deploy:
                  resources:
                    limits:
                      memory: 64M
                      cpus: "0.25"
                restart: unless-stopped

              node-exporter:
                image: docker.io/prom/node-exporter:latest
                command:
                  - "--path.procfs=/host/proc"
                  - "--path.sysfs=/host/sys"
                  - "--path.rootfs=/host/root"
                  - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
                volumes:
                  - /proc:/host/proc:ro
                  - /sys:/host/sys:ro
                  - /:/host:ro
                deploy:
                  resources:
                    limits:
                      memory: 64M
                      cpus: "0.25"
                restart: unless-stopped

              nginx-exporter:
                image: docker.io/nginx/nginx-prometheus-exporter:latest
                command:
                  - "-nginx.scrape-uri=http://nginx:8080/stub_status"
                depends_on:
                  - nginx
                deploy:
                  resources:
                    limits:
                      memory: 32M
                      cpus: "0.1"
                restart: unless-stopped

            volumes:
              postgres_data:
              redis_data:
              prometheus_data:
              grafana_data:
            EOF

            # Write .env
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" > /opt/creditcardanalyzer/.env
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> /opt/creditcardanalyzer/.env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> /opt/creditcardanalyzer/.env

            # App secrets (individual, no base64)
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> /opt/creditcardanalyzer/.env
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "INVESTMENTS_LLM_API_KEY=${{ secrets.INVESTMENTS_LLM_API_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "MESSAGES_BOT_LLM_API_KEY=${{ secrets.MESSAGES_BOT_LLM_API_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> /opt/creditcardanalyzer/.env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> /opt/creditcardanalyzer/.env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> /opt/creditcardanalyzer/.env
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> /opt/creditcardanalyzer/.env
            echo "EMAIL_API_KEY=${{ secrets.EMAIL_API_KEY }}" >> /opt/creditcardanalyzer/.env
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> /opt/creditcardanalyzer/.env

            chmod 600 /opt/creditcardanalyzer/.env
            echo "Config files written"

      - name: Validate required env vars
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            REQUIRED="POSTGRES_PASSWORD LLM_API_KEY SECRET_KEY TELEGRAM_BOT_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET EMAIL_API_KEY ADMIN_EMAIL"
            MISSING=""
            for var in $REQUIRED; do
              if ! grep -q "^${var}=" .env; then
                MISSING="$MISSING $var"
              fi
            done

            if [ -n "$MISSING" ]; then
              echo "ERROR: Missing required env vars:$MISSING"
              exit 1
            fi
            echo "All required env vars present"

  validate-config:
    runs-on: ubuntu-latest
    needs: write-config
    if: always() && !cancelled() && (github.event_name == 'push' || inputs.action == 'full')

    steps:
      - name: Validate docker-compose syntax
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            echo "Validating docker-compose.yml..."
            podman-compose config --quiet
            echo "docker-compose.yml OK"

      - name: Validate nginx config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            echo "Validating nginx.conf..."
            podman run --rm \
              -v /opt/creditcardanalyzer/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              docker.io/library/nginx:alpine nginx -t
            echo "nginx.conf OK"

  pull-images:
    runs-on: ubuntu-latest
    needs: validate-config
    if: always() && !cancelled() && (github.event_name == 'push' || inputs.action == 'full')

    steps:
      - name: Pull and verify images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            # Substitute domains in nginx.conf
            DOMAIN_NAME="${{ vars.DOMAIN_NAME }}"
            PLATFORM_DOMAIN="${{ vars.PLATFORM_DOMAIN }}"
            sed -i "s/\${OIKONOMIA_DOMAIN}/${DOMAIN_NAME}/g" /opt/creditcardanalyzer/nginx/nginx.conf
            sed -i "s/\${PLATFORM_DOMAIN}/${PLATFORM_DOMAIN}/g" /opt/creditcardanalyzer/nginx/nginx.conf

            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin || echo "WARN: GHCR login failed (may be public repo)"

            echo "Pulling new images..."
            podman-compose pull

            # Verify images exist
            echo "Verifying images..."
            podman image inspect ${BACKEND_IMAGE}:${IMAGE_TAG} > /dev/null 2>&1 || { echo "ERROR: Backend image not found"; exit 1; }
            podman image inspect ${FRONTEND_IMAGE}:${IMAGE_TAG} > /dev/null 2>&1 || { echo "ERROR: Frontend image not found"; exit 1; }
            echo "Images verified"

  backup-db:
    runs-on: ubuntu-latest
    needs: pull-images
    if: always() && !cancelled()

    steps:
      - name: Backup database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            BACKUP_DIR="/opt/creditcardanalyzer/backups"
            mkdir -p $BACKUP_DIR

            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="$BACKUP_DIR/db_${TIMESTAMP}.sql"

            echo "Backing up database..."
            podman exec creditcardanalyzer_db_1 \
              pg_dump -U expenses_user expenses > $BACKUP_FILE 2>/dev/null

            # Compress
            gzip $BACKUP_FILE

            # Verify backup is not empty
            if [ ! -s "${BACKUP_FILE}.gz" ]; then
              echo "ERROR: Database backup is empty"
              exit 1
            fi

            # Clean up backups older than 12 days
            find $BACKUP_DIR -name "db_*.sql.gz" -mtime +12 -delete

            BACKUP_SIZE=$(du -h ${BACKUP_FILE}.gz | cut -f1)
            echo "Backup saved: ${BACKUP_FILE}.gz ($BACKUP_SIZE)"

            # List current backups
            echo "Current backups:"
            ls -lh $BACKUP_DIR/db_*.sql.gz 2>/dev/null | tail -5

  migrate:
    runs-on: ubuntu-latest
    needs: backup-db

    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            echo "=== Step 0: Verify SECRET_KEY ==="
            KEY_CHECK=$(podman-compose run --rm backend python -c "
            from app.services.encryption import verify_key_works
            if verify_key_works():
                print('KEY_VALID')
            else:
                print('KEY_INVALID')
            " 2>&1)

            if echo "$KEY_CHECK" | grep -q "KEY_INVALID"; then
              echo "::error::SECRET_KEY cannot encrypt/decrypt! Aborting deployment."
              exit 1
            fi
            echo "SECRET_KEY verified successfully"

            echo "=== Step 1: Database structure migration ==="
            for script in migrate_add_reset_token migrate_remove_haberes migrate_encrypt_settings migrate_add_monthly_reports migrate_db_structure migrate_add_card_account_link migrate_add_budgets migrate_add_category_suggestions migrate_add_whatsapp migrate_add_google_refresh_token migrate_add_merchant_preferences migrate_security_columns migrate_add_expense_created_at; do
              if ! podman-compose run --rm backend python -m scripts.$script; then
                echo "::warning::Migration $script had issues (may already be applied)"
              fi
            done

            echo "=== Step 2: Dry-run encryption migration ==="
            DRY_RUN=$(podman-compose run --rm backend python scripts/dry_run_migration.py 2>&1)
            echo "$DRY_RUN"

            if echo "$DRY_RUN" | grep -q "Status: FAIL"; then
              echo "::error::Dry-run failed! Aborting deployment."
              exit 1
            fi

            echo "=== Step 3: Run encryption migration ==="
            if ! podman-compose run --rm backend python scripts/migrate_encrypt_fields.py; then
              echo "::error::Encryption migration failed!"
              exit 1
            fi

            echo "=== Step 4: Verify encryption ==="
            VERIFY=$(podman-compose run --rm backend python scripts/verify_encryption.py 2>&1)
            echo "$VERIFY"

            if echo "$VERIFY" | grep -q "Status: FAIL"; then
              echo "::error::Verification failed! Rolling back database..."
              LATEST=$(ls -t /opt/creditcardanalyzer/backups/db_*.sql.gz | head -1)
              if [ -n "$LATEST" ]; then
                echo "Restoring from: $LATEST"
                gunzip -c $LATEST | podman exec -i creditcardanalyzer_db_1 psql -U expenses_user expenses
                echo "Database restored from backup"
              else
                echo "::error::No backup found!"
              fi
              exit 1
            fi

            echo "=== Migration complete and verified ==="

  restart-and-verify:
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            # Save current image tag for rollback
            CURRENT_TAG=$IMAGE_TAG
            echo "Current tag: $CURRENT_TAG"

            # Stop old containers
            echo "Stopping old containers..."
            podman-compose down --remove-orphans 2>/dev/null || true

            # Start new containers
            echo "Starting new containers..."
            podman-compose up -d --remove-orphans

      - name: Health check with retry
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            cd /opt/creditcardanalyzer
            set -a
            source .env
            set +a

            echo "Waiting for services to start..."
            sleep 15

            RETRIES=20
            SLEEP=5
            DEPLOY_OK=false

            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://${{ vars.PLATFORM_DOMAIN }}/api/docs 2>/dev/null)
              if [ "$STATUS" = "200" ]; then
                echo "Deploy OK after ${i} attempt(s)"
                DEPLOY_OK=true
                break
              fi
              echo "Attempt $i/$RETRIES: got $STATUS, retrying in ${SLEEP}s..."
              sleep $SLEEP
            done

            if [ "$DEPLOY_OK" = "false" ]; then
              echo "CRITICAL: Health check failed after $((RETRIES * SLEEP))s"
              echo ""
              echo "=== Backend logs (last 80 lines) ==="
              podman logs creditcardanalyzer_backend_1 --tail 80 2>&1 || echo "Could not get backend logs"
              echo ""
              echo "=== Backend healthcheck status ==="
              podman inspect --format='{{.State.Health.Status}} last={{range .State.Health.Log}}{{.Output}}{{end}}' creditcardanalyzer_backend_1 2>/dev/null || echo "No healthcheck info"
              echo ""
              echo "=== Nginx test (direct to frontend:80) ==="
              curl -s -o /dev/null -w "frontend:80 => %{http_code}" http://localhost: 2>/dev/null || echo "frontend unreachable"
              echo ""
              echo "=== All container status ==="
              podman ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              echo ""

              echo "Rolling back to previous image tag..."

              # Find previous tag from git log or use latest
              PREV_TAG=$(podman images --format "{{.Tag}}" | grep -v latest | grep -v $IMAGE_TAG | head -1)
              if [ -z "$PREV_TAG" ]; then
                echo "ERROR: No previous image tag found for rollback"
                exit 1
              fi

              echo "Rolling back to tag: $PREV_TAG"
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREV_TAG}/" .env
              podman-compose down --remove-orphans 2>/dev/null || true
              podman-compose up -d --remove-orphans
              exit 1
            fi

            # Show final status
            echo ""
            echo "=== Final Status ==="
            podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: restart-and-verify
    if: success()

    steps:
      - name: Cleanup old images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LINODE_SERVER_IP }}
          username: ${{ secrets.LINODE_SSH_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 43422
          script: |
            echo "Cleaning up old images..."
            podman system prune -af 2>/dev/null || true
            echo "Cleanup complete"
