name: Run Migrations

# Herramienta manual. El camino normal es el release: `deploy.yml` corre
# `alembic upgrade head` en el job `migrate`, después del backup y antes de
# recrear la app.
#
# Este workflow sirve para reaplicar/inspeccionar migraciones con la imagen que
# ya está deployada. Para migrar código nuevo sin deployar la app, usar
# Deploy → Run workflow → action: migrate-only.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Alembic target revision"
        required: true
        default: "head"
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Apply migrations with the deployed image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || '43422' }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/creditcardanalyzer
            export PATH="$HOME/.local/bin:$PATH"
            set -a
            source .env
            set +a

            IMAGE="${BACKEND_IMAGE}:${IMAGE_TAG}"
            DB_URL="postgresql://expenses_user:${POSTGRES_PASSWORD}@db:5432/expenses"

            echo "Applying alembic upgrade ${{ inputs.target }} with ${IMAGE}"
            podman run --rm --network "${NETWORK_NAME:-oikonomia}" \
              -e DATABASE_URL="$DB_URL" \
              --entrypoint alembic "$IMAGE" upgrade "${{ inputs.target }}"

            echo "Current revision:"
            podman run --rm --network "${NETWORK_NAME:-oikonomia}" \
              -e DATABASE_URL="$DB_URL" \
              --entrypoint alembic "$IMAGE" current
