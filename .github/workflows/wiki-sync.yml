name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v5

      - name: Checkout wiki repo
        uses: actions/checkout@v5
        with:
          repository: cheloim/perExp.wiki
          path: wiki
          token: ${{ secrets.WIKI_PAT }}

      - name: Sync all docs to wiki
        run: |
          # Sync all docs/ files
          for f in docs/*.md; do
            basename=$(basename "$f")
            cp "$f" "wiki/$basename"
          done

          # Sync feature specs as wiki pages
          mkdir -p wiki/specs
          for f in docs/specs/features/*.spec.yaml; do
            basename=$(basename "$f" .spec.yaml)
            # Convert YAML spec to Markdown for wiki
            echo "# ${basename} Specification" > "wiki/specs/${basename}.md"
            echo "" >> "wiki/specs/${basename}.md"
            echo '```yaml' >> "wiki/specs/${basename}.md"
            cat "$f" >> "wiki/specs/${basename}.md"
            echo '```' >> "wiki/specs/${basename}.md"
          done

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "docs: sync docs from main (${{ github.sha }})"
            git push
            echo "Wiki synced successfully"
          fi
