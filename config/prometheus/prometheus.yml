global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "oikonomia-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "backend:8000"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"

  - job_name: "redis"
    static_configs:
      - targets:
          - "redis-exporter:9121"

  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "nginx"
    static_configs:
      - targets:
          - "nginx-exporter:9113"

  - job_name: "alloy"
    static_configs:
      - targets:
          - "alloy:12345"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://oikonomia.ar
          - https://platform.oikonomia.ar
          - https://grafana.oikonomia.ar
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-ssl"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://oikonomia.ar
          - https://platform.oikonomia.ar
          - https://grafana.oikonomia.ar
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
