# Source of truth: docker/nginx/nginx.conf
# This file is kept for reference. Production uses docker/nginx/nginx.conf.
# See docker/compose-nginx.yml for the container definition.

# Internal: stub_status for nginx-exporter
server {
    listen 8080;
    server_name localhost;
    location /stub_status {
        stub_status;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }
}

# HTTP -> HTTPS redirect (all domains)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://${DOMAIN_NAME}$request_uri;
}

# www -> apex redirect
server {
    listen 443 ssl;
    http2 on;
    server_name www.${DOMAIN_NAME};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://${DOMAIN_NAME}$request_uri;
}

# Landing site: oikonomia.ar
# Served by its own container — never affected by platform deploys
server {
    listen 443 ssl default_server;
    http2 on;
    server_name ${DOMAIN_NAME};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        # TODO: change to http://landing:80 when src/landing/ exists
        proxy_pass http://platform-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# App: platform.oikonomia.ar
# Served by platform-frontend container (or BFF in the future)
# Falls back to maintenance page when upstream is down
server {
    listen 443 ssl;
    http2 on;
    server_name ${PLATFORM_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${PLATFORM_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PLATFORM_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: https:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https:; frame-src https://accounts.google.com https://oauth.telegram.org; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Maintenance page — served automatically when platform is down (502/503/504)
    error_page 502 503 504 /platform-maintenance.html;

    location = /platform-maintenance.html {
        root /usr/share/nginx/maintenance;
        internal;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /";
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        return 404;
    }

    location /oauth/ {
        proxy_pass http://platform-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://platform-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_intercept_errors on;
    }

    location = /api/metrics {
        deny all;
        return 404;
    }
}
