<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 512px;
  height: 512px;
  overflow: hidden;
  background: linear-gradient(160deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
.container {
  width: 512px;
  height: 512px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Subtle grid */
.grid {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
  background-size: 28px 28px;
  z-index: 0;
}

/* Ambient glow */
.glow {
  position: absolute;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 0;
}

.character {
  position: relative;
  z-index: 2;
  transform: scale(1.55);
  margin-top: 8px;
}

/* Head */
.head {
  width: 130px;
  height: 135px;
  background: #FFD8B4;
  border-radius: 50% 50% 48% 48%;
  position: relative;
  margin: 0 auto;
  box-shadow: inset -6px -6px 16px rgba(0,0,0,0.06), 0 6px 24px rgba(0,0,0,0.2);
}

/* Hair — clean side-part, professional */
.hair {
  position: absolute;
  top: -4px;
  left: 8px;
  width: 120px;
  height: 65px;
  background: #3D2A1E;
  border-radius: 60px 58px 8px 16px;
  z-index: 3;
}
/* Side sweep */
.hair::before {
  content: '';
  position: absolute;
  top: 10px;
  right: -2px;
  width: 22px;
  height: 40px;
  background: #3D2A1E;
  border-radius: 0 14px 12px 0;
}
/* Part line */
.hair::after {
  content: '';
  position: absolute;
  top: 8px;
  left: 22px;
  width: 40px;
  height: 3px;
  background: rgba(0,0,0,0.12);
  border-radius: 2px;
  transform: rotate(-8deg);
}

/* Eyebrows — thicker, confident */
.eyebrows {
  position: absolute;
  top: 42px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 30px;
  z-index: 5;
}
.eyebrow {
  width: 28px;
  height: 6px;
  background: #3D2A1E;
  border-radius: 3px;
}
.eyebrow:first-child { transform: rotate(-2deg); }
.eyebrow:last-child { transform: rotate(2deg); }

/* Eyes — slightly narrower, confident look */
.eyes {
  position: absolute;
  top: 54px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 24px;
  z-index: 4;
}
.eye {
  width: 18px;
  height: 20px;
  background: #2D2D2D;
  border-radius: 50%;
  position: relative;
}
.eye::after {
  content: '';
  position: absolute;
  top: 4px;
  right: 4px;
  width: 7px;
  height: 7px;
  background: white;
  border-radius: 50%;
}

/* Subtle confident smile */
.smile {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 14px;
  border-bottom: 3px solid #D4695A;
  border-radius: 0 0 20px 20px;
  z-index: 4;
}

/* Cheeks — very subtle */
.cheeks {
  position: absolute;
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 62px;
  z-index: 4;
}
.cheek {
  width: 16px;
  height: 9px;
  background: #FFB5A0;
  border-radius: 50%;
  opacity: 0.35;
}

/* Body — clean hoodie/shirt */
.body {
  width: 112px;
  height: 80px;
  background: linear-gradient(180deg, #2D2B55 0%, #1F1E3A 100%);
  border-radius: 28px 28px 20px 20px;
  position: relative;
  margin: -10px auto 0;
  z-index: 2;
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}

/* Collar — clean V-neck or crew */
.collar {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 14px;
  background: #3A3868;
  border-radius: 0 0 10px 10px;
}

/* Arms */
.arm-left, .arm-right {
  position: absolute;
  width: 32px;
  height: 62px;
  background: #252445;
  border-radius: 16px;
  top: 6px;
  z-index: 1;
}
.arm-left { left: -18px; transform: rotate(10deg); }
.arm-right { right: -18px; transform: rotate(-10deg); }

/* Hands */
.hand-left, .hand-right {
  position: absolute;
  width: 24px;
  height: 24px;
  background: #FFD8B4;
  border-radius: 50%;
  bottom: -3px;
}
.hand-left { left: 4px; }
.hand-right { right: 4px; }

/* Accent elements — minimal, elegant */
.accent-line {
  position: absolute;
  z-index: 1;
}
.al1 {
  top: 50px;
  right: 50px;
  width: 40px;
  height: 3px;
  background: linear-gradient(90deg, rgba(108,99,255,0.4), transparent);
  border-radius: 2px;
}
.al2 {
  bottom: 80px;
  left: 45px;
  width: 30px;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(255,217,61,0.3));
  border-radius: 2px;
}

/* Floating coin — subtle, small */
.coin {
  position: absolute;
  top: 55px;
  left: 60px;
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #FFD93D, #E8B800);
  border-radius: 50%;
  border: 2px solid #D4A800;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  color: #8B6914;
  z-index: 3;
  box-shadow: 0 2px 10px rgba(255,217,61,0.25);
  animation: bobble 3.5s ease-in-out infinite;
}
@keyframes bobble {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* Subtle chart line */
.chart-line {
  position: absolute;
  bottom: 65px;
  right: 40px;
  z-index: 3;
}
.chart-line svg {
  width: 60px;
  height: 30px;
}
</style>
</head>
<body>
<div class="container">
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="accent-line al1"></div>
  <div class="accent-line al2"></div>

  <div class="coin">$</div>

  <!-- Mini chart accent -->
  <div class="chart-line">
    <svg viewBox="0 0 60 30" fill="none">
      <polyline points="0,25 10,20 20,22 30,12 40,15 50,5 60,8" stroke="rgba(108,99,255,0.35)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="0,25 10,20 20,22 30,12 40,15 50,5 60,8 60,30 0,30" fill="rgba(108,99,255,0.06)"/>
    </svg>
  </div>

  <div class="character">
    <div class="head">
      <div class="hair"></div>
      <div class="eyebrows">
        <div class="eyebrow"></div>
        <div class="eyebrow"></div>
      </div>
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="cheeks">
        <div class="cheek"></div>
        <div class="cheek"></div>
      </div>
      <div class="smile"></div>
    </div>
    <div class="body">
      <div class="collar"></div>
      <div class="arm-left"><div class="hand-left"></div></div>
      <div class="arm-right"><div class="hand-right"></div></div>
    </div>
  </div>
</div>
</body>
</html>
