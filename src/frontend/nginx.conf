server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: https:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https:; frame-src https://accounts.google.com https://oauth.telegram.org; frame-ancestors 'self' https://*.telegram.org https://telegram.org https://*.t.me";

    # OAuth callback — must serve SPA for redirect flow
    location /oauth/ {
        error_page 405 =200 /index.html;
        try_files $uri /index.html;
    }

    # React SPA — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls. `/v1` is the canonical versioned prefix and `/api` stays as a
    # transitional alias until every client migrates (#527). A single location
    # serves both so they cannot drift: the rewrite strips the prefix and
    # FastAPI keeps its routers mounted at `/`.
    location ~ ^/(?:api|v1)/ {
        rewrite ^/(?:api|v1)(/.*)$ $1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Block public access to Prometheus metrics through either prefix. Exact
    # locations win over the regex above, regardless of declaration order.
    location = /api/metrics {
        deny all;
        return 404;
    }

    location = /v1/metrics {
        deny all;
        return 404;
    }
}
