<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2328;
        --muted: #656d76;
        --line: #d8dee4;
        --accent: #3584e4;
        --surface: #ffffff;
        --page: #eef2f7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--page);
      }

      body {
        color: var(--ink);
        font-family:
          "Inter", "Noto Sans", "DejaVu Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 15px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        padding: 36px;
      }

      .card {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 44px 48px 38px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 44px rgba(31, 35, 40, 0.08);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }

      h1 {
        margin: 14px 0 6px;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
      }

      .rule {
        height: 1px;
        margin: 26px 0 30px;
        background: var(--line);
      }

      .content > :first-child {
        margin-top: 0;
      }

      .content > :last-child {
        margin-bottom: 0;
      }

      h2 {
        margin: 34px 0 10px;
        font-size: 21px;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      h3 {
        margin: 26px 0 8px;
        font-size: 17px;
      }

      p {
        margin: 10px 0;
      }

      ul,
      ol {
        margin: 10px 0;
        padding-left: 24px;
      }

      li {
        margin: 5px 0;
      }

      strong {
        font-weight: 700;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      code {
        padding: 2px 5px;
        border-radius: 5px;
        background: #f3f5f8;
        font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace;
        font-size: 0.88em;
      }

      pre {
        margin: 16px 0;
        padding: 16px;
        overflow-x: auto;
        border-radius: 10px;
        background: #f3f5f8;
        border: 1px solid var(--line);
      }

      pre code {
        padding: 0;
        background: transparent;
      }

      blockquote {
        margin: 16px 0;
        padding: 4px 0 4px 16px;
        border-left: 4px solid var(--accent);
        color: var(--muted);
      }

      table {
        width: 100%;
        margin: 18px 0;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 9px 11px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #f3f5f8;
        font-weight: 700;
      }

      tr:nth-child(even) td {
        background: #fafbfc;
      }

      .footer {
        margin-top: 36px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <article class="card">
        <div class="eyebrow"><span class="dot"></span> Oikonomia · Asistente IA</div>
        <h1>{{ title }}</h1>
        <div class="meta">{{ date }}</div>
        <div class="rule"></div>
        <section class="content">{{ body | safe }}</section>
        <div class="footer">Generado desde tu análisis financiero en Oikonomia.</div>
      </article>
    </main>
  </body>
</html>
