feature: analysis
domain: AI Spending Analysis
type: full
version: "1.3.0"
status: implemented
owner: full-stack
created: 2026-08-16
updated: 2026-10-24
github_issue: null

description: >
  Enables users to ask natural language questions about their spending
  patterns. Queries are sent to the configured LLM (Gemini Flash today) which
  generates insights based on the user's expense data. All queries and
  responses are stored in AnalysisHistory for future reference.

requirements:
  - "User must be authenticated"
  - "User must have expenses in the system"
  - "LLM_API_KEY must be configured"
  - "Analysis history is stored per-user"

pre_evaluation:
  questions:
    - question: "Which LLM provider is used?"
      answer: >
        Gemini Flash via Google AI API. The key is read as LLM_API_KEY — the
        env name is provider-agnostic so the model can be swapped without
        touching configuration.
    - question: "Is conversation context maintained between queries?"
      answer: >
        Yes, since 2026-10-19. The browser keeps one thread and sends it with
        every request as `messages`, so the model sees what has already been
        said. The server holds no conversation state between requests.
    - question: "Is the spending assistant still a standalone component?"
      answer: "No. Since 2026-10-19 both assistants share one AssistantShell plus an AssistantConfig; see docs/Asistente-IA-Unificacion.md"
    - question: "What data is sent to the LLM?"
      answer: "A summary of user expenses (amounts, categories, dates) — no PII beyond first name"
    - question: "Which endpoint answers a given question?"
      answer: >
        A vocabulary router on the client picks spending or investments from the
        words the user typed, so each message reaches the domain that can answer
        it and the LLM key that domain bills to. Ambiguous or off-topic messages
        stay in the thread's own domain, and ordinary Spanish that shares a word
        with a domain ("la bolsa de trabajo", "me robaron la cartera") is cut
        out before the words are counted.

users:
  - role: "authenticated_user"
    description: "Any logged-in user can run spending analyses"
    permissions:
      - "create_analysis"
      - "view_own_analysis_history"

entities:
  - name: "AnalysisHistory"
    table: "analysis_history"
    description: "Stores each analysis query and its LLM-generated response"
    fields:
      - name: "id"
        type: "integer"
        primary_key: true
        auto_increment: true
      - name: "query"
        type: "text"
        required: true
        description: "The user's natural language question"
      - name: "response"
        type: "text"
        required: true
        description: "The LLM-generated analysis"
      - name: "user_id"
        type: "integer"
        foreign_key: "users.id"
        required: true
      - name: "created_at"
        type: "datetime"
        default: "now()"
    indexes:
      - columns: ["user_id"]

endpoints:
  - method: "POST"
    path: "/analysis/stream"
    description: "Stream a spending analysis, optionally answering a specific question"
    auth: "required"
    request_body:
      question:
        type: "string"
        required: false
        description: "Natural language question about spending"
      month:
        type: "string"
        required: false
        description: >
          Period to analyse, 'YYYY-MM'. Takes priority: when it is present,
          `months` is ignored.
      months:
        type: "integer"
        required: false
        default: 12
        description: >
          Data window length when no exact month is named: the current month
          plus `months - 1` previous ones, from the first day of the oldest
          month up to today (no upper bound on the date). The assistant offers
          3, 6 and 12 from the period selector and sends the one in force; a
          request that names none gets 12, and no request analyses the whole
          history.
        constraints: "integer, 1 ≤ months ≤ 24; anything else is a 422"
      debug_mode:
        type: "boolean"
        required: false
        default: false
      messages:
        type: "array of { role: 'user' | 'assistant', text: string }"
        required: false
        description: >
          The whole conversation so far, so the model has context. Optional: a
          client that sends only a question still works.
    response:
      status: 200
      body: >
        text/event-stream — data: {"text": ...} frames, terminated by
        data: [DONE]. A failure is a frame of its own: {"error": true, "text":
        ...} — the client shows it and never stores it as a reply.
    errors:
      - status: 401
        description: "Unauthorized"
      - status: 500
        description: "LLM_API_KEY not configured"

  - method: "GET"
    path: "/analysis/history"
    description: "Retrieve past analysis queries and responses"
    auth: "required"
    query_params:
      - name: "limit"
        type: "integer"
        required: false
        default: 20
    response:
      status: 200
      body:
        history: "array of AnalysisHistory objects"

business_rules:
  - name: "Threaded Context"
    description: >
      The client sends its whole thread with each request; the server holds no
      conversation state between requests. The 20 most recent turns (40
      messages, since a turn is a question and its reply) are forwarded to the
      LLM as prior turns (assistant replies become model turns), the newest
      turns go first when they do not fit in 16.000 characters, and the new
      question is always the final user turn.
  - name: "History Storage"
    description: "Every query and response is persisted in analysis_history for the user"
  - name: "Analysis Window"
    description: >
      The assistant analyses a window, not a single month. `months` selects the
      current month plus `months - 1` previous ones, and the client picks the
      length from a 3/6/12-month selector (12 unless the user changes it). An
      exact `month` wins over the window when both arrive. The window is always
      bounded — 12 months unless a length is named — so no question silently
      asks for the whole history. `AnalysisHistory.month` stores the exact
      month only: a window leaves it null, because a window is not a month.
  - name: "Month-over-Month Comparison"
    description: >
      The prompt carries the deltas already computed: each month against the
      one before it, and every category of the newest month against the
      previous one. The model reports the comparison instead of subtracting
      totals, which it gets wrong often enough to matter.
  - name: "Month × Category Detail"
    description: >
      Every category of every month in the window, with its share of that
      month already computed. The window block aggregates across months and
      the comparison only names the newest two, so without this matrix a
      question about any single month ("detallame lo de este mes") has no
      detail to answer from — the model can only subtract the rows it has
      and say the rest is missing, which is exactly what it did. Months
      without spending appear as such, so the model can say so instead of
      inventing them. Categories are labelled "Parent > Child" — never with
      a parent owned by another user, since `parent_id` is not validated at
      write time — so a subcategory is never a row unrelated to its parent.
  - name: "Question Retrieval"
    description: >
      The window arrives aggregated, so the words of the question retrieve the
      spends it is about — the merchant or category named in it — matching on
      description and category name, accent- and case-insensitive, ranked by
      match and amount, capped at 20. Deliberately keyword-based rather than
      embeddings: the stack has no vector store, and the question words the
      user types are the merchant words the descriptions contain. Same
      scoping as everything else: only the authenticated user's expenses.
  - name: "Prompt Budget"
    description: >
      Aggregates (window totals and the month × category matrix), top 10,
      comparison blocks and the capped retrieval block — never a transaction
      dump. What scales is months × categories, never the transaction count:
      a year of spending across 20 categories (500 expenses) stays under
      16.000 characters, asserted by a test. The matrix is deliberately full
      (no top-N cut — a cut is what made month questions unanswerable), so
      the window length and the category count together bound the prompt.
  - name: "Data Scoping"
    description: "Only the authenticated user's expenses are included in the LLM prompt"
  - name: "PII Minimization"
    description: "Only first_name and expense data are sent to the LLM; no emails or IDs"

frontend:
  components:
    - name: "Assistant"
      path: "frontend/src/components/assistant/"
      description: >
        The single assistant implementation (spending and investments share it).
        `AssistantShell` owns the thread; `configs.ts` owns the per-domain
        copy, endpoint and body shape.
    - name: "SessionCard"
      path: "frontend/src/components/assistant/SessionCard.tsx"
      description: "Past conversations in the Conversaciones tab, with their summary"

integrations:
  - name: "Gemini Flash"
    type: "llm"
    description: "LLM provider for natural language spending analysis"
    config:
      api_key_env: "LLM_API_KEY"
      model_env: "LLM_MODEL_NAME"
      model: "gemini-flash"

migrations: []

tests:
  - name: "Analysis returns response for valid query"
    type: "integration"
    description: "Submitting a query returns an LLM-generated response"
    steps:
      - "Authenticate as user with expenses"
      - "POST /analysis/stream with question 'How much did I spend on food last month?'"
      - "Assert 200 response with non-empty response string"
    expected: "Response contains spending analysis"

  - name: "Analysis history stores queries"
    type: "integration"
    description: "Each analysis is saved to history"
    steps:
      - "Run 3 analysis queries"
      - "GET /analysis/history"
      - "Assert 3 entries returned in descending order"
    expected: "History matches number of queries"

  - name: "Analysis scoped to user"
    type: "integration"
    description: "User only sees their own analysis history"
    steps:
      - "User A runs 2 analyses, User B runs 1 analysis"
      - "Authenticate as User B"
      - "GET /analysis/history"
      - "Assert only 1 entry returned"
    expected: "History is user-scoped"

  - name: "Analysis with no expenses returns insight"
    type: "integration"
    description: "LLM handles empty expense data gracefully"
    steps:
      - "Authenticate as user with zero expenses"
      - "POST /analysis/stream with question 'Show my spending summary'"
      - "Assert 200 response with appropriate message"
    expected: "Response indicates no expenses found"

  - name: "The window covers three months"
    type: "integration"
    description: "months=3 brings the current month and the two before it, and nothing older"
    steps:
      - "Add expenses in the current month, the two previous ones and one four months back"
      - "POST /analysis/stream with months=3"
      - "Assert the three months are analysed, the older expense is left out, and the period is the window"
    expected: "Only the three months of the window reach the model"

  - name: "An exact month wins over the window"
    type: "integration"
    description: "month and months together analyse the named month only"
    steps:
      - "POST /analysis/stream with month 'YYYY-MM' and months 3"
      - "Assert only that month's expenses are analysed"
    expected: "month has priority over months"

  - name: "A window length outside 1..24 is rejected"
    type: "integration"
    description: "months is bounded, so a runaway window cannot ask for everything"
    steps:
      - "POST /analysis/stream with months 0"
      - "POST /analysis/stream with months 25"
      - "Assert both are 422"
    expected: "422 for any months outside 1..24"

  - name: "Prior turns are understood"
    type: "integration"
    description: "A follow-up that depends on an earlier turn resolves it"
    steps:
      - "POST /analysis/stream with messages [{user: '¿Cuánto gasté?'}, {assistant: '$10.000'}] and question '¿Y el mes pasado?'"
      - "Assert the reply refers to the earlier period rather than to the literal words"
    expected: "The pronoun resolves from the thread"

  - name: "Out-of-scope questions are declined without a fixed sentence"
    type: "integration"
    description: "The focus is kept, the wording is not canned"
    steps:
      - "POST /analysis/stream with question 'Pasame una receta de ñoquis'"
      - "Assert the reply declines and returns to spending"
      - "Assert it is not the literal 'Solo puedo ayudarte con el análisis de tus gastos y finanzas personales.'"
    expected: "A decline in the model's own words, not a muletilla"

  - name: "Twelve months is the default window"
    type: "integration"
    description: "A request that names no period analyses twelve months, not the whole history"
    steps:
      - "Add expenses eleven and twelve months back"
      - "POST /analysis/stream with only a question"
      - "Assert the eleven-month expense is analysed and the twelve-month one is not"
    expected: "The window is the current month plus the eleven before it"

  - name: "Month-over-month deltas reach the model"
    type: "integration"
    description: "Each month is compared against the one before it, and every category of the newest month too"
    steps:
      - "Add expenses in two consecutive months"
      - "POST /analysis/stream with months=2"
      - "Assert the prompt carries the comparison blocks with the computed deltas"
    expected: "The model reports the comparison instead of computing it"

  - name: "Every month details every category"
    type: "integration"
    description: "The month × category matrix has no top-N cut — the tail is data too"
    steps:
      - "Add expenses in six categories across two months"
      - "POST /analysis/stream with months=2"
      - "Assert every category of every month reaches the prompt with its share of the month"
    expected: "A single-month question is answerable from the prompt alone"

  - name: "A subcategory names its parent"
    type: "integration"
    description: "Subcategory rows carry the parent in the label, as the monthly report writes them"
    steps:
      - "Add a parent category, a subcategory, and an expense on each"
      - "POST /analysis/stream"
      - "Assert the subcategory row reads 'Parent > Child' and the parent row keeps its own name"
    expected: "Parent and subcategory never read as unrelated rows"

  - name: "A question retrieves the spends it is about"
    type: "integration"
    description: "The words of the question match spends by description or category, capped at 20"
    steps:
      - "Add an expense at YENNY TORTUGAS and an unrelated one"
      - "POST /analysis/stream with '¿Cuánto gasté en YENNY TORTUGAS?'"
      - "Assert the matching spend is retrieved into the prompt"
    expected: "The merchant question is answerable from the window"

  - name: "Retrieval stays inside the user"
    type: "integration"
    description: "Another user's spend with the same description never reaches the prompt"
    steps:
      - "User B adds a spend at the same merchant"
      - "User A asks about that merchant"
      - "Assert only User A's spend is in the prompt"
    expected: "No cross-user data in the prompt"

  - name: "The prompt stays bounded at twelve months"
    type: "unit"
    description: >
      Aggregates (window and month × category), top 10, the comparison blocks
      and the capped retrieval block — never a transaction dump
    steps:
      - "Add 500 expenses across the window and 20 categories"
      - "POST /analysis/stream with months=12 and a merchant question"
      - "Assert the prompt is under 16.000 characters"
    expected: "Months × categories bound the prompt; the transaction count does not"

  - name: "A month without spending is named"
    type: "integration"
    description: "An empty month of the window appears in the detail as such, never omitted"
    steps:
      - "Add expenses two months back and this month, nothing in between"
      - "POST /analysis/stream with months=3"
      - "Assert the middle month is in the detail marked as without spending"
    expected: "The model can say a month has no spending instead of inventing it"

  - name: "A parent of another user never names a row"
    type: "integration"
    description: "`parent_id` is not validated at write time; a foreign category name must not reach the prompt"
    steps:
      - "User A creates a category parented to a category of User B"
      - "User A asks for an analysis"
      - "Assert User B's category name is absent from the prompt"
    expected: "Labels never cross users"

documentation:
  - type: "api"
    description: "Analysis endpoints documented in OpenAPI spec"
  - type: "integration"
    description: "Gemini Flash setup instructions in project docs"
  - type: "cost"
    description: "Window, retrieval and prompt budget in docs/Asistente-IA-Unificacion.md"

changelog:
  - version: "1.3.1"
    date: "2026-10-25"
    changes:
      - "Month × category detail: every category of every month reaches the prompt — the top-5 cut made 'detallame lo de este mes' unanswerable and the model said the detail was missing"
      - "Category comparison covers every category of the newest month, not the top 5"
      - "Subcategories are labelled 'Parent > Child' in the prompt, as the monthly report writes them — never with a parent owned by another user"
      - "Months without spending appear in the detail as such, so the model says so instead of inventing them"
      - "The analysis prompt tells the model to answer from the data blocks and to never estimate what they do not have"
  - version: "1.3.0"
    date: "2026-10-24"
    changes:
      - "Twelve-month default window (issue #417): always bounded, 1..24 when a length is named"
      - "Period selector in the assistant (3/6/12 months), so the UI states the period consulted"
      - "Month-over-month deltas computed for the model: per month and top 5 categories"
      - "Question retrieval: the words of the question pull the matching spends (keyword-based, capped at 20) into the prompt"
      - "Prompt budget asserted: a year of spending stays under 16.000 characters"
  - version: "1.2.0"
    date: "2026-10-20"
    changes:
      - "The assistant analyses a three-month window — the current month plus the two before it — instead of only the current month"
      - "New `months` field (1..24, default null) picks the window length; `month` keeps its meaning and wins when both are sent"
  - version: "1.1.0"
    date: "2026-10-19"
    changes:
      - "Queries are no longer stateless: the client sends its thread as `messages` and the LLM sees prior turns"
      - "A vocabulary router picks the endpoint per message (spending vs investments)"
      - "Out-of-scope questions are declined in the model's own words instead of a fixed sentence"
      - "Endpoint documented as POST /analysis/stream, which is what the app actually calls"
  - version: "1.0.0"
    date: "2026-08-16"
    changes:
      - "Initial implementation of AI analysis feature"
      - "POST /analysis and GET /analysis/history endpoints"
      - "Gemini Flash integration"
