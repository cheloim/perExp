            type: integer
          description: Filter by cuenta-group tag ID
        - name: sin_cuenta
          in: query
          schema:
            type: boolean
          description: Show only expenses without a cuenta-group tag
        - name: search
          in: query
          schema:
            type: string
          description: 'Free-text search over description, notes and category name (decrypted at application level)'
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        '200':
          description: Expense list
          content:
