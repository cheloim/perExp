          format: date
        active:
          type: boolean
        category_id:
          type: integer
          nullable: true
        card_id:
          type: integer
          nullable: true
        account_id:
          type: integer
          nullable: true

    ScheduledExpenseResponse:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        amount:
          type: number
        frequency:
          type: string
        next_date:
          type: string
          format: date
        category_id:
          type: integer
          nullable: true
        card_id:
          type: integer
