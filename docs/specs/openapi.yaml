      tags: [categories]
      summary: Get LLM-based category suggestion
      operationId: suggestCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, amount]
              properties:
                description:
                  type: string
                amount:
                  type: number
      responses:
        '200':
          description: Suggestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuggestResponse'

  /categories/{cat_id}:
    parameters:
      - name: cat_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [categories]
      summary: Update a category
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
      parameters:
        - name: cat_id
          in: path
          required: true
          schema:
            type: integer
            title: Cat Id
    delete:
      tags: [categories]
      summary: Delete a category
      operationId: deleteCategory
      responses:
        '200':
          description: Category deleted

  # ─────────────────────────────────────────────────────────────
  # CARD CLOSINGS
  # ─────────────────────────────────────────────────────────────
      parameters:
        - name: cat_id
          in: path
          required: true
          schema:
            type: integer
            title: Cat Id
  /card-closings:
    get:
      tags: [card-closings]
      summary: List card closing configurations
      operationId: listCardClosings
      responses:
        '200':
          description: Card closing list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardClosingResponse'
    post:
      tags: [card-closings]
      summary: Create card closing configuration
      operationId: createCardClosing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardClosingCreate'
      responses:
        '201':
          description: Card closing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardClosingResponse'
        '409':
          description: Closing already exists for this card

      parameters:
        - name: card
          in: query
          required: true
          schema:
            type: string
            title: Card
        - name: bank
          in: query
          required: true
          schema:
            type: string
            title: Bank
        - name: closing_date
          in: query
          required: true
          schema:
            type: string
            title: Closing Date
        - name: next_closing_date
          in: query
          required: false
          schema:
            title: Next Closing Date
            type: string
            nullable: true
        - name: due_date
          in: query
          required: false
          schema:
