      summary: Update a card
      operationId: updateCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpdate'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: integer
            title: Card Id
    delete:
      tags: [cards]
      summary: Delete a card
      operationId: deleteCard
      responses:
        '204':
          description: Card deleted
        '400':
          description: Card has associated expenses

  # ─────────────────────────────────────────────────────────────
  # CATEGORIES
  # ─────────────────────────────────────────────────────────────
      parameters:
        - name: card_id
          in: path
          required: true
