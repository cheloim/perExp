            type: integer
            default: 50
            title: Per Page
      responses:
        '200':
          description: List miscategorization reviews
  /admin/categorization-reviews/bulk-accept:
    post:
      tags:
        - admin
      summary: Accept every pending review above a score threshold
      description: Bulk resolution for the admin UI. Only pending reviews with a suggested category are considered; reviews already resolved are never touched. Bulk acceptances are flagged so they do not feed the manual precision.
      operationId: bulk_accept_admin_categorization_reviews_bulk_accept_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAcceptBody'
        required: true
      responses:
        '200':
          description: Accept every pending review above a score threshold
  /admin/categorization-reviews/{review_id}:
    get:
      tags:
        - admin
      summary: Get one review with its evidence
      description: Return the review plus the signals and LLM verdict behind the score.
      operationId: get_review_detail_admin_categorization_reviews__review_id__get
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: integer
            title: Review Id
      responses:
        '200':
          description: Get one review with its evidence
  /admin/categorization-reviews/{review_id}/accept:
    post:
      tags:
        - admin
      summary: Accept a review and apply the category
      description: Apply the suggested category (or an explicit one) to the expense, teach the merchant preference and mark the review as accepted.
      operationId: accept_admin_categorization_reviews__review_id__accept_post
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: integer
            title: Review Id
      requestBody:
        content:
          application/json:
            schema:
              title: Body
              $ref: '#/components/schemas/AcceptBody'
              nullable: true
      responses:
        '200':
          description: Accept a review and apply the category
  /admin/categorization-reviews/{review_id}/reject:
    post:
      tags:
        - admin
      summary: Reject a review
      description: Mark the review as a false positive; the expense keeps its category.
      operationId: reject_admin_categorization_reviews__review_id__reject_post
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: integer
            title: Review Id
      responses:
        '200':
          description: Reject a review
  /admin/categorization-reviews/{review_id}/investigate:
    post:
      tags:
        - admin
      summary: Mark a review as investigated
      description: Mark the review as looked at without changing the expense.
      operationId: investigate_admin_categorization_reviews__review_id__investigate_post
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: integer
            title: Review Id
      responses:
        '200':
          description: Mark a review as investigated
  /admin/categorization-reviews/scan:
    post:
      tags:
        - admin
      summary: Run the detector now
      description: Review the expenses created since the given date (forward-only; defaults to the last 7 days) and persist the findings. Same code path as the daily job.
      operationId: scan_admin_categorization_reviews_scan_post
      requestBody:
        content:
          application/json:
            schema:
              title: Body
              $ref: '#/components/schemas/ScanBody'
              nullable: true
      responses:
        '200':
          description: Run the detector now
  /webhook/whatsapp:
    get:
      tags:
        - whatsapp
      summary: Verify WhatsApp webhook
      description: Handle Meta's webhook verification challenge by validating the token and echoing the challenge.
      operationId: verify_webhook_webhook_whatsapp_get
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            title: Hub.Mode
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
            title: Hub.Verify Token
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
            title: Hub.Challenge
      responses:
        '200':
          description: Verify WhatsApp webhook
    post:
      tags:
        - whatsapp
      summary: Receive WhatsApp messages
      description: Accept incoming WhatsApp message payloads from Meta and process them asynchronously.
      operationId: receive_webhook_webhook_whatsapp_post
      responses:
        '200':
          description: Receive WhatsApp messages
  /webhook/whatsapp/delete-user:
    post:
      tags:
        - whatsapp
      summary: Meta data deletion callback
      description: Handles Meta's data deletion callback for WhatsApp users. Verifies the signed_request, deletes the user's account and all data, and returns a confirmation URL and code.
      operationId: delete_user_callback_webhook_whatsapp_delete_user_post
      responses:
        '200':
          description: Meta data deletion callback
  /capture/transcribe:
    post:
      tags: [capture]
      summary: Transcribe a short audio recording
      operationId: transcribeAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                duration_seconds:
                  type: number
                  nullable: true
      responses:
        '200':
          description: Audio transcript and clarity status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '400':
          description: Unsupported format or audio longer than 120 seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '413':
          description: Audio exceeds 10 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '429':
          description: Capture rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '502':
          description: Capture provider failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '503':
          description: Capture capability is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
  /capture/expense-image:
    post:
      tags: [capture]
      summary: Extract one expense from a payment proof image
      operationId: extractExpenseFromImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                hint:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Expense draft or a reason the image was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseImageResponse'
        '400':
          description: Unsupported image format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '413':
          description: Image exceeds 8 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '429':
          description: Capture rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '502':
          description: Capture provider failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
        '503':
          description: Capture capability is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CaptureError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    TranscriptionResponse:
      type: object
      required: [text, duration_seconds, unclear]
      properties:
        text:
          type: string
        duration_seconds:
          type: number
          nullable: true
        unclear:
          type: boolean
    ExpenseDraftResponse:
      type: object
      required: [amount, currency, description, date, confidence, source_type, card_hint]
      properties:
        amount:
          type: number
        currency:
          type: string
          enum: [ARS, USD]
        description:
          type: string
        date:
          type: string
          format: date
          nullable: true
        confidence:
          type: string
          enum: [high, medium, low]
        source_type:
          type: string
        card_hint:
          type: string
          nullable: true
    ExpenseImageResponse:
      type: object
      required: [status, draft, reason, message]
      properties:
        status:
          type: string
          enum: [ok, rejected]
        draft:
          allOf:
            - $ref: '#/components/schemas/ExpenseDraftResponse'
          nullable: true
        reason:
          type: string
          nullable: true
        message:
          type: string
