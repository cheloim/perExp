openapi: 3.0.3
info:
  title: Oikonomia API
  version: 1.0.0
  description: |
    **Oikonomia** (Credit Card Analyzer) — Personal finance management platform for Argentine users.

    ## Architecture
    - **Backend**: FastAPI (Python) with PostgreSQL, Redis, and Celery
    - **Frontend**: Vite + React SPA
    - **Integrations**: Telegram Bot, WhatsApp Bot, Gemini Flash (AI), Yahoo Finance, IOL/PPI brokers

    ## Key Features
    - Expense & income tracking with encrypted fields (AES-256)
    - Credit/debit card management with billing cycle tracking
    - Hierarchical category system with auto-categorization
    - Budget management with 50/30/20 rule support
    - Investment portfolio tracking with auto price refresh
    - AI-powered spending analysis (Gemini Flash)
    - Smart CSV/PDF bank statement import
    - Family group sharing
    - Real-time SSE notifications
    - Scheduled/recurring expense automation
    - Telegram & WhatsApp bot integrations
    - Admin panel with impersonation and audit logging

    ## Security
    - JWT authentication (access + refresh tokens)
    - TOTP-based MFA
    - Field-level AES-256 encryption
    - HMAC for searchable encrypted fields
    - Rate limiting on sensitive endpoints
  contact:
    name: Oikonomia Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8001
    description: Local development
  - url: https://platform.oikonomia.ar
    description: Production

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication, registration, OAuth, password management
  - name: mfa
    description: Multi-factor authentication (TOTP)
  - name: accounts
    description: Bank accounts and digital wallets CRUD
  - name: cards
    description: Credit and debit card management
  - name: categories
    description: Hierarchical expense categories
  - name: card-closings
    description: Card billing period configurations
  - name: expenses
    description: Expense and income tracking, analytics
  - name: investments
    description: Investment portfolio management
  - name: import-jobs
    description: CSV/PDF bank statement import pipeline
  - name: dashboard
    description: Aggregated spending summaries and KPIs
  - name: analysis
    description: AI-powered spending analysis (Gemini Flash)
  - name: capture
    description: AI voice transcription and payment-proof extraction
  - name: groups
    description: Family group management
  - name: notifications
    description: Real-time SSE notifications
  - name: scheduled-expenses
    description: Recurring scheduled expense automation
  - name: budgets
    description: Budget limits, groups, and events
  - name: suggestions
    description: AI category suggestions
  - name: recurring
    description: Auto-detected recurring expense patterns
  - name: admin
    description: Admin panel, user management, audit logs
  - name: whatsapp
    description: WhatsApp Business API webhook

paths:
  # ─────────────────────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      summary: Register new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Duplicate email or validation error

  /auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited

  /auth/login/mfa:
    post:
      tags: [auth, mfa]
      summary: Complete MFA login with TOTP code
      operationId: loginMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, code]
              properties:
                token:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: MFA verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request password reset email
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password with token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token

  /auth/password:
    put:
      tags: [auth]
      summary: Change password (authenticated)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password changed

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user profile
      operationId: getProfile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags: [auth]
      summary: Delete current user account
      operationId: deleteAccount
      responses:
        '204':
          description: Account deleted

  /auth/me/onboarding:
    put:
      tags: [auth]
      summary: Mark onboarding as completed
      operationId: completeOnboarding
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verify email with token
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Resend verification email
      operationId: resendVerification
      responses:
        '200':
          description: Verification email sent

  /auth/me/telegram-key:
    get:
      tags: [auth]
      summary: Get Telegram linking key
      operationId: getTelegramKey
      responses:
        '200':
          description: Telegram key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramKeyResponse'

  /auth/me/telegram-key/regenerate:
    post:
      tags: [auth]
      summary: Regenerate Telegram linking key
      operationId: regenerateTelegramKey
      responses:
        '200':
          description: New Telegram key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramKeyResponse'

  /auth/me/telegram-status:
    get:
      tags: [auth]
      summary: Check Telegram linking status
      operationId: getTelegramStatus
      responses:
        '200':
          description: Telegram status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStatusResponse'

  # ─────────────────────────────────────────────────────────────
  # MFA
  # ─────────────────────────────────────────────────────────────
  /mfa/setup:
    post:
      tags: [mfa]
      summary: Generate TOTP secret and QR code
      operationId: mfaSetup
      responses:
        '200':
          description: MFA setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qr_uri:
                    type: string

  /mfa/disable:
    post:
      tags: [mfa]
      summary: Disable MFA
      operationId: mfaDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: MFA disabled

  # ─────────────────────────────────────────────────────────────
  # ACCOUNTS
  # ─────────────────────────────────────────────────────────────
  /accounts:
    get:
      tags: [accounts]
      summary: List accounts for user and group members
      operationId: listAccounts
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
    post:
      tags: [accounts]
      summary: Create a new account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'

  /accounts/{account_id}:
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [accounts]
      summary: Update an account
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
            title: Account Id
    delete:
      tags: [accounts]
      summary: Delete an account
      operationId: deleteAccount1
      responses:
        '204':
          description: Account deleted

  # ─────────────────────────────────────────────────────────────
  # CARDS
  # ─────────────────────────────────────────────────────────────
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
