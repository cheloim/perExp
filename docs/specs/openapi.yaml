        - name: category_id
          in: query
          schema:
            type: integer
        - name: category_ids
          in: query
          schema:
            type: string
          description: Comma-separated IDs
        - name: uncategorized
          in: query
          schema:
            type: boolean
        - name: bank
          in: query
          schema:
            type: string
        - name: person
          in: query
          schema:
            type: string
        - name: card
          in: query
          schema:
            type: string
        - name: card_type
          in: query
          schema:
            type: string
        - name: installment
          in: query
          schema:
            type: boolean
        - name: account
          in: query
          schema:
            type: string
          description: Filter by account name (substring, decrypted at application level)
        - name: account_id
          in: query
          schema:
            type: integer
        - name: tag_id
          in: query
          schema:
            type: integer
        - name: untagged
          in: query
          schema:
            type: boolean
        - name: cuenta_id
          in: query
