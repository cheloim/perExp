        - name: tag_id
          in: query
          schema:
            type: integer
        - name: untagged
          in: query
          schema:
            type: boolean
        - name: cuenta_id
          in: query
          schema:
            type: integer
          description: Filter by cuenta-group tag ID
        - name: sin_cuenta
          in: query
          schema:
            type: boolean
          description: Show only expenses without a cuenta-group tag
        - name: search
          in: query
          schema:
            type: string
          description: 'Free-text search over description, notes and category name (decrypted at application level)'
      responses:
