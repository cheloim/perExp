    ChatMessage:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string

    AnalysisRequest:
      type: object
      properties:
        month:
          type: string
          nullable: true
          description: >
            Period to analyse, `YYYY-MM`. Wins over `months` when both arrive:
            it names a precise period and is the field older clients send.
        months:
          type: integer
          nullable: true
          default: 12
          minimum: 1
          maximum: 24
          description: >
            Window length: the current month plus this many previous ones.
            Ignored when `month` arrives. Bounded, so no request can ask for
            the whole history.
        question:
          type: string
          nullable: true
          description: The user's specific question. Omit for a general review.
        debug_mode:
          type: boolean
          default: false
          description: Skip the system prompt so the raw model answers.
        messages:
          type: array
          maxItems: 50
          description: The whole conversation so far, so the model has context.
          items:
            $ref: '#/components/schemas/ChatMessage'

