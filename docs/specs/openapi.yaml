      summary: Stream a spending analysis
      operationId: streamAnalysis
      description: >
        SSE endpoint that summarizes the user's expenses and asks the LLM for
        insights, optionally answering a specific question. The whole
        conversation can be sent along so the model has context; the server
        keeps no state between requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      responses:
        '200':
          description: >
            SSE stream of `data:` frames carrying a `text` field, terminated by
            `data: [DONE]`. A failure is a frame of its own, `{"error": true,
            "text": ...}`, and is not a reply.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized
        '422':
          description: Invalid request body (over 50 messages, malformed month)
        '500':
          description: LLM_API_KEY is not configured

