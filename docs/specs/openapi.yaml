  /expenses/bulk-delete:
    post:
      tags: [expenses]
      summary: Delete multiple expenses by ID list
      operationId: bulkDeleteExpenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /expenses/bulk-category:
    post:
      tags: [expenses]
      summary: Assign category to multiple expenses
      operationId: bulkCategoryExpenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, category_id]
              properties:
                ids:
                  type: array
                  items:
