services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.listen-address=:9090"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:latest
    ports:
      # Sólo loopback: el acceso público entra por nginx vía la red `oikonomia`.
      # Publicarlo en 0.0.0.0 dependía de que firewalld lo tape.
      - "127.0.0.1:3000:3000"
    networks:
      - default
      # Red compartida con la plataforma: nginx lo resuelve como `grafana:3000`
      # y el backend puede sincronizar usuarios contra él.
      - oikonomia
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Llave de emergencia: el login normal es por Google. El deploy aborta en
      # validate-config si falta, porque una Grafana pública con password por
      # default es peor que no tener tablero.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      # Habilitado a propósito: es el camino que no depende de nadie más, el que
      # se usa cuando Google o la plataforma están caídas.
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN_NAME:-oikonomia.ar}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/status.json
      # Google OAuth: la AUTENTICACIÓN no depende de la plataforma (antes pasaba
      # por el backend de Oikonomia, y la plataforma caída dejaba el tablero
      # inaccesible justamente cuando hacía falta). La AUTORIZACIÓN sí depende
      # del flag is_admin, materializada por app/services/grafana_sync.py: con
      # allow_sign_up=false sólo entra quien está pre-provisionado.
      GF_AUTH_GOOGLE_ENABLED: "true"
      GF_AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GF_AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GF_AUTH_GOOGLE_SCOPES: "openid profile email"
      GF_AUTH_GOOGLE_AUTH_URL: "https://accounts.google.com/o/oauth2/v2/auth"
      GF_AUTH_GOOGLE_TOKEN_URL: "https://oauth2.googleapis.com/token"
      GF_AUTH_GOOGLE_API_URL: "https://openidconnect.googleapis.com/v1/userinfo"
      GF_AUTH_GOOGLE_ALLOW_SIGN_UP: "false"
      GF_AUTH_OAUTH_AUTO_LOGIN: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:latest
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://expenses_user:${POSTGRES_PASSWORD}@host.containers.internal:5432/expenses?sslmode=disable"
    restart: unless-stopped

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:latest
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://host.containers.internal:6379"
    restart: unless-stopped

  node-exporter:
    image: docker.io/prom/node-exporter:latest
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    security_opt:
      - label=disable
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:latest
    ports:
      - "9113:9113"
    command:
      - "-nginx.scrape-uri=http://host.containers.internal:80/stub_status"
    restart: unless-stopped

  blackbox-exporter:
    image: docker.io/prom/blackbox-exporter:latest
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    restart: unless-stopped

  alloy:
    image: docker.io/grafana/alloy:latest
    ports:
      - "12345:12345"
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    environment: {}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - ${LOGS_DIR:-/opt/creditcardanalyzer/logs}:/logs:ro
    security_opt:
      - label=disable
    user: "0:0"
    restart: unless-stopped

  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:latest
    ports:
      - "9882:9882"
    command:
      - "--collector.enable-all"
      - "--web.listen-address=:9882"
    volumes:
      - /run/user/1000/podman:/run/podman:ro
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
      HOME: /tmp
    user: "1000:1000"
    security_opt:
      - label=disable
    restart: unless-stopped

volumes:
  prometheus_data:
    external: true
    name: oikonomia_prometheus_data
  grafana_data:
    external: true
    name: oikonomia_grafana_data
  loki_data:
    external: true
    name: oikonomia_loki_data
  alloy_data:

networks:
  # Red interna del stack de monitoreo: prometheus, loki, alloy y grafana se
  # resuelven por nombre de servicio.
  default: {}
  # Red compartida con la plataforma. Sólo grafana se engancha, para que nginx
  # (proyecto oikonomia-nginx) y el backend puedan alcanzarlo por `grafana:3000`
  # sin exponer el puerto en el host.
  oikonomia:
    external: true
    name: ${NETWORK_NAME:-oikonomia}