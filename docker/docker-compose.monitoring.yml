services:
  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:latest
    network_mode: host
    environment:
      DATA_SOURCE_NAME: "postgresql://expenses_user:${POSTGRES_PASSWORD}@localhost:5432/expenses?sslmode=disable"
    restart: unless-stopped

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:latest
    network_mode: host
    environment:
      REDIS_ADDR: "redis://localhost:6379"
    restart: unless-stopped

  node-exporter:
    image: docker.io/prom/node-exporter:latest
    network_mode: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    security_opt:
      - label=disable
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:latest
    network_mode: host
    command:
      - "-nginx.scrape-uri=http://127.0.0.1:80/stub_status"
    ports:
      - "9113:9113"
    restart: unless-stopped

  blackbox-exporter:
    image: docker.io/prom/blackbox-exporter:latest
    network_mode: host
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    restart: unless-stopped

  alloy:
    image: docker.io/grafana/alloy:latest
    network_mode: host
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER}
      GRAFANA_CLOUD_PROMETHEUS_PASSWORD: ${GRAFANA_CLOUD_PROMETHEUS_PASSWORD}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_LOKI_PASSWORD: ${GRAFANA_CLOUD_LOKI_PASSWORD}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    security_opt:
      - label=disable
    restart: unless-stopped

  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:latest
    network_mode: host
    command:
      - "--collector.enable-all"
    volumes:
      - /run/user/1000/podman:/run/podman:ro
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
      HOME: /tmp
    user: "1000:1000"
    restart: unless-stopped

volumes:
  alloy_data: