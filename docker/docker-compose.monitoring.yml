services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.listen-address=:9090"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-oikonomia2026}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN_NAME:-oikonomia.ar}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/status.json
      # OAuth2 via Oikonomia backend
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Oikonomia"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-grafana-oikonomia}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://platform.${DOMAIN_NAME:-oikonomia.ar}/api/auth/oauth/grafana/authorize"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://platform.${DOMAIN_NAME:-oikonomia.ar}/api/auth/oauth/grafana/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://platform.${DOMAIN_NAME:-oikonomia.ar}/api/auth/oauth/grafana/userinfo"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "role"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:latest
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://expenses_user:${POSTGRES_PASSWORD}@host.containers.internal:5432/expenses?sslmode=disable"
    restart: unless-stopped

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:latest
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://host.containers.internal:6379"
    restart: unless-stopped

  node-exporter:
    image: docker.io/prom/node-exporter:latest
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    security_opt:
      - label=disable
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:latest
    ports:
      - "9113:9113"
    command:
      - "-nginx.scrape-uri=http://host.containers.internal:80/stub_status"
    restart: unless-stopped

  blackbox-exporter:
    image: docker.io/prom/blackbox-exporter:latest
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    restart: unless-stopped

  alloy:
    image: docker.io/grafana/alloy:latest
    ports:
      - "12345:12345"
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    environment: {}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    security_opt:
      - label=disable
    restart: unless-stopped

  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:latest
    ports:
      - "9882:9882"
    command:
      - "--collector.enable-all"
      - "--web.listen-address=:9882"
    volumes:
      - /run/user/1000/podman:/run/podman:ro
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
      HOME: /tmp
    user: "1000:1000"
    security_opt:
      - label=disable
    restart: unless-stopped

volumes:
  prometheus_data:
    external: true
    name: oikonomia_prometheus_data
  grafana_data:
    external: true
    name: oikonomia_grafana_data
  loki_data:
    external: true
    name: oikonomia_loki_data
  alloy_data: