# Tope para el journal de systemd. Es distinto de journal.log: éste es el
# journal propio del host, que podman y los servicios del sistema escriben.
# Sin tope, el default de journald (10% del disco, hasta 4GB) se come el disco
# justo cuando más hace falta.
#
# Instalado en /etc/systemd/journald.conf.d/oikonomia.conf por deploy.yml.
[Journal]
SystemMaxUse=1G
MaxRetentionSec=15day
