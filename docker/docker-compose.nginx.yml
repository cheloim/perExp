services:
  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro,z
      - ./nginx/maintenance:/usr/share/nginx/maintenance:ro
    healthcheck:
      # Check that nginx is responding, NOT that upstream is healthy.
      # 200/301/302 = upstream alive, 502/503/504 = upstream down but nginx is serving maintenance.
      # Only "000" (connection refused) means nginx itself is down.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' --max-time 3 --insecure https://127.0.0.1/ | grep -qE '^[235]'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    external: true
    name: ${NETWORK_NAME:-oikonomia}