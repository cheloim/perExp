services:
  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD}@db:5432/expenses
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      INVESTMENTS_LLM_API_KEY: ${INVESTMENTS_LLM_API_KEY}
      MESSAGES_BOT_LLM_API_KEY: ${MESSAGES_BOT_LLM_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-NikoFin_bot}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      FRONTEND_URL: https://${PLATFORM_DOMAIN}
      BASE_URL: https://${PLATFORM_DOMAIN}
      CORS_ORIGINS: https://${DOMAIN_NAME},https://www.${DOMAIN_NAME},https://${PLATFORM_DOMAIN}
      TELEGRAM_BOT_ENABLED: "false"
      TZ: America/Argentina/Buenos_Aires
    restart: unless-stopped

  celery_worker:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 5 2>/dev/null | grep -q OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD}@db:5432/expenses
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      INVESTMENTS_LLM_API_KEY: ${INVESTMENTS_LLM_API_KEY}
      MESSAGES_BOT_LLM_API_KEY: ${MESSAGES_BOT_LLM_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      TZ: America/Argentina/Buenos_Aires
    restart: unless-stopped

  celery_beat:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    command: celery -A app.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,os; r=redis.from_url(os.getenv('REDIS_URL','redis://localhost:6379/0')); exit(0 if r.get('celery_beat:heartbeat') else 1)\""]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DATABASE_URL: postgresql://expenses_user:${POSTGRES_PASSWORD}@db:5432/expenses
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      INVESTMENTS_LLM_API_KEY: ${INVESTMENTS_LLM_API_KEY}
      MESSAGES_BOT_LLM_API_KEY: ${MESSAGES_BOT_LLM_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      TZ: America/Argentina/Buenos_Aires
    restart: unless-stopped

  platform-frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

networks:
  default:
    external: true
    name: ${NETWORK_NAME:-oikonomia}