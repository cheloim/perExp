# Nginx edge — smart router for oikonomia.ar (landing) + platform.oikonomia.ar (app)
# Source of truth: docker/nginx/nginx.conf
# Variables substituted at deploy time by sed (${DOMAIN_NAME}, ${PLATFORM_DOMAIN}, ${DNS_RESOLVER})

# DNS resolver: re-resolve upstream hostnames every 10s to prevent stale-IP 502s.
# ${DNS_RESOLVER} is the podman network gateway running aardvark-dns, computed
# at deploy time from `podman network inspect` — never hardcoded, so network
# recreation (which can change the gateway IP) can't break nginx DNS.
# Note: 127.0.0.11 (Docker default) doesn't work in rootless podman.
resolver ${DNS_RESOLVER} valid=10s ipv6=off;

# HTTP -> HTTPS redirect (all domains)
# stub_status is served on port 80 for nginx-exporter (before redirect)
server {
    listen 80 default_server;
    server_name _;

    # Internal: stub_status for nginx-exporter (no redirect)
    location /stub_status {
        stub_status;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # $host, no el dominio fijo: `http://grafana.<dominio>/x` tiene que volver a
    # grafana, no al apex. Con ${DOMAIN_NAME} el redirect perdía el host.
    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> apex redirect
server {
    listen 443 ssl;
    http2 on;
    server_name www.${DOMAIN_NAME};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://${DOMAIN_NAME}$request_uri;
}

# Landing site: oikonomia.ar
# Servida por el contenedor `landing` (misma imagen que el frontend: el SPA ya
# renderiza el sitio institucional cuando el hostname es el apex). Tiene que
# sobrevivir a los deploys de la plataforma, así que NO puede depender de
# platform-frontend: deploy-platform lo detiene durante la ventana de update.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name ${DOMAIN_NAME};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Maintenance page when upstream is down
    error_page 502 503 504 /platform-maintenance.html;

    location = /platform-maintenance.html {
        root /usr/share/nginx/maintenance;
        internal;
    }

    location / {
        # Variable forces nginx to re-resolve DNS via the resolver directive.
        # Without this, nginx caches the IP at startup and never updates it.
        set $landing_upstream landing:80;
        proxy_pass http://$landing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }
}

# App: platform.oikonomia.ar
# Served by platform-frontend container (or BFF in the future)
# Falls back to maintenance page when upstream is down
server {
    listen 443 ssl;
    http2 on;
    server_name ${PLATFORM_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${PLATFORM_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PLATFORM_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: https:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https:; frame-src https://accounts.google.com https://oauth.telegram.org; frame-ancestors 'self' https://*.telegram.org https://telegram.org https://*.t.me" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Maintenance page — served automatically when platform is down (502/503/504)
    error_page 502 503 504 /platform-maintenance.html;

    location = /platform-maintenance.html {
        root /usr/share/nginx/maintenance;
        internal;
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /";
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        return 404;
    }

    # Un callback de OAuth durante el mantenimiento tiene que ver la página,
    # no un 502 crudo: por eso intercepta igual que location /.
    location /oauth/ {
        set $platform_upstream platform-frontend:80;
        proxy_pass http://$platform_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location / {
        set $platform_upstream platform-frontend:80;
        proxy_pass http://$platform_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_intercept_errors on;
    }

    location = /api/metrics {
        deny all;
        return 404;
    }
}

# Grafana: grafana.oikonomia.ar
# Upstream por nombre de servicio en la red compartida `oikonomia`, no por
# host.containers.internal: así Grafana no necesita publicar el 3000 en todas
# las interfaces y el backend puede llamarlo por `grafana:3000`.
server {
    listen 443 ssl;
    http2 on;
    server_name grafana.${DOMAIN_NAME};

    ssl_certificate /etc/letsencrypt/live/grafana.${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.${DOMAIN_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Grafana expone /metrics por default. No es información pública.
    location = /metrics {
        deny all;
        return 404;
    }

    # La salud la necesita el uptime check externo: queda pública.
    location = /api/health {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Consultas largas a Loki: el default de 60s devuelve 504.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket support for Grafana live
    location /api/live/ {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sin esto nginx cierra el websocket cada 60s y Grafana Live reconecta.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
