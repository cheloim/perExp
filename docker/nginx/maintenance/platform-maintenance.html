<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oikonomia — Actualizando plataforma</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 480px;
            padding: 2rem;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #38bdf8;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #f1f5f9;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .hint {
            font-size: 0.875rem;
            margin-top: 2rem;
            color: #64748b;
        }
        .hint a {
            color: #38bdf8;
            text-decoration: none;
        }
        .hint a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Oikonomia</div>
        <div class="icon">&#x21BB;</div>
        <h1>Actualizando la plataforma</h1>
        <p>Estamos realizando mejoras. La plataforma estara de vuelta en unos minutos.</p>
        <p class="hint">
            Mientras tanto, podes visitar
            <a href="https://oikonomia.ar">nuestro sitio institucional</a>.
        </p>
    </div>
</body>
</html>
