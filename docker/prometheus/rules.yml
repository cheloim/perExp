groups:
  - name: llm
    rules:
      # ── Presupuesto mensual ────────────────────────────────────────────
      - alert: LLMMonthlyBudgetNearlyExhausted
        expr: oikonomia_llm_budget_used_ratio >= 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gasto de LLM al {{ $value | humanizePercentage }} del presupuesto mensual"
          description: "oikonomia-llm / spend_usd_month_to_date para el detalle por feature."

      - alert: LLMMonthlyBudgetExhausted
        expr: oikonomia_llm_budget_used_ratio >= 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "El gasto de LLM del mes superó el presupuesto configurado"

      # ── Crédito prepago ───────────────────────────────────────────────
      - alert: LLMCreditLow
        expr: oikonomia_llm_credit_amount_usd > 0 and oikonomia_llm_credit_balance_usd < 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Quedan ${{ $value }} de crédito prepago para el LLM"

      - alert: LLMCreditExpiringSoon
        expr: oikonomia_llm_credit_expires_timestamp_seconds > 0 and (oikonomia_llm_credit_expires_timestamp_seconds - time()) < 2592000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "El crédito prepago del LLM vence en menos de 30 días"
          description: "Los créditos prepagos de OpenAI vencen 12 meses después de la compra."

      # ── Salud de las llamadas ─────────────────────────────────────────
      - alert: LLMHighErrorRate
        expr: sum(rate(oikonomia_llm_requests_total{status!="ok"}[10m])) / clamp_min(sum(rate(oikonomia_llm_requests_total[10m])), 0.000001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Más del 5% de las llamadas al LLM están fallando"

      - alert: LLMMetricsRecordingFailing
        expr: rate(oikonomia_llm_metrics_record_failures_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "El uso del LLM no se está registrando: el dashboard quedó ciego"
          description: "Redis rechazó los registros de uso. La app sigue, pero no hay métricas ni control de presupuesto."
